<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>
</head>

<div class="header">
  <h1>109年 華語領隊｜領隊觀光資源概要</h1>

<script>
const QUESTIONS = [{"num": 1, "text": "西元 1941 年，臺灣人林阿生受臺灣殖民政府徵召，前往海南島。他的身分最可能是下列那一項？", "opts": ["少年工 [B] 志願兵 [C] 義勇隊隊員 [D] 軍伕", "", "", ""], "ans": 3}, {"num": 2, "text": "西元 1990 年代以前，臺灣海峽兩岸關係的演變包括①民間交流、②軍事衝突、③政治對峙等三個階段。 這三個階段依時序排列應為：", "opts": ["①②③ [B] ②③① [C] ③①② [D] ③②①", "", "", ""], "ans": 1}, {"num": 3, "text": "名著《孤雛淚》描述英國工業革命後社會的狀況，這本書的作者應是：", "opts": ["洪堡德 [B] 馬克吐恩 [C] 格林兄弟 [D] 狄更斯", "", "", ""], "ans": 3}, {"num": 4, "text": "日耳曼教士馬丁路德批評天主教會，於那一年揭開宗教改革的序幕？", "opts": ["西元 1317 年 [B] 西元 1417 年 [C] 西元 1517 年 [D] 西元 1617 年", "", "", ""], "ans": 2}, {"num": 5, "text": "第二次世界大戰期間，日本占領新加坡後，將新加坡更名為下列那一個名稱？", "opts": ["石叻 [B] 馬來半島 [C] 北島 [D] 昭南島", "", "", ""], "ans": 3}, {"num": 6, "text": "第二次世界大戰以前，德國在希特勒主政期間進行許多重要變革，最重要的內容是：", "opts": ["強調凡爾賽和約 [B] 解散日耳曼邦聯 [C] 管制私營企業 [D] 推動與共黨合作", "", "", ""], "ans": 2}, {"num": 7, "text": "古埃及早期統治範圍可以區分為「上埃及」與「下埃及」兩個不同的政權。「下埃及」的範圍大約應在 現今那個區域？", "opts": ["西奈半島一帶 [B] 尼羅河三角洲一帶 [C] 埃及南邊一帶 [D] 蘇丹一帶", "", "", ""], "ans": 1}, {"num": 8, "text": "19 世紀有學者以「絲路」稱呼歷史上歐、亞之間長期存在的陸路貿易路線，這條貿易路線從中國西安一 直到東地中海。下列何處是「絲路」必經之地：", "opts": ["突尼西亞 [B] 中亞草原 [C] 白令海峽 [D] 千島群島", "", "", ""], "ans": 1}, {"num": 9, "text": "羅馬教廷受到宗教改革的衝擊，開始革新教會，以對抗新教。下列何人自組傳教團體，對外宣教？", "opts": ["奧古斯丁（ AugustineofHippo ） [B] 方濟（ FrancisofAssisi ）", "羅耀拉（ IgnatiusofLoyola ） [D] 本篤（ BenedictofNursia ）", "", ""], "ans": 2}, {"num": 10, "text": "某位史家曾指出：「羅馬帝國的衰亡，乃是過度的擴張帶來的自然、不可避免的結果。」這位十八世紀 啟蒙時代的英國史家指的是：", "opts": ["伯克（ EdmundBurke ） [B] 羅伯森（ WilliamRobertson ）", "休莫（ DavidHume ） [D] 吉朋（ EdwardGibbon ）", "", ""], "ans": 3}, {"num": 11, "text": "西元 19 世紀初，中南美洲獨立運動各地要求獨立時，爭相脫離何國的統治？", "opts": ["美國 [B] 英國 [C] 西班牙 [D] 法國", "", "", ""], "ans": 2}, {"num": 12, "text": "下列那一位政治人物曾參與美國開國初期憲法的制定，並發表一系列有關聯邦憲法理念的文章？", "opts": ["洛克（ JohnLocke ） [B] 林肯（ AbrahamLincoln ）", "潘恩（ ThomasPaine ） [D] 漢彌爾頓（ AlexanderHamilton ）", "", ""], "ans": 3}, {"num": 13, "text": "1963 年美國的民權運動領袖馬丁．路德．金恩（ Martin Luther King ）發起華府大遊行，為黑人爭取權利。 金恩在數十萬人前發表著名的演講，演講標題是：", "opts": ["〈我們絕不投降〉 [B] 〈我們這個時代的和平〉", "〈不自由，毋寧死〉 [D] 〈我有一個夢〉 代號： 3501 頁次： 4 － 2", "", ""], "ans": 3}, {"num": 14, "text": "1967 年，美國青年為表達反戰思想，成立「抵抗」（ The Resistance ）組織。他們鼓勵青年將徵兵卡交還 兵役機關，寧願被法律制裁，也拒絕被徵召服役。他們反對的是那一場戰爭？", "opts": ["韓戰 [B] 越戰 [C] 波斯灣戰爭 [D] 巴拿馬戰爭", "", "", ""], "ans": 1}, {"num": 15, "text": "美國建國後採行新的政治學理制定憲法，其最重要的精神是：", "opts": ["責任內閣 [B] 權力制衡 [C] 神權立國 [D] 中央集權", "", "", ""], "ans": 1}, {"num": 16, "text": "南美洲的最大國家巴西，使用葡萄牙語，與南美其他各國的語言不同，主要原因是：", "opts": ["1494 年教宗協調該地歸葡萄牙人經營", "拿破崙戰爭期間，法軍占領此地，禁止西班牙語", "該地脫離西班牙獨立，選擇葡萄牙文為國語", "二次大戰後，聯合國託管委員會辦理公投之結果"], "ans": 0}, {"num": 17, "text": "西元前六世紀，一個強權興起，不斷向外擴張並征服埃及等地，這個強權是：", "opts": ["波斯帝國 [B] 馬其頓王國 [C] 羅馬帝國 [D] 土耳其帝國", "", "", ""], "ans": 0}, {"num": 18, "text": "西元 1830 年慘烈的瓜哇戰爭（ Java War ；或稱狄波‧內哥羅起義 [Dipo Negoro Revolt] ）結束後，荷蘭殖 民政府為應付戰後經濟衰蔽，在印尼推行強迫種植制度，使荷蘭經濟迅速復甦。推動此一種植制度的是：", "opts": ["赫曼‧丹德爾（ HermannDaendells ） [B] 湯瑪斯‧萊佛士（ ThomasStamfordRaffles ）", "約翰‧波須（ JohannesVandenBosch ） [D] 霍維爾（ BaronHoevell ）", "", ""], "ans": 2}, {"num": 19, "text": "西元 1922 年，某人創立香港第一間電影製片公司－民新影片公司，畢生致力於以電影啟導民智，發揚文 化與藝術，被稱為「香港電影之父」，這人應是：", "opts": ["黎民偉 [B] 張善琨 [C] 邵逸夫 [D] 鄒文懷", "", "", ""], "ans": 0}, {"num": 20, "text": "西元 8 世紀中期，唐朝高仙芝的軍隊在某戰爭中，被穆斯林打敗，軍中的造紙工匠被俘虜後，技術乃逐 漸西傳。這場戰爭是：", "opts": ["發生於中亞地區的怛羅斯之役 [B] 發生於北非地區的迦太基戰爭", "發生於蒙古地區的準噶爾之役 [D] 發生於烏克蘭的克里米亞戰爭", "", ""], "ans": 0}, {"num": 21, "text": "明代初期，道教正式由官方劃分為兩大派，它們分別是：", "opts": ["正一道與全真道 [B] 五斗米道與太平道 [C] 太平道與全真道 [D] 一貫道與全真道", "", "", ""], "ans": 0}, {"num": 22, "text": "西魏北周時期，宇文泰為了與東魏北齊爭霸，組建一支新軍，此稱之為：", "opts": ["綠營兵制 [B] 北府兵制 [C] 府兵制 [D] 八旗兵制", "", "", ""], "ans": 2}, {"num": 23, "text": "好望角（ Cape of Good Hope ）位於南非西南端，其附近海域終年狂風巨浪而航行困難，在大航海時代曾 被葡萄牙航海家迪亞士（ B. Dias ）稱為「風暴角」。由好望角的位置判斷，海相惡劣除受洋流影響外， 還與該地位居那一個行星風帶有關？", "opts": ["西風 [B] 極地東風 [C] 東南信風 [D] 東北信風", "", "", ""], "ans": 0}, {"num": 24, "text": "東非肯亞的馬賽馬拉（ Masai Mara ）國家公園是著名的野生動物保護區，每年都有數以萬計的角馬、羚羊、 斑馬、水牛、牛羚與長頸鹿等動物從南方的賽倫蓋提（ Serengeti ）地區來到這裡，經過一到二個月的停留， 再循原路踏上歸程，形成世界知名的動物大遷徙景觀。動物大遷徙的景觀和下列何者關係最密切？", "opts": ["火山活動頻繁 [B] 地形平坦單調 [C] 行星風帶季移 [D] 草原植被單純", "", "", ""], "ans": 2}, {"num": 25, "text": "《印度的微光中》一書寫道：「種姓的價值之一，正是它的抗拒改變。種姓制度的中心是具宗教性的純 潔觀念。而純潔則依賴對『業』的信念：我們要對自己的前世負責。」種姓制度受到下列那一個宗教的 影響，而在印度社會中更加根深蒂固？", "opts": ["佛教 [B] 印度教 [C] 耆那教 [D] 錫克教", "", "", ""], "ans": 1}, {"num": 26, "text": "東南亞為東西往來的十字路口，也是海上絲路必經之處。在帆船貿易時代，每年五月到九月，來自印度 或阿拉伯的商旅便順風揚帆，而中國客商則飄送回航，此時吹送的風主要為下列何者？", "opts": ["東北信風 [B] 西北季風 [C] 東南信風 [D] 西南季風", "", "", ""], "ans": 3}, {"num": 27, "text": "曼谷市中心的四面佛是泰國居民信仰中的神祇梵天，常吸引臺灣、中國、港、澳等地旅客前往膜拜。此 一神祇顯示泰國信仰深受下列那國的影響？", "opts": ["中國 [B] 印度 [C] 越南 [D] 印尼 代號： 3501 頁次： 4 － 3", "", "", ""], "ans": 1}, {"num": 28, "text": "下列所述四個世界遺產位處於同一個國家 世界遺產 甲 此地發現包括遠古 巨人、猿人和直立人 描述 等化石。", "opts": ["越南 [B] 印尼", "", "", ""], "ans": 1}, {"num": 29, "text": "下列澳洲的野生動物中，那些是歐洲白人殖民時由外地引進的 尾熊", "opts": ["①②③ [B] ①③④", "", "", ""], "ans": 0}, {"num": 30, "text": "某段旅遊簡介寫到：「這裡被喻為 位置和嚴格的保護，讓它完整保留了原始自然環境 它有火山、峽灣、冰河、平原、 可能為下列何者？", "opts": ["冰島 [B] 帛琉", "", "", ""], "ans": 2}, {"num": 31, "text": "日本廣島縣向來以「雙世界遺產 神社 ③原爆紀念館 ④ 大和博物館", "opts": ["①② [B] ①③", "", "", ""], "ans": 2}, {"num": 32, "text": "日本國土南北狹長，許多地理現象的發生時序會隨著緯度高低而呈現南北漸次變化 那些現象開始的時間是由南向北發生", "opts": ["①②③ [B] ①②⑤", "", "", ""], "ans": 1}, {"num": 33, "text": "下圖是位於日本山口縣的秋芳洞 者？", "opts": ["安山岩", "玄武岩", "石灰岩", "大理岩"], "ans": 2}, {"num": 34, "text": "下文為旅行社某行程的注意事項 1. 採糧票制，每家餐廳菜色及菜量有限 2. 行程皆由政府核備，欲調整或取消 3. 禁止攜帶專業攝影機和長焦照相機 4. 攜手機及 3C 產品入境需申報， 5. 旅遊期間，要聽從導遊安排， 6. 該國國民非常敬仰領袖，民族自尊心強 該行程最可能前往何處？", "opts": ["平壤 [B] 哈瓦那", "", "", ""], "ans": 0}, {"num": 35, "text": "達爾文在下列那一個島上，因觀察到不同小鳥的喙各有不同的長度", "opts": ["大溪地島 [B] 復活節島", "", "", ""], "ans": 3}, {"num": 36, "text": "北美洲的森林資源豐富，該洲的森林分布以下列何地最為豐富", "opts": ["東北部大西洋沿岸", "西北部太平洋沿岸", "", ""], "ans": 2}, {"num": 37, "text": "從自然環境與歷史背景的角度判斷", "opts": ["柑橘、菸草 [B] 下列所述四個世界遺產位處於同一個國家，請判斷其最可能為那一個國家？ 乙 丙 此地發現包括遠古 由 猿人和直立人 甜菜 5 處水稻梯田與水 神廟組成。水神廟是 當地農民重要的信 仰中心，其建立的時 間可追溯至 9 境內有火山以及大 面積的雨林，擁有包 括犀牛在內的 世紀。 57 稀有動植物種。 印尼 [C] 泰國 那些是歐洲白人殖民時由外地引進的 ？①狗 ② 駱駝 ①③④ [C] ②④⑤ 這裡被喻為『世上最後的人間淨土』，是太平洋上純淨的島國 讓它完整保留了原始自然環境，國土有 30% 列入國家保護區 、瀑布、湖泊等自然景觀，來到此處彷彿世外桃源 帛琉 [C] 紐西蘭       </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
</body>
</html>
