<!DOCTYPE html>

<title>108年 華語領隊 領隊執業法規</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>
</head>
<body>
<div class="header">
  <h1>108年 華語領隊｜領隊執業法規</h1>

</div>

    <button class="filter-btn" onclick="filterQ('correct')">答對</button>

    <button class="submit-btn" onclick="submitQuiz()">交卷</button>

</div>

</div>
<script>
const QUESTIONS = [{"num": 1, "text": "我國發展觀光條例最早於何時制定公布？", "opts": ["民國 58 年 7 月 30 日", "民國 69 年 11 月 24 日", "民國 88 年 6 月 30 日", "民國 90 年 11 月 14 日"], "ans": 0}, {"num": 2, "text": "依旅行業管理規則規定，有關不得聘為旅行業經理人之敘述，下列何者錯誤？", "opts": ["曾犯內亂、外患罪，經判決確定或通緝有案尚未結案者", "曾犯背信罪，經受有期徒刑 1 年以上之宣告，服刑期滿尚未逾 2 年者", "曾服公務虧空公款，經判決確定服刑期滿尚未逾 2 年者", "曾經營旅行業受撤銷或廢止執照處分，尚未逾 5 年者"], "ans": 0}, {"num": 3, "text": "依旅行業管理規則規定，旅行業與旅客簽定之旅遊契約書應保管多久？", "opts": ["1 個月", "3 個月", "半年", "1 年"], "ans": 3}, {"num": 4, "text": "旅行業舉辦觀光團體旅遊業務，發生緊急事故時，依旅行業管理規則規定，事故發生後旅行業應於下列 何時限內，向交通部觀光局報備？", "opts": ["12 小時", "24 小時", "36 小時", "72 小時"], "ans": 1}, {"num": 5, "text": "依旅行業管理規則規定，具備下列何項資格者可參加旅行業經理人訓練？", "opts": ["大專以上學校畢業或高等考試及格，曾任海陸空客運業務單位主管 2 年", "大專以上學校畢業或高等考試及格，曾任領隊 5 年", "國民中學畢業，曾任旅行業專任職員 8 年", "高級中等學校畢業，曾任旅行業專任職員 6 年"], "ans": 3}, {"num": 6, "text": "依旅行業管理規則規定，旅行業投保之責任保險，每一旅客及隨團服務人員意外死亡之最低投保金額為 新臺幣多少元？", "opts": ["100 萬元", "200 萬元", "300 萬元", "500 萬元"], "ans": 1}, {"num": 7, "text": "依領隊人員管理規則規定，領隊人員取得結業證書或執業證後，連續多久未執行領隊業務者，應依規定 重行參加訓練結業，領取或換領執業證後，始得執行領隊業務？", "opts": ["半年", "1 年", "2 年", "3 年"], "ans": 3}, {"num": 8, "text": "依領隊人員管理規則規定，領隊人員之訓練、執業證核發、管理、獎勵及處罰等事項，由交通部委任那 一個機關執行之？", "opts": ["內政部移民署", "交通部觀光局", "外交部領事事務局", "縣（市）政府"], "ans": 1}, {"num": 9, "text": "依領隊人員管理規則之規定，補發領隊人員結業證書，應繳納證書費每件新臺幣幾元？", "opts": ["300 元", "500 元", "800 元", "1,000 元"], "ans": 1}, {"num": 10, "text": "民宿是提供旅客鄉野生活之住宿處所，依民宿管理辦法規定，下列那個地方可申請設置民宿？", "opts": ["彰化市都市計畫地區", "宜蘭市都市計畫地區", "馬公市都市計畫地區", "嘉義市都市計畫地區"], "ans": -1}, {"num": 11, "text": "依發展觀光條例規定，下列何種觀光產業，主管機關未核發給觀光專用標識？", "opts": ["觀光旅館業", "旅館業", "觀光遊樂業", "旅行業"], "ans": 3}, {"num": 12, "text": "民法旅遊專節中之各項請求權時效為何？", "opts": ["自旅遊終了或應終了時起 3 年間", "自旅遊開始或應開始時起 1 年間", "自旅遊終了或應終了時起 1 年間", "自旅遊開始或應開始時起 3 年間"], "ans": 2}, {"num": 13, "text": "旅客報名參加旅行團後，要求改由他人參加時，依民法規定旅行社之處理方式，下列何者正確？", "opts": ["無論如何都應該接受", "無論如何都不同意", "確因證件趕辦不及得拒絕之", "因成本增加而拒絕之"], "ans": 2}, {"num": 14, "text": "下列何者為民法「旅遊服務」完整之定義？", "opts": ["提供旅客旅遊資訊服務", "提供旅客代購機票、代訂飯店之服務", "為旅客安排旅程及提供交通、膳宿、導遊或其他有關之服務", "提供旅客代購機票、膳宿、導遊之服務"], "ans": 2}, {"num": 15, "text": "因可歸責於旅遊營業人之事由，致旅遊服務未具備通常之價值或約定之品質，依民法規定，下列何項不 是旅客得主張之權利？", "opts": ["請求減少費用", "請求 2 倍違約金", "請求損害賠償", "終止契約"], "ans": 1}, {"num": 16, "text": "依國外旅遊定型化契約範本規定，出發前，旅遊團所前往旅遊地區之一，有事實足認危害旅客生命、身 體、健康、財產安全之虞者，下列敘述何者正確？", "opts": ["旅客得解除契約，不需支付任何費用", "旅行社得解除契約，不需支付任何費用", "旅行社應將全部旅遊費用退還旅客，不得扣除任何費用", "旅客得解除契約，除應負擔必要支付費用外，並應補償旅行社不超過百分之五之旅遊費用"], "ans": 3}, {"num": 17, "text": "依國外旅遊定型化契約範本規定，旅遊活動開始後有關費用之退還，下列敘述何者正確？", "opts": ["旅客於中途離隊退出旅遊活動時，得請求旅行社退還未完成部分之旅遊費用", "旅行社因旅客退出旅遊活動後，應可節省或無須支付之費用，應退還旅客", "旅客未能及時參加排定之旅遊項目，得請求旅行社退還該旅遊項目之費用", "旅客未能及時搭乘飛機、車、船等交通工具時，得請求旅行社退還該交通工具之費用"], "ans": 1}, {"num": 18, "text": "旅遊營業人安排旅客在特定場所購物，其所購物品有瑕疵者，依國外旅遊定型化契約範本規定，旅客得 於受領所購物品多久之內，請求旅遊營業人協助及處理？", "opts": ["1 個月", "2 個月", "3 個月", "6 個月"], "ans": 0}, {"num": 19, "text": "因可歸責於旅行業之事由，致旅遊活動無法成行者，旅行業於知悉無法成行時，應即通知旅客並說明其 事由；其已通知，且通知是在出發前第 21 日至第 30 日以內到達旅客者，依國外旅遊定型化契約範本規 定，應賠償旅遊費用多少的違約金？", "opts": ["10%", "20%", "30%", "50%"], "ans": 1}, {"num": 20, "text": "李小姐報名參加團費新臺幣 30,000 元，預計於 5 月 10 日出發的東京 5 日之旅，但 5 月 3 日因家中臨時 發生緊急事件，通知旅行社取消行程，依國外旅遊定型化契約範本規定，旅行社得向李小姐請求新臺幣 多少元之賠償金？", "opts": ["3,000 元", "4,000 元", "6,000 元", "9,000 元"], "ans": 3}, {"num": 21, "text": "依民法之規定，旅遊營業人因不得已之事由而變更旅遊內容時，下列敘述何者錯誤？", "opts": ["其因此所減少之費用，應退還於旅客", "其因此所增加之費用，應由旅客負擔", "旅遊營業人因而變更旅程時，旅客不同意者，得終止契約", "旅客不同意旅遊營業人變更旅程時，得終止契約並得請求旅遊營業人墊付費用將其送回原出發地"], "ans": 1}, {"num": 22, "text": "依發展觀光條例規定，下列何項業務非旅行業者亦可經營？", "opts": ["接受旅客委託代辦出、入國境及簽證手續", "招攬或接待觀光旅客，並安排旅遊、食宿及交通", "設計旅程、安排導遊人員或領隊人員", "代售日常生活所需國內海、陸、空運輸事業之客票"], "ans": 3}, {"num": 23, "text": "依照發展觀光條例規定，對下列那一個業者因旅遊糾紛所生之債權，其所繳交之保證金，旅客有優先受 償之權？", "opts": ["觀光旅館業", "旅館業", "旅行業", "民宿業"], "ans": 2}, {"num": 24, "text": "未依發展觀光條例規定取得執業證而執行導遊人員或領隊人員業務者，應處罰鍰之範圍為何？", "opts": ["新臺幣 3 千元以上 1 萬 5 千元以下", "新臺幣 5 千元以上 2 萬 5 千元以下", "新臺幣 1 萬元以上 5 萬元以下", "新臺幣 3 萬元以上 15 萬元以下"], "ans": 2}, {"num": 25, "text": "依旅行業管理規則規定，旅行業經申請核准籌設後，最長應於多久時間內依法辦妥公司設立登記，備具 文件，並繳納旅行業保證金、註冊費向交通部觀光局申請註冊？", "opts": ["15 日", "20 日", "1 個月", "2 個月"], "ans": 3}, {"num": 26, "text": "大陸地區人民繼承臺灣地區人民之遺產，應於繼承開始起多久時間內，以書面向被繼承人住所地之法院 為繼承之表示，逾期視為拋棄其繼承權？", "opts": ["5 年", "3 年", "2 年", "被繼承人在臺灣地區之遺產若未超過新臺幣 200 萬元則無時間限制"], "ans": 1}, {"num": 27, "text": "兩位臺商因商業糾紛，在大陸地區人民法院提起訴訟。勝訴的臺商取得大陸民事判決返臺後，必須向下 列那個機關聲請認可？", "opts": ["經濟部", "大陸委員會", "法院", "財政部"], "ans": 2}, {"num": 28, "text": "遇有重大突發事件，影響臺灣地區重大利益或於兩岸互動有重大危害情形者，得經立法院議決由行政院 公告於一定期間內，對臺灣地區人民進入大陸地區，採行禁止、限制或其他必要之處置，立法院如於會 期內於「多長時間內」未為決議，視為同意？", "opts": ["4 個月", "3 個月", "2 個月", "1 個月"], "ans": 3}, {"num": 29, "text": "大陸地區人民在臺設有戶籍後，擔任下列何項職務，仍受設籍須滿 10 年之限制？", "opts": ["經濟部所屬國營事業機關（構），不涉及國家安全或機密科技研究之聘僱人員", "交通部所屬國營事業機關（構），不涉及國家安全或機密科技研究之聘僱人員", "財政部所屬國營事業機關（構），不涉及國家安全或機密科技研究之聘僱人員", "經中央目的事業主管機關核可受聘擔任學術研究機構之研究員"], "ans": 2}, {"num": 30, "text": "在大陸地區出生之大陸地區人民，旅居國外 3 年，如已取得當地國籍，欲來臺觀光，應依何種身分提出 申請？", "opts": ["外國人", "大陸地區人民", "無國籍人", "無戶籍國民"], "ans": 1}, {"num": 31, "text": "旅客或隨交通工具服務人員，攜帶人民幣入出境之限額為多少？", "opts": ["人民幣 6 千元", "人民幣 8 千元", "人民幣 2 萬元", "一律禁止"], "ans": 2}, {"num": 32, "text": "下列有關澳門的「大三巴牌坊」之敘述，何者錯誤？", "opts": ["其正式名稱為「聖保祿大教堂遺址」，一般稱「大三巴」或「牌坊」", "「大三巴」是指「最大的教堂」，焚毀後只剩前壁形似中國傳統牌坊，故又稱「牌坊」", "是澳門的地標性建築之一，同時也為澳門八景之一", "中國大陸「申遺」失敗，因此未列入聯合國世界文化遺產"], "ans": 3}, {"num": 33, "text": "香港、澳門居民在臺灣投資至少多少金額，經中央目的事業主管機關審查通過，得申請來臺居留？", "opts": ["新臺幣 500 萬元", "新臺幣 600 萬元", "新臺幣 1,000 萬元", "新臺幣 1,500 萬元"], "ans": 1}, {"num": 34, "text": "兩岸遣返偷渡犯最早之依據協議為何？", "opts": ["海峽兩岸共同打擊犯罪及司法互助協議", "金門協議", "海峽兩岸空運協議", "海峽兩岸海運協議"], "ans": 1}, {"num": 35, "text": "目前政府規範兩岸關係的主要法律為何？", "opts": ["國家安全法", "香港澳門關係條例", "國家統一綱領", "臺灣地區與大陸地區人民關係條例"], "ans": 3}, {"num": 36, "text": "中華民國護照之申請、核發及管理，依何種法律辦理？", "opts": ["入出國及移民法", "外國護照簽證條例", "護照條例", "國家安全法"], "ans": 2}, {"num": 37, "text": "下列何者非屬應申請換發護照之條件？", "opts": ["護照污損不堪使用", "持照人之相貌變更，與護照照片不符", "護照資料頁記載事項變更", "所持護照非屬現行最新式樣"], "ans": 3}, {"num": 38, "text": "我國國民赴美國從事下列何種活動，符合赴美免簽證之資格？", "opts": ["以商務目的出差一個月以內者", "以媒體工作代表身分旅行一個月以內者", "求學", "移民"], "ans": 0}, {"num": 39, "text": "外國人在我國逾期停留，其禁止入國期間，自離開我國之翌日起算至少為多久？", "opts": ["6 個月", "1 年", "2 年", "3 年"], "ans": 1}, {"num": 40, "text": "外國人持有效居留簽證，經查驗許可入國後，應於入國後幾日內，向內政部移民署申請外僑居留證？", "opts": ["7 日", "14 日", "15 日", "30 日"], "ans": 2}, {"num": 41, "text": "入出國旅客欲申請使用自動查驗通關系統，其年齡須年滿幾歲？", "opts": ["14 歲", "16 歲", "18 歲", "20 歲"], "ans": 0}, {"num": 42, "text": "經核准出境在國外就學之役男，年齡在 24 歲以下，返國後，得檢附經驗證之在國外就讀經當地國教育主 管機關立案之何種學歷以上學校之在學證明申請再出境？", "opts": ["高中", "專科", "大學校院", "沒限制"], "ans": 0}, {"num": 43, "text": "入境旅客攜帶黃金價值逾多少元者，應填報中華民國海關申報單向海關申報，並經紅線檯查驗通關？", "opts": ["美幣 1 萬元", "美幣 2 萬元", "美幣 6 萬元", "新臺幣 6 萬元"], "ans": 1}, {"num": 44, "text": "旅客攜帶外幣入境，超過等值美幣 1 萬元以上者，入境時未經申報，其超過部分將受到何種處分？", "opts": ["重新申報", "封存於海關，出境時准予攜出", "應予沒入", "罰鍰"], "ans": 2}, {"num": 45, "text": "出境旅客隨身或手提行李攜帶金屬尖銳物品（如釘子、毛線針），若其長度不超過多少公分，則可帶上 飛機？", "opts": ["8 公分", "7 公分", "6 公分", "5 公分"], "ans": 3}, {"num": 46, "text": "醫療或梳妝用之非易燃且無毒性噴劑，出境旅客每人最多不可超過多少公升，且應以託運行李方式帶上 航機？", "opts": ["2 公升", "3 公升", "4 公升", "5 公升"], "ans": 0}, {"num": 47, "text": "下列何種檢疫物雖符合檢疫程序，仍不得隨身攜帶入境？", "opts": ["苗木", "蔬菜", "鮮果實", "犬貓"], "ans": 2}, {"num": 48, "text": "旅客隨身攜帶出境之植物及植物產品（除種子、種球以外），其數量在多少公斤以下，申請檢疫時，免 收檢疫費？", "opts": ["10 公斤", "12 公斤", "15 公斤", "20 公斤"], "ans": 0}, {"num": 49, "text": "我國國民用新臺幣辦理出國結匯，達到多少金額即須填寫「外匯收支或交易申報書」？", "opts": ["新臺幣 50 萬元", "新臺幣 100 萬元", "等值美金 10 萬元", "等值美金 50 萬元"], "ans": 0}, {"num": 50, "text": "年滿 20 歲領有國民身分證之個人，每年累積結購或結售外匯之金額，可逕向外匯指定銀行辦理結匯，無 須經中央銀行核准之最高金額為何？", "opts": ["1 百萬美元", "2 百萬美元", "3 百萬美元", "5 百萬美元"], "ans": 3}];
const TOTAL_TIME = 3600;
const KEYS = ['A','B','C','D'];
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let userAnswers = {};
let submitted = false;

function isCorrect(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}

function getCorrectLabel(q) {
  if (q.ans === -1) return '本題一律給分';
  if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
  return KEYS[q.ans] + '：' + q.opts[q.ans];
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (q.ans === -1 ? ' invalid' : '');
    card.id = 'card-' + qi;
    const opts = q.opts.map((opt, i) => {
      const blank_rendered = q.text.includes('______');
      return `<button class="option-btn" id="opt-${qi}-${i}" onclick="selectAnswer(${qi}, ${i})" data-qi="${qi}" data-i="${i}">
        <span class="opt-label">${KEYS[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
