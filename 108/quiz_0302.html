<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>

<script>
const QUESTIONS = [{"num": 1, "text": "清代臺灣對中國大陸的通商口岸附近產生許多今日所謂同業公會或進出口商的組織，下列何者為此類機構？", "opts": ["泉郊", "福建會館", "櫟社", "怡和洋行"], "ans": 0}, {"num": 2, "text": "《理想國》是那一位古希臘哲學家的作品？", "opts": ["亞里斯多德", "蘇格拉底", "柏拉圖", "泰利斯"], "ans": 2}, {"num": 3, "text": "古埃及在中王國時期遭到來自某東方外族入侵與征服，其後上埃及統治者驅逐此一外族，並開啟新王國 時期。此一東方外族係指：", "opts": ["努比亞人（ Nubian ）", "腓尼基人（ Phoenician ）", "西克索人（ Hyksos ）", "阿卡德人（ Arkkadian ）"], "ans": 2}, {"num": 4, "text": "下列有關歐洲中古時期莊園的敘述，何者錯誤？", "opts": ["利用馬匹重犁，以深耕土地", "採用輪耕制，藉此保持地力", "耕地開放不設圍籬，方便共同耕作", "政府先貸錢給民，收成後再取作物"], "ans": 3}, {"num": 5, "text": "歐洲中古時代的「神聖羅馬帝國」，主要是由那一個王國演變而成？", "opts": ["西哥德王國", "薩克森王國", "東法蘭克王國", "西法蘭克王國"], "ans": 2}, {"num": 6, "text": "下列有關歐洲文藝復興人文主義學者的敘述，何者錯誤？", "opts": ["著重研究古典語文", "發掘希臘羅馬精神", "反對研究古拉丁文", "強調培養全人教育"], "ans": 2}, {"num": 7, "text": "衣索比亞（ Ethiopia ）首都「五月五日廣場」（ Meyazia 27 Square ）的紀念碑是為了紀念西元 1941 年戰勝 某歐洲國家、恢復獨立地位。請問此國家是：", "opts": ["德意志", "義大利", "法蘭西", "英格蘭"], "ans": 1}, {"num": 8, "text": "如果要理解新王國時期的古埃及人如何讓靈魂順利進入冥界並通過各種考驗與審判，應該閱讀那一個文獻？", "opts": ["出埃及記", "金字塔文", "智慧文學", "死者之書"], "ans": 3}, {"num": 9, "text": "歐洲那一國於西元 1807 年通過廢除奴隸貿易法案，其他各國陸續跟進，非洲黑人貿易才逐漸斷絕？", "opts": ["德國", "英國", "法國", "西班牙"], "ans": 1}, {"num": 10, "text": "發表《物種原始》一書，並提出進化論主張的學者是：", "opts": ["亞當斯密", "佛洛伊德", "尼采", "達爾文"], "ans": 3}, {"num": 11, "text": "有鐵血宰相之稱，並帶領日耳曼走向統一的人是：", "opts": ["加富爾", "俾斯麥", "梅特涅", "加里波底"], "ans": 1}, {"num": 12, "text": "西元 1960 年代，美國大學生為爭取言論自由，發起「自由言論運動」（ Free Speech Movement ），請問 這項運動最早起於下列何地？", "opts": ["加州大學柏克萊分校", "哥倫比亞大學", "芝加哥大學", "阿拉巴馬大學"], "ans": 0}, {"num": 13, "text": "北美十三州殖民地尋求獨立的決心，與下列何者無關？", "opts": ["受法國大革命成功的鼓舞", "不需要英國保護", "歐洲啟蒙思想發展", "西元 1776 年英國通過印花稅法"], "ans": 0}, {"num": 14, "text": "第二次世界大戰後，美國對歐洲提供經濟援助以協助民主國家進行戰後重建，期以社會安定的力量來抵 制共黨勢力的擴張，這種援助以下列那一構想進行？", "opts": ["道威斯（ Dawes ）計畫", "馬歇爾（ Marshall ）計畫", "楊格（ Young ）計畫", "曼哈頓（ Manhattan ）計畫"], "ans": 1}, {"num": 15, "text": "提出民有、民治及民享的人是：", "opts": ["華盛頓", "傑佛遜", "林肯", "羅斯福"], "ans": 2}, {"num": 16, "text": "常見的華納、派拉蒙、米高梅、環球等製片公司的影片，是由那一國發行？", "opts": ["英國", "義大利", "法國", "美國"], "ans": 3}, {"num": 17, "text": "英國政府為了維持軍隊在北美洲殖民地的費用因而徵稅，爆發了何項事件？", "opts": ["波士頓茶葉黨事件", "七年戰爭", "傑弗遜革命（ Jeffersonian Revolution ）", "門羅主義"], "ans": 0}, {"num": 18, "text": "《真臘風土記》曾敘述吳哥王朝時期的柬埔寨。此書作者是誰？", "opts": ["范成大", "周達觀", "丘處機", "趙孟頫"], "ans": 1}, {"num": 19, "text": "荷蘭人於西元 1602 年設立荷蘭東印度公司，進行東方的貿易活動，並將總部設於巴達維亞城（ Batavia ）。 巴達維亞城為今日的下列何地？", "opts": ["新加坡", "麻六甲", "雅加達", "曼谷"], "ans": 2}, {"num": 20, "text": "西元 1948 年馬來亞共產黨發動起事，反抗英國殖民統治，該黨的領導人是：", "opts": ["東姑阿都拉曼（ Tunku Abdul Rahman ）", "陳禎祿", "林吉祥", "陳平"], "ans": 3}, {"num": 21, "text": "漢朝初年規定以戶為單位，人人有籍，不得隨意遷徙，稱為：", "opts": ["編戶齊民", "門第", "黃冊", "統宗譜"], "ans": 0}, {"num": 22, "text": "佛教典籍向有「三藏」之說，請問這「三藏」所指為何？", "opts": ["經藏，律藏，論藏", "經藏，密藏，佛藏", "道藏，論藏，律藏", "經藏，律藏，密藏"], "ans": 0}, {"num": 23, "text": "到八達嶺長城旅遊時，導遊說：「我們已經來到了八達嶺長城，您可以發現這裡的 ①長城分為南、北 兩峰，均選擇於山脊興築。甕城是長城的一個重要組成部分，八達嶺的甕城 ②受地形限制，依山就勢， 東低西高，東窄西寬， ③甕城內無井，水源缺乏，守城部隊駐在西北三里的岔道城……這裡是古代重 要的 ④軍事防禦關口，而且也是交通要道，路從此分，四通八達，八達嶺也因此得名。」文中底線部分， 何者是在描述八達嶺長城「位置」的重要性？", "opts": ["①", "②", "③", "④"], "ans": 3}, {"num": 24, "text": "臺南沿海有著許多鯤鯓的地名，鯤鯓最可能是下列何種地形景觀？", "opts": ["潟湖", "波蝕棚", "三角洲", "濱外沙洲"], "ans": 3}, {"num": 25, "text": "花東縱谷平原由那些河流共同沖積形成？①立霧溪 ②和平溪 ③花蓮溪 ④秀姑巒溪 ⑤卑南溪", "opts": ["①②③", "①②④", "①④⑤", "③④⑤"], "ans": 3}, {"num": 26, "text": "在同一時間內，臺北市市中心的氣溫經常比郊區的淡水市街為高，最主要原因為何？", "opts": ["風向差異", "地勢高低", "綠地多寡", "熱島效應"], "ans": 3}, {"num": 27, "text": "素有天下第一關之稱的山海關，因服務品質低落等因素，於西元 2015 年 10 月被中國國家旅遊局除去 5A 景區資格。山海關創建於明代，因介於山、海之間而得名。海指渤海，山指的是那一座山脈？", "opts": ["陰山", "燕山", "長白山", "大興安嶺"], "ans": 1}, {"num": 28, "text": "中國「京九高鐵」已於西元 2015 年開工，預計 2022 年全線通車。相較於京滬高鐵與京廣高鐵，京九高 鐵推動時間較晚，主要原因是：", "opts": ["沿線都市經濟發展較遲緩", "沿線地質複雜以致施工困難", "路線北段與大運河水運高度重疊", "沿線跨越河道眾多建築成本高昂"], "ans": 0}, {"num": 29, "text": "中國大陸改革開放後，沿海地區出現許多新興大都市。下列那一都市曾以香港為轉運站，將中國大陸的 產品銷往國外？", "opts": ["深圳市", "舟山市", "東營市", "連雲港市"], "ans": 0}, {"num": 30, "text": "「雲南三江並流保護區是一處世界遺產，是指發源於青藏高原的怒江、瀾滄江和金沙江等河流穿過橫斷 山脈中的峽谷，並行奔流數百公里而不交匯的自然奇觀，此景觀的形成與板塊碰撞有密切關係。」引文 中的板塊是指下列何者？", "opts": ["印澳板塊、歐亞板塊", "印澳板塊、非洲板塊", "歐亞板塊、太平洋板塊", "歐亞板塊、菲律賓海板塊"], "ans": 0}, {"num": 31, "text": "中國西北地區為沙漠化嚴重的地帶，是沙塵暴的源地。沙塵暴發生時不僅華北地區深受影響，韓國、日 本、臺灣也蒙受其害。此沙塵暴最易發生在下列那一季節？", "opts": ["春末夏初", "夏末秋初", "秋末冬初", "冬末春初"], "ans": 3}, {"num": 32, "text": "南美洲是世界熱帶栽培業發達的地區。下列那一地區是熱帶栽培業的主要分布地？", "opts": ["巴西高原", "彭巴草原", "圭亞那高地", "巴塔哥尼亞高原"], "ans": 0}, {"num": 33, "text": "美國的農業人口僅占全國總人口的 2.5% ，但所生產之糧食除自給外還可大量外銷。該國的農業具有下列 那項特性？", "opts": ["耕作方式集約", "單位面積產量高", "單位勞力產量高", "穀類需求被肉類取代"], "ans": 2}, {"num": 34, "text": "廣島的嚴島神社是日本神道信仰的中心，該神社的鳥居被譽為日本三景之一（如下圖所示），因其在漲 退潮時可見不同美景而受到遊客青睞。嚴島神社的鳥居最有可能興建在下列何種地形上？", "opts": ["沙丘", "岬角", "海蝕崖", "潮埔地"], "ans": 3}, {"num": 35, "text": "下列四處為日韓兩國的世界遺產，何者形成的背景與氣候的關係最為密切？", "opts": ["韓國昌德宮", "韓國慶州歷史遺跡", "日本日光的神社與寺院", "日本白川鄉合掌造聚落"], "ans": 3}, {"num": 36, "text": "東南亞各國中，位居麻六甲海峽的出入口，因而有利於發展轉口貿易的國家為下列何者？", "opts": ["印尼", "越南", "泰國", "新加坡"], "ans": 3}, {"num": 37, "text": "下列五個東南亞的世界遺產中，那一些是位於中南半島？①下龍灣 ②婆羅浮屠 ③沙巴神山 ④吳哥 遺跡 ⑤順化紫禁城", "opts": ["①②④", "①④⑤", "②③⑤", "③④⑤"], "ans": 1}, {"num": 38, "text": "燒芭意指用火開墾、清理土地的方式，此方式是造成東南亞煙霾的主因。專家指出赤道地區低層大氣氣 流多為東風，大多時候燒芭對周邊國家不會造成太大影響，但蘇門達臘若在下列那個月份進行燒芭，便 會影響新加坡的空氣品質？", "opts": ["1 月", "3 月", "5 月", "9 月"], "ans": 3}, {"num": 39, "text": "就全年的平均狀態而言，印度半島何處最可能屬於蒸發量大於降水量的缺水區？", "opts": ["西北區", "東北區", "西南區", "東南區"], "ans": 0}, {"num": 40, "text": "東南亞民族眾多複雜，下列那一個國家的主要民族，與中國的京族系出同源？", "opts": ["緬甸", "越南", "新加坡", "馬來西亞"], "ans": 1}, {"num": 41, "text": "西亞乾燥地區居民傳統的生活方式，除了綠洲農業外，主要賴以維生的經濟活動為下列何者？", "opts": ["放牧", "游牧", "欄牧", "山牧季移"], "ans": 1}, {"num": 42, "text": "在非洲進行文化旅遊時，下列那一個國家中最可能看到南島語族與班圖黑人互動的文化景觀？", "opts": ["尼日", "南蘇丹", "莫三比克", "馬達加斯加"], "ans": 3}, {"num": 43, "text": "近年來臺灣許多年輕人到澳洲葡萄園進行打工旅遊。這些葡萄園多位於下列何處？", "opts": ["澳洲東北部", "澳洲中西部", "澳洲西南部", "澳洲東南部"], "ans": -1}, {"num": 44, "text": "流行歌曲〈夏天的聖誕節〉中的一段歌詞：「我想帶你，一起旅行，跟著我，到南邊，遠離北半球的天。 讓陽光直直地照在你我的臉，享受一個可以去衝浪的聖誕節。」若想做到歌詞所寫的情境，最適合前往 下列那個都市？", "opts": ["馬賽", "威尼斯", "布里斯本", "巴爾的摩"], "ans": 2}, {"num": 45, "text": "若欲在旅遊過程中體驗浮潛樂趣，並欣賞海底珊瑚礁生態景觀，下列那一個國家最為適合？", "opts": ["瑞典", "希臘", "阿根廷", "澳大利亞"], "ans": 3}, {"num": 46, "text": "臺灣各地之茶文化中，下列何者錯誤？", "opts": ["臺北木柵的鐵觀音", "花蓮的金桔茶", "南投的凍頂烏龍茶", "臺東的福鹿茶"], "ans": 1}, {"num": 47, "text": "太魯閣國家公園境內，有下列那些原住民族分布？①太魯閣族 ②阿美族 ③泰雅族 ④排灣族 ⑤布 農族", "opts": ["①②③", "①③④", "①④⑤", "①②⑤"], "ans": 0}, {"num": 48, "text": "下列有關能高越嶺國家步道之敘述何者錯誤？", "opts": ["此步道為東西向横跨南投與花蓮兩縣山區", "此步道通過棲蘭野生動物重要棲息環境，蘊藏豐富的自然資源", "此步道原先為日據時代開設，主要目的為理藩及獲取山林資源", "此步道目前為登山遊憩及臺電保修電力設施之用"], "ans": 1}, {"num": 49, "text": "現行福山植物園開放申請入園人數每日限額 500 名（假日 600 名），每單位每次申請名額以 50 人為上限。 此類參訪人數限制在資源管理上屬於下列何種管理措施？", "opts": ["教育宣導", "設施維護", "環境監測", "承載量管制"], "ans": 3}, {"num": 50, "text": "近年來各國旅遊安危事故頻傳，我國「國外旅遊預警分級表」是下列那一個行政單位負責制定？", "opts": ["衛生福利部疾病管制署", "外交部領事事務局", "交通部民用航空局", "交通部觀光局"], "ans": 1}];
const TOTAL_TIME = 3600;
const KEYS = ['A','B','C','D'];
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let userAnswers = {};
let submitted = false;

function isCorrect(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}

function getCorrectLabel(q) {
  if (q.ans === -1) return '本題一律給分';
  if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
  return KEYS[q.ans] + '：' + q.opts[q.ans];
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (q.ans === -1 ? ' invalid' : '');
    card.id = 'card-' + qi;
    const opts = q.opts.map((opt, i) => {
      const blank_rendered = q.text.includes('______');
      return `<button class="option-btn" id="opt-${qi}-${i}" onclick="selectAnswer(${qi}, ${i})" data-qi="${qi}" data-i="${i}">
        <span class="opt-label">${KEYS[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
