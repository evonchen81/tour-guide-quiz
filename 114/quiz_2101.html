function checkAll() {
  let score = 0;
  let unanswered = [];
  QUESTIONS.forEach((item, i) => {
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const block = document.getElementById('q' + i);
    block.classList.remove('unanswered');
    if (!sel) { unanswered.push(i + 1); block.classList.add('unanswered'); return; }
    const chosen = parseInt(sel.value);
    for (let j = 0; j < item.opts.length; j++) {
      document.getElementById(`lbl_${i}_${j}`).classList.remove('correct', 'wrong');
    }
    if (chosen === item.ans) {
      score += 2;
      document.getElementById(`lbl_${i}_${chosen}`).classList.add('correct');
    } else {
      document.getElementById(`lbl_${i}_${chosen}`).classList.add('wrong');
      document.getElementById(`lbl_${i}_${item.ans}`).classList.add('correct');
    }
    document.getElementById(`exp_${i}`).classList.add('show');
  });
  if (unanswered.length > 0) {
    alert(`ä»¥ä¸é¡ç®å°æªä½ç­ï¼ç¬¬ ${unanswered.join('ã')} é¡`);
    return;
  }
  const scoreDiv = document.getElementById('score');
  scoreDiv.style.display = 'block';
  scoreDiv.className = score >= 60 ? 'score-pass' : 'score-fail';
  scoreDiv.textContent = `æ¬æ¬¡å¾åï¼${score} å / 100 åï¼${score >= 60 ? 'åæ ¼ â' : 'ä¸åæ ¼ â'}ï¼`;
  scoreDiv.scrollIntoView({ behavior: 'smooth' });
}

function resetAll() {
  QUESTIONS.forEach((item, i) => {
    document.querySelectorAll(`input[name="q${i}"]`).forEach(r => r.checked = false);
    for (let j = 0; j < item.opts.length; j++) {
      document.getElementById(`lbl_${i}_${j}`).classList.remove('correct', 'wrong');
    }
    document.getElementById(`exp_${i}`).classList.remove('show');
    document.getElementById('q' + i).classList.remove('unanswered');
  });
  document.getElementById('score').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
