<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>

<script>
const QUESTIONS = [{"num": 1, "text": "清代中葉之後，臺灣多數移民的原鄉以那裡為主？", "opts": ["江浙", "浙閩", "閩粵", "粵湘"], "ans": 2}, {"num": 2, "text": "日治時期，總督府主要透過那種機制推動臺灣的放足斷髮運動？", "opts": ["保甲", "警察", "教師", "軍隊"], "ans": 0}, {"num": 3, "text": "現今的非洲國家早期原為歐洲列強的殖民地，而後大多獨立於那一時期？", "opts": ["拿破崙時期", "第一次世界大戰前", "第一次與第二次世界大戰之間", "第二次世界大戰之後"], "ans": 3}, {"num": 4, "text": "文藝復興運動在阿爾卑斯山的發展被稱為「北區文藝復興（ Northern Renaissance ）」，其思想核心是「基督 教人文主義（ Christian Humanism ）」；下列何者是基督教人文主義的思想家或文藝家？", "opts": ["馬基維利（ Nicolo Machiavelli ）", "蒙田（ Michel de Montaigne ）", "佩脫拉克（ Francesco Petrarch ）", "拉菲爾（ Raphel Sanzio ）"], "ans": 1}, {"num": 5, "text": "下列那一位羅馬皇帝在位期間，頒布「米蘭詔令」，賦予基督教合法地位？", "opts": ["尼祿", "狄奧多西一世", "君士坦丁一世", "圖拉真"], "ans": 2}, {"num": 6, "text": "義大利地區的商業復甦、城市興起，成為歐洲文藝復興運動的主要推手。下列何者並非義大利文藝復興時期 的重要城市？", "opts": ["威尼斯", "那不勒斯", "佛羅倫斯", "熱那亞"], "ans": 3}, {"num": 7, "text": "在地理大發現以前，亞洲商品多是由伊斯蘭商人運至地中海東岸地區，然後主要再經由那一個地區的商人轉 運至歐洲市場銷售？", "opts": ["希臘商人", "義大利商人", "西班牙商人", "葡萄牙商人"], "ans": 1}, {"num": 8, "text": "下列有關古埃及宗教信仰的敘述，何者為錯誤？", "opts": ["崇拜自然現象", "官方較推崇太陽神信仰", "民間相當盛行冥王信仰", "不相信靈魂的存在"], "ans": 3}, {"num": 9, "text": "英國於西元 2015 年舉辦有關一份中世紀象徵英國王權開始受到限制的文獻 800 周年紀念活動，這份文獻最 可能是指下列何者？", "opts": ["《大憲章》（ Magna Carta ）", "《權利請願書》（ The Petition of Rights ）", "《權利法案》（ The Bill of Rights ）", "《聯合法案》（ The Treaty of Union ）"], "ans": 0}, {"num": 10, "text": "一位遊客造訪歐洲某教堂，在教堂內部天花板上看到以聖經「創世紀」為主題的壁畫。這座教堂是下列何者？", "opts": ["聖彼得大教堂（ St. Peter's Basilica ）", "西斯汀教堂（ Sistine Chapel ）", "米蘭教堂（ Milan Cathedral ）", "聖母百花大教堂（ Florence Cathedral ）"], "ans": 1}, {"num": 11, "text": "下列那一家汽車公司最先引進生產線，提高生產效率，並大量製造？", "opts": ["寶獅（ PEUGEOT ）", "飛雅特（ FIAT ）", "福斯（ VOLKS WAGEN ）", "福特（ FORD ）"], "ans": 3}, {"num": 12, "text": "下列那個區域的古文明發祥於南美洲地區？", "opts": ["馬雅文明", "印加文明", "阿茲提克文明", "印第安文明"], "ans": 1}, {"num": 13, "text": "中、南美洲國家在歷史上主要受到西班牙的殖民影響，下列何國例外？", "opts": ["墨西哥", "智利", "哥倫比亞", "巴西"], "ans": 3}, {"num": 14, "text": "紐約的自由女神像右手高舉代表自由的火炬，左手則持一部刻有名稱的文獻，請問這部文獻是？", "opts": ["傑佛遜《美國獨立宣言》", "孟德斯鳩《法意》", "洛克《政府論》", "潘恩《常識》"], "ans": 0}, {"num": 15, "text": "下圖這幅政治漫畫表現了一個當代重要政治事件，其反映的是下列何者？", "opts": ["柏林危機", "金蘭灣危機", "古巴危機", "朝鮮半島危機"], "ans": 2}, {"num": 16, "text": "曾經三度前往太平洋，成為首批登陸澳洲東部並環繞紐西蘭航行的歐洲船隊航海家是下列何者？", "opts": ["湯瑪斯．庫克（ Thomas Cook ）", "詹姆斯．庫克（ James Cook ）", "費南多．麥哲倫（ Fernando Magallanes ）", "克里斯托佛．哥倫布（ Cristoforo Colombo ）"], "ans": 1}, {"num": 17, "text": "19 世紀朝鮮李朝的崔濟愚創辦「東學道」以與基督教文明「西學」抗衡。「東學道」又被稱為：", "opts": ["神道教", "天理教", "天道教", "儒道教"], "ans": 2}, {"num": 18, "text": "第二次世界大戰之後，東南亞國家紛紛獨立，以下那一個國家成立於西元 1984 年？", "opts": ["新加坡", "印尼", "汶萊", "馬來西亞"], "ans": 2}, {"num": 19, "text": "7 世紀時，日本仿效中國長安城規劃設計的兩座城市是：", "opts": ["奈良，京都", "東京，大阪", "京都，名古屋", "長崎，奈良"], "ans": 0}, {"num": 20, "text": "下列那個國家不是西元 1990 年代成立的中亞獨立國家國協的加盟國？", "opts": ["阿富汗", "哈薩克", "吉爾吉斯", "烏茲別克"], "ans": 0}, {"num": 21, "text": "唐代玄奘至天竺取經，所行路線的出發城市為下列何者？", "opts": ["洛陽", "西安", "蘭州", "銀川"], "ans": 1}, {"num": 22, "text": "17 世紀時，鹿皮成為臺灣輸出日本的重要商品，請問其原因何在？", "opts": ["日人習慣以鹿皮製作服飾", "日人習慣以鹿皮製作工藝品", "日人視鹿皮為祥瑞之物", "日人習以鹿皮製作盔甲內裡"], "ans": 3}, {"num": 23, "text": "近 10 多年來，臺灣地方農會推出以農作物為名的觀光季活動。下列那一個觀光季是利用該地冬季農作物推 廣地方觀光？", "opts": ["臺中太平枇杷節", "臺南官田菱角季", "臺南白河蓮花季", "高雄美濃白玉蘿蔔季"], "ans": 3}, {"num": 24, "text": "某報導指出：「世足賽中，至少有 10 支國家隊伍的球衣布料，都是來自臺灣」、「全球超過 5 成消防隊的 防火衣布料由臺灣製造」，這些報導說明了曾經是夕陽工業的臺灣紡織業已經產生轉變。下列何者最足以 說明此產業結構轉變的過程？", "opts": ["由勞力密集轉為原料密集", "由原料密集轉為技術密集", "由勞力密集轉為技術密集", "由資本密集轉為技術密集"], "ans": 2}, {"num": 25, "text": "颱風過境臺灣後，常對中南部帶來大量豪雨，所造成的災情有時更甚於颱風的直接侵襲。此種豪雨的形成原 因，最可能與下列那一種氣流有關？", "opts": ["東北氣流", "東南氣流", "西北氣流", "西南氣流"], "ans": 3}, {"num": 26, "text": "臺灣河川多呈東西走向，部分河川出海口自然形成某些行政區劃的界河。請問下列那一條河川是嘉義縣與臺 南市之間的界河？", "opts": ["大安溪", "濁水溪", "北港溪", "八掌溪"], "ans": 3}, {"num": 27, "text": "南水北調進入北京的水量已經突破每年 5 億立方公尺，但並未完全改善北京水資源短缺的情況。導致北京水 資源短缺的根本原因為下列何者？", "opts": ["全球暖化加劇", "人口規模龐大", "地下水補注少", "年雨量變率大"], "ans": 1}, {"num": 28, "text": "中國青藏鐵路被稱為離天堂最近的鐵路，起點為青海西寧，終點為西藏拉薩，全長將近 2,000 公里，耗時 28 年才興建完成。青藏鐵路修築時間曠日費時主要受下列那一項自然因素的限制？", "opts": ["流動沙丘", "鹽鹼土層", "季節凍土", "多土石流"], "ans": 2}, {"num": 29, "text": "早期黃河夏季暴雨時常形成「伏汛」，西元 1970 年代後黃河下游河段卻常發生「斷流」現象。斷流的出現 和下列那一因素關係最為密切？", "opts": ["南水北調", "用水激增", "土地退化", "河川改道"], "ans": 1}, {"num": 30, "text": "近年來中國各大都市的人口規模增加快速，但西元 2010 年的人口統計資料顯示，都市化程度僅 49.95% 。導 致統計數據顯示都市化程度低的原因，和下列那一因素關係最為密切？", "opts": ["一胎化的生育政策", "大西部的開發政策", "城鄉戶籍分隔制度", "一帶一路發展政策"], "ans": 2}, {"num": 31, "text": "五嶽是中國五大名山的總稱。請問下列何者的海拔高度最高？", "opts": ["東嶽泰山", "南嶽衡山", "西嶽華山", "中嶽嵩山"], "ans": 2}, {"num": 32, "text": "波羅的海國家又稱為波羅的海三小國。請問下列那一個國家不是波羅的海三小國之一？", "opts": ["愛沙尼亞", "塞爾維亞", "拉脫維亞", "立陶宛"], "ans": 1}, {"num": 33, "text": "早期美國的棉花生產主要集中於南部各州，近年則逐漸西移至德州和奧克拉荷馬州一帶。佛羅里達州雖然地 處美國南部，但從早期至今卻都沒有棉花栽培，主要原因為下列何者？", "opts": ["土壤貧瘠", "勞力不足", "日照強烈", "終年濕潤"], "ans": 3}, {"num": 34, "text": "北歐芬蘭的經濟基礎以自然資源的採集為主。該國最主要的自然資源為下列何者？", "opts": ["鐵礦", "漁產", "地熱", "森林"], "ans": 3}, {"num": 35, "text": "下列日本的自然環境特徵中，何者與日本「位於東亞島弧」的關係最為密切？", "opts": ["寒暖流交會", "境內火山活動多", "四季景色變化多端", "平原多分布於本州東部"], "ans": 1}, {"num": 36, "text": "西元 2015 年 9 月爆發的「阿蘇火山」是著名的旅遊勝地，其位在日本九州的下列那一縣？", "opts": ["宮崎縣", "熊本縣", "福岡縣", "長崎縣"], "ans": 1}, {"num": 37, "text": "印度阿薩姆紅茶產區的降水豐沛，主要來自下列何種季風帶來的水氣？", "opts": ["東北季風", "西北季風", "東南季風", "西南季風"], "ans": 3}, {"num": 38, "text": "西元 2015 年 8 月，新蘇伊士運河開航。與舊運河相比，新運河是雙向航道，縮短了通航時間近 7 小時，也 讓通行船隻數量雙倍成長。此運河是聯絡下列那二個海域？", "opts": ["黑海、地中海", "紅海、地中海", "地中海、大西洋", "波斯灣、印度洋"], "ans": 1}, {"num": 39, "text": "沙烏地阿拉伯外交部為防止國民參與恐怖活動，且因宗教、外交等因素，目前規定國民禁止以該國護照進出 下列那一個國家？", "opts": ["美國", "伊朗", "俄羅斯", "以色列"], "ans": 3}, {"num": 40, "text": "位於南亞的孟加拉是一個自然災害頻繁的國家。該國最常發生且造成嚴重生命財產損失的自然災害為下列何 者？", "opts": ["地震", "寒害", "乾旱", "洪患"], "ans": 3}, {"num": 41, "text": "「就人口規模而言，這是世界前三大的伊斯蘭教國家之一，人民的日常生活和飲食習慣深受教義影響；但是 對於婦女的服飾要求並不嚴格，顏色五花八門，甚至頭巾和長袖可以自由選擇！」文中所指為下列那一個 國家？", "opts": ["印尼", "孟加拉", "突尼西亞", "沙烏地阿拉伯"], "ans": 0}, {"num": 42, "text": "在印度，麥當勞的點菜單上已有 5 成的餐點是素食，而且將餐點中肉類食材，大多改為雞肉。麥當勞於印度 的經營策略是為了避免冒犯那兩個宗教的信徒，進而採取的因地制宜措施？", "opts": ["佛教、猶太教", "耆那教、基督教", "錫克教、天主教", "印度教、伊斯蘭教"], "ans": 3}, {"num": 43, "text": "某年威廉瓊斯盃國際籃球邀請賽，中華隊對上某國代表隊，在比賽開始之前，該國球員大跳原住民「 Haka 」 舞，驚嚇對手，提升士氣，展現原住民的戰士精神。與中華隊較勁的國家最可能是下列何國？", "opts": ["澳洲", "印尼", "紐西蘭", "菲律賓"], "ans": 2}, {"num": 44, "text": "非洲的熱帶栽培業主要分布於東非和西非，西非沿岸種植作物為油棕、可可、橡膠，而東非則是以咖啡、茶 葉為主。造成兩地農產差異的主要原因為下列何者？", "opts": ["風俗民情不同", "緯度高低不同", "生產技術不同", "地勢高低不同"], "ans": 3}, {"num": 45, "text": "「這裡的聖誕節正值盛夏，聖誕老公公不僅穿上海灘熱褲，還大口吃起冰淇淋。」上述的景觀，最有可能在 那一個都市看到？", "opts": ["多倫多", "墨爾本", "紐奧良", "斯德哥爾摩"], "ans": 1}, {"num": 46, "text": "下列有關地區特色之敘述，何者錯誤？", "opts": ["水里玉露茶園", "田尾公路花園", "大湖草莓觀光果園", "木柵觀光茶園"], "ans": 0}, {"num": 47, "text": "下列那一個遺址屬於國定一級古蹟？", "opts": ["十三行遺址", "八仙洞遺址", "芝山岩遺址", "都蘭遺址"], "ans": -1}, {"num": 48, "text": "臺灣「自然保護區」之法源，是依下列何者而劃定公告？", "opts": ["國家公園法", "森林法", "文化資產保存法", "野生動物保育法"], "ans": 1}, {"num": 49, "text": "臺灣將國外旅遊警示，依顏色分級由低度至高度警示，下列順序何者正確？", "opts": ["紅、橘、黃、灰", "灰、黃、橘、紅", "白、灰、黃、紅", "黃、橘、紅、灰"], "ans": 1}, {"num": 50, "text": "下列那一個標章代表交通部觀光局頒訂的合法民宿？", "opts": ["", "", "", ""], "ans": 3}];
const TOTAL_TIME = 3600;
const KEYS = ['A','B','C','D'];
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let userAnswers = {};
let submitted = false;

function isCorrect(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}

function getCorrectLabel(q) {
  if (q.ans === -1) return '本題一律給分';
  if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
  return KEYS[q.ans] + '：' + q.opts[q.ans];
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (q.ans === -1 ? ' invalid' : '');
    card.id = 'card-' + qi;
    const opts = q.opts.map((opt, i) => {
      const blank_rendered = q.text.includes('______');
      return `<button class="option-btn" id="opt-${qi}-${i}" onclick="selectAnswer(${qi}, ${i})" data-qi="${qi}" data-i="${i}">
        <span class="opt-label">${KEYS[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
