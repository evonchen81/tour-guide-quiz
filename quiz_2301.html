<title>115年 導遊執業法規 線上測驗</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',Microsoft JhengHei,sans-serif;background:#f0f4f8;min-height:100vh}
.sticky-header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:12px 20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.exam-title{font-size:1.2rem;font-weight:700}
.exam-sub{font-size:.8rem;opacity:.85;margin-top:2px}
.timer-box{text-align:center;background:rgba(255,255,255,.15);border-radius:10px;padding:6px 14px;min-width:100px}
.timer-box.warning{background:rgba(255,200,0,.3)}
.timer-box.danger{background:rgba(255,80,80,.4)}
.timer-label{font-size:.65rem;opacity:.8}
.timer-value{font-size:1.5rem;font-weight:700;letter-spacing:2px}
.timer-bar-wrap{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:4px}
.timer-bar{height:100%;background:#68d391;border-radius:2px;transition:width .5s}
.progress-area{background:#fff;padding:10px 20px;border-bottom:1px solid #e2e8f0}
.progress-info{font-size:.85rem;color:#4a5568;margin-bottom:6px}
.dot-grid{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;background:#e2e8f0;border:1.5px solid #cbd5e0;font-size:.65rem;display:flex;align-items:center;justify-content:center;color:#718096;cursor:pointer;transition:all .2s}
.dot.done{background:#3182ce;border-color:#2b6cb0;color:#fff}
.main{max-width:800px;margin:0 auto;padding:16px}
.q-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:2px solid #e2e8f0;transition:border-color .2s}
.q-card.answered{border-color:#90cdf4}
.q-card.result-correct{border-color:#68d391;background:#f0fff4}
.q-card.result-wrong{border-color:#fc8181;background:#fff5f5}
.q-num{font-size:.8rem;color:#718096;margin-bottom:6px;font-weight:600}
.q-text{font-size:1rem;color:#2d3748;margin-bottom:14px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.option-label{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1.5px solid #e2e8f0;cursor:pointer;transition:all .2s;line-height:1.5}
.option-label:hover{background:#ebf8ff;border-color:#90cdf4}
.option-label.selected{background:#ebf8ff;border-color:#3182ce}
.option-label.correct-ans{background:#f0fff4;border-color:#38a169!important}
.option-label.wrong-ans{background:#fff5f5;border-color:#e53e3e!important}
.option-key{font-weight:700;color:#3182ce;min-width:20px}
.option-label input{display:none}
.result-badge{padding:6px 12px;border-radius:6px;font-weight:700;margin-top:8px;font-size:.9rem}
.result-badge.ok{background:#f0fff4;color:#276749}
.result-badge.err{background:#fff5f5;color:#c53030}
.correct-note{margin-top:6px;padding:8px 12px;background:#ebf8ff;border-radius:6px;color:#2b6cb0;font-size:.9rem}
.bottom-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50}
.btn-submit{background:#3182ce;color:#fff;border:none;border-radius:8px;padding:12px 40px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-submit:hover{background:#2b6cb0}
#resetBtn{display:none;background:#805ad5;color:#fff;border:none;border-radius:8px;padding:10px 30px;font-size:.95rem;font-weight:700;cursor:pointer}
.score-panel{display:none;background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:2px solid #90cdf4;text-align:center}
.score-val{font-size:3rem;font-weight:900;color:#2b6cb0}
.score-grade{display:inline-block;padding:4px 16px;border-radius:20px;font-size:1rem;font-weight:700;margin:8px 0}
.score-detail{color:#718096;font-size:.85rem}
.stats{display:flex;justify-content:center;gap:20px;margin-top:12px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:1.4rem;font-weight:700}
.stat-label{font-size:.75rem;color:#718096}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #cbd5e0;background:#fff;cursor:pointer;font-size:.85rem}
.filter-btn.active{background:#3182ce;border-color:#3182ce;color:#fff}
@media(max-width:600px){
  .exam-title{font-size:1rem}
  .timer-value{font-size:1.2rem}
  .dot{width:18px;height:18px;font-size:.55rem}
}

/* Explanation panel */
.explanation-panel {
  display: none;
  margin-top: 12px;
  background: #EBF8FF;
  border-left: 4px solid #3182CE;
  border-radius: 0 8px 8px 0;
  padding: 14px 16px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: #2D3748;
  white-space: pre-wrap;
}
.explanation-panel.visible { display: block; }
.explanation-panel strong { color: #1a365d; }
.btn-explain {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 14px;
  background: #3182CE;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}
.btn-explain:hover { background: #2b6cb0; }
</style>
</head>
<body>
<div class="sticky-header">
  <div class="header-top">
    <div>
      <div class="exam-title">115年 導遊執業法規 模擬測驗</div>
      <div class="exam-sub">華語導遊人員 ／ 共50題・每題2分・總分100分</div>
    </div>
    <div class="timer-box" id="timerBox">
      <div class="timer-label">剩餘時間</div>
      <div class="timer-value" id="timerValue">60:00</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
    </div>
  </div>
</div>
<div class="progress-area">
  <div class="progress-info">已作答：<strong id="answeredCount">0</strong> / 50 題</div>
  <div class="dot-grid" id="dotGrid"></div>
</div>
<div class="main">
  <div id="score-panel" class="score-panel">
    <div class="score-val" id="scoreVal"></div>
    <div class="score-grade" id="scoreGrade"></div>
    <div class="score-detail" id="scoreDetail"></div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num" id="statCorrect" style="color:#38a169"></div><div class="stat-label">答對</div></div>
      <div class="stat-item"><div class="stat-num" id="statWrong" style="color:#e53e3e"></div><div class="stat-label">答錯</div></div>
      <div class="stat-item"><div class="stat-num" id="statSkip" style="color:#718096"></div><div class="stat-label">未作答</div></div>
      <div class="stat-item"><div class="stat-num" id="statTime" style="color:#805ad5"></div><div class="stat-label">用時</div></div>
    </div>
    <div class="filter-bar" style="justify-content:center;margin-top:16px">
      <button class="filter-btn active" onclick="filterQ('all')">全部題目</button>
      <button class="filter-btn" onclick="filterQ('wrong')">只看錯題</button>
      <button class="filter-btn" onclick="filterQ('correct')">只看對題</button>
    </div>
  </div>
  <form id="quizForm"></form>
  <div id="unansMsg"></div>
</div>
<div class="bottom-bar">
  <button class="btn-submit" onclick="submitQuiz()">交卷對答案</button>
  <button id="resetBtn" onclick="resetQuiz()">🔄 重新作答</button>
</div>
<script>
const QUESTIONS = [
  {q:`下列何者非發展觀光條例之制定目標？`, opts:[`平衡城鄉差距`, `敦睦國際友誼`, `宏揚傳統文化`, `增進國民身心健康ˉ`], ans:0, exp:`【法條依據】發展觀光條例第1條
【說明】依第1條，本條例制定目標為：宏揚傳統文化、敦睦國際友誼、增進國民健康、促進國內經濟繁榮。「平衡城鄉差距」屬區域均衡發展，並非發展觀光條例之立法目的，故選A。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=1`},
  {q:`有關導遊人員之評量測驗，下列敘述何者錯誤？`, opts:[`華語導遊人員類科，以各科目平均成績滿六十分為及格`, `外語導遊人員類科筆試，以各科目平均成績滿六十分且外國語科目成績滿五十分為及格。部分科目免測 者，以外國語科目成績滿六十分為及格`, `外語導遊人員類科口試，以各口試委員之評分成績皆滿六十分為及格`, `有一科成績為零分者，不予及格`], ans:2, exp:`【法條依據】導遊人員管理規則（評量測驗相關條文）
【說明】依規定，外語導遊人員類科口試以「各口試委員評分之平均成績」滿60分為及格，並非「各口試委員之評分成績皆滿六十分」。C選項說「皆滿六十分」（每位委員都需達標）與法規不符，故C錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110012`},
  {q:`交通部觀光署在亞洲那些城市設置駐外辦事處？`, opts:[`東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、河內等地`, `東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、澳門等地`, `東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、胡志明市等地`, `東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、福岡等地`], ans:2, exp:`【說明】交通部觀光署在亞洲的駐外辦事處城市為：東京、大阪、釜山（非首爾）、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）及胡志明市（非河內或澳門），故正確答案為C選項。
【官方連結】https://www.tourism.gov.tw/`},
  {q:`依據旅行業管理規則規定，有關不得聘為旅行業經理人之敘述，下列何者錯誤？`, opts:[`曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行`, `曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後未 逾五年`, `曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之刑確定，尚未執行`, `曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或 赦免後未逾三年`], ans:3, exp:`【法條依據】旅行業管理規則（旅行業經理人相關條文）
【說明】依規定，曾犯詐欺、背信、侵占罪者，限制擔任旅行業經理人的期間為「執行完畢、緩刑期滿或赦免後未逾五年」。D選項說「未逾三年」，年限偏低，與規定不符，故D錯誤。另，組織犯罪防制條例罪行亦適用五年限制。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據發展觀光條例規定，主管機關為勘定風景特定區範圍，得派員進入公私有土地實施勘查或測量。但應 先以何種方式通知土地所有權人或其使用人？`, opts:[`當面通知`, `公告通知`, `電話通知`, `書面通知`], ans:3, exp:`【法條依據】發展觀光條例第16條
【說明】依第16條，主管機關為勘定風景特定區範圍，派員進入公私有土地實施勘查或測量前，「應先以書面通知土地所有權人或其使用人」。書面通知具正式性與可追溯性，不得以電話或公告替代。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=16`},
  {q:`旅行業所派遣之隨團服務人員執行業務時應遵守之規定，下列何者錯誤？`, opts:[`不得未經旅客請求而變更旅程`, `應揭露行程資訊內容`, `不得有不利國家之言行`, `應全程統一保管旅客證件以免遺失`], ans:3, exp:`【法條依據】旅行業管理規則（隨團服務人員相關條文）
【說明】依規定，旅行業或其隨團服務人員「不得統一保管旅客證件」，此規定旨在保護旅客個人資訊及自主權。全程統一保管旅客證件屬違規行為，故D選項錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據發展觀光條例規定，旅行業未依規定辦理履約保證保險或責任保險，主管機關處置作為，下列何者錯 誤？`, opts:[`處新臺幣三萬元以上五十萬元以下罰鍰`, `處新臺幣十萬元以上五十萬元以下罰鍰`, `得立即停止其辦理旅客之出國及國內旅遊業務`, `限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照`], ans:1, exp:`【法條依據】發展觀光條例（旅行業罰則相關條文）
【說明】旅行業未依規定辦理履約保證保險或責任保險者，「處新臺幣三萬元以上五十萬元以下罰鍰」（非十萬元），並得立即停止辦理旅客出國及國內旅遊業務，限三個月內辦妥，逾期未辦妥得廢止旅行業執照。B選項「十萬元以上」與規定不符，故B錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`依據旅行業管理規則規定，旅行業辦理旅遊業務，下列敘述何者錯誤？`, opts:[`甲種旅行業、乙種旅行業代理綜合旅行業招攬團體旅遊業務，應經綜合旅行業之委託，並以綜合旅行業 名義與旅客簽訂旅遊契約，並由銷售旅行業副署`, `旅行業經營自行組團業務，未經旅客書面同意，不得將該旅行業務轉讓其他旅行業辦理`, `旅行業受理旅行業務之轉讓時，應與旅客重新簽訂旅遊契約`, `甲種旅行業、乙種旅行業經營自行組團業務，得將其招攬文件置於其他旅行業，委託該其他旅行業代為 銷售、招攬`], ans:3, exp:`【法條依據】旅行業管理規則第28條
【說明】甲種及乙種旅行業「不得」將其自行組團之招攬文件置於其他旅行業委託代銷，故D選項錯誤。正確的業務模式為：綜合旅行業得委託甲種或乙種旅行業代為銷售招攬，且應以綜合旅行業名義簽訂旅遊契約並由銷售旅行業副署。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據旅行業管理規則規定，旅行業經理人訓練測驗成績以一百分為滿分，及格分數為多少分？`, opts:[`六十分`, `六十五分`, `七十分`, `七十五分`], ans:2, exp:`【法條依據】旅行業管理規則（旅行業經理人訓練相關條文）
【說明】旅行業經理人訓練測驗成績以100分為滿分，「70分為及格」，標準高於一般考試（60分），反映旅行業經理人的專業要求。答案為C（七十分）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據導遊人員管理規則規定，外語導遊人員評量測驗應測科目缺考者，如何處理？`, opts:[`可視缺考科目自動補考`, `視為零分`, `缺考科目不計入平均成績`, `只影響外國語科目成績`], ans:1, exp:`【法條依據】導遊人員管理規則（評量測驗相關條文）
【說明】評量測驗科目「缺考者視為零分」。由於有一科成績為零分者不予及格，因此缺考等同於考試不及格，不可自動補考或視為未計分。答案為B（視為零分）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110012`},
  {q:`依據管理外匯條例規定，對於故意不申報或申報不實外匯者，罰鍰範圍為何？`, opts:[`新臺幣三萬元以上六十萬元以下`, `新臺幣三萬元以上一百萬元以下`, `按交易金額二倍以下`, `沒收外匯`], ans:0, exp:`【法條依據】管理外匯條例第22條
【說明】依第22條，故意不申報或申報不實外匯者，處「新臺幣三萬元以上六十萬元以下」罰鍰。B選項「三萬元以上一百萬元以下」金額上限偏高，與條文不符。答案為A。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=G0380001&flno=22`},
  {q:`依據旅行業管理規則規定，旅行業以所屬或透過其他網路平臺、行動應用程式（APP）、其他電子方式經 營旅行業務者，應於其頁面及介面揭露下列那些必要事項？①公司名稱、種類、地址 ②公司資本額及保 證金 ③公司品保協會會員編號 ④公司註冊編號及代表人姓名 ⑤公司電話、傳真、電子信箱號碼及聯 絡人`, opts:[`①②③`, `①②④`, `②③⑤`, `①④⑤`], ans:3, exp:`【法條依據】旅行業管理規則（電子方式經營旅行業務相關條文）
【說明】旅行業以網路平台、APP或其他電子方式經營旅行業務，應於頁面揭露：①公司名稱、種類、地址；④公司註冊編號及代表人姓名；⑤公司電話、傳真、電子信箱號碼及聯絡人。②公司資本額及保證金、③品保協會會員編號均非法定揭露項目。答案為D（①④⑤）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`外籍旅客在購物退稅之特約商店，同一日向同一特約商店購物累計含稅消費金額在新臺幣多少元以上，得 於購物當日持入境證照向商店申請開立退稅表單，並於幾天內將隨行貨物攜帶出境？`, opts:[`三千元以上；六十天內`, `三千元以上；九十天內`, `二千元以上；六十天內`, `二千元以上；九十天內`], ans:3, exp:`【法條依據】外籍旅客購物退稅相關規定（加值型及非加值型營業稅法相關辦法）
【說明】外籍旅客同一日向同一特約商店購物累計含稅消費金額在「新臺幣二千元以上」，得申請開立退稅表單，並須在購物日起「九十天內」將隨行貨物攜帶出境。答案為D（二千元以上；九十天內）。
【官方連結】https://www.mof.gov.tw/`},
  {q:`國際旅客報名參加我國旅行社舉辦之國內團體旅遊時，旅行社應指派或僱用導遊人員執行接待或引導觀 光旅客旅遊業務，若未依規定派遣合法導遊人員而執行業務者，依據發展觀光條例規定，處新臺幣多少元 罰鍰，並禁止其執業？`, opts:[`一萬元以上二萬元以下`, `一萬元以上三萬元以下`, `一萬元以上四萬元以下`, `一萬元以上五萬元以下`], ans:3, exp:`【法條依據】發展觀光條例（旅行業罰則相關條文）
【說明】旅行業未依規定派遣合法導遊人員執行接待業務者，「處新臺幣一萬元以上五萬元以下罰鍰，並禁止其執業」。答案為D（一萬元以上五萬元以下）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`王先生高中畢業後，欲執行接待日本、歐美等地非華語之觀光旅客業務，應參加何種評量測驗，並領取何 種執業證？`, opts:[`考取華語導遊人員執業證即可，搭配外語翻譯人員執行業務`, `應參加外語導遊人員類科評量測驗，並領取外語導遊人員執業證`, `參加華語導遊人員評量測驗，因為來臺旅遊者均應具備華語溝通能力`, `必須同時通過華語導遊人員及外語導遊人員兩類科的評量測驗`], ans:1, exp:`【法條依據】導遊人員管理規則（執業證相關條文）
【說明】接待非華語（日語、英語等外語）觀光旅客，須取得「外語導遊人員執業證」，不可以華語導遊執業證搭配翻譯代替。外語導遊執業證按語別分類，僅能執行對應語言旅客之接待業務。答案為B。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110012`},
  {q:`依據護照條例規定，下列那種情形得申請換發護照？`, opts:[`護照所餘效期不足二年`, `所持護照非屬現行最新式樣者`, `持照人之相貌變更與護照照片不符`, `護照內植晶片無法讀取`], ans:1, exp:`【法條依據】護照條例（護照換發相關條文）
【說明】依規定：A選項「效期不足二年」不符，需效期「不足一年」才可申請換發；B選項「護照非屬現行最新式樣」可申請換發（正確）；C選項需相貌「差異甚大不易辨識」，非一般「不符」；D選項晶片無法讀取屬護照損毀，係申請補發而非換發。故B選項為正確的換發情形。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=E0030001`},
  {q:`發展觀光條例的名詞定義中，下列何者為依規定程序劃定之風景或名勝地區？`, opts:[`觀光地區`, `國家公園`, `自然人文生態景觀區`, `風景特定區`], ans:3, exp:`【法條依據】發展觀光條例第2條第4款
【說明】依第2條名詞定義：「風景特定區」係指依規定程序劃定之風景或名勝地區（由主管機關依程序勘定劃設）；「觀光地區」係風景特定區以外，經中央主管機關指定供觀光旅客遊覽之地區。故答案為D（風景特定區）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=2`},
  {q:`有關觀光遊憩地區及其主管機關，下列何者錯誤？`, opts:[`大學實驗林：教育部`, `自然地景：農業部`, `國家公園：交通部`, `水庫：經濟部`], ans:2, exp:`【法條依據】國家公園法第3條
【說明】國家公園的主管機關為「內政部」（現由內政部國家公園署主管），並非交通部。交通部觀光署主管風景特定區及相關觀光事務，但不主管國家公園。C選項「國家公園：交通部」錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=D0070105&flno=3`},
  {q:`依據交通部觀光署處務規程，有關「觀光遊樂業之發展規劃」係屬於該署那一單位業務？`, opts:[`國際組`, `企劃組`, `旅行業組`, `旅遊推廣組`], ans:3, exp:`【法條依據】交通部觀光署處務規程（各組業務分工相關條文）
【說明】依交通部觀光署處務規程，「觀光遊樂業之發展規劃」屬「旅遊推廣組」的業務範疇，負責國內旅遊推廣規劃及觀光遊樂業之輔導管理等事務。答案為D（旅遊推廣組）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110015`},
  {q:`依據發展觀光條例規定，觀光主管機關對各地特有產品及手工藝品之作法為何？ ①應會同有關機關調查統計 ②輔導改良其生產及製作技術，提高品質，標明價格 ③洽請旅行業者協助促銷販售 ④協助在各觀光地區商號集中銷售`, opts:[`①②③`, `①②④`, `①③④`, `②③④`], ans:1, exp:`【法條依據】發展觀光條例（特有產品相關條文）
【說明】依規定，觀光主管機關對各地特有產品及手工藝品：①應會同有關機關調查統計；②輔導改良生產及製作技術、提高品質、標明價格；④協助在各觀光地區商號集中銷售。③「洽請旅行業者協助促銷」並非法條明定，故選①②④，答案為B。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`依據導遊人員管理規則規定，有關參加導遊人員職前訓練之退訓，下列何者正確？ ①缺課節數逾十五分之一者 ②受訓期間對講座、輔導員或其他辦理訓練人員施以強暴脅迫者 ③由他人冒名頂替參加訓練者 ④經退訓，其已繳納之訓練費用，不得申請退還`, opts:[`①②④`, `①②③`, `①③④`, `②③④`], ans:3, exp:`【法條依據】導遊人員管理規則（職前訓練退訓相關條文）
【說明】依規定，退訓事由包含：②受訓期間對講座、輔導員或其他辦理訓練人員施以強暴脅迫；③由他人冒名頂替；④退訓後已繳訓練費用不得申請退還。①缺課節數應逾訓練節次「十分之一」（非十五分之一）方退訓，故①錯誤。答案為D（②③④）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110012`},
  {q:`依據外匯收支或交易申報辦法規定，非居住民可逕向銀行業辦理每筆新臺幣結購或結售之限額為何？`, opts:[`十萬美元`, `十五萬美元`, `二十萬美元`, `二十五萬美元`], ans:0, exp:`【法條依據】外匯收支或交易申報辦法第4條
【說明】依第4條，「非居住民」可逕向銀行業辦理每筆新臺幣結購或結售，限額為等值「十萬美元」（USD 100,000）。超過限額者需向中央銀行申請核准。答案為A（十萬美元）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380047`},
  {q:`依據發展觀光條例規定，旅客進入自然人文生態景觀區未依規定申請專業導覽人員陪同進入者，目的事業 主管機關得處行為人罰鍰新臺幣多少元？`, opts:[`一萬元以下`, `二萬元以下`, `三萬元以下`, `四萬元以下`], ans:2, exp:`【法條依據】發展觀光條例（自然人文生態景觀區罰則相關條文）
【說明】依規定，旅客進入自然人文生態景觀區，未依規定申請專業導覽人員陪同進入者，目的事業主管機關得處行為人「新臺幣三萬元以下罰鍰」。答案為C（三萬元以下）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`國際性主要組織的英文縮寫，下列何者錯誤？`, opts:[`國際航空運輸協會：IATA`, `國際會議協會：ICCA`, `亞太經濟合作會議：APTA`, `聯合國教育、科學及文化組織：UNESCO`], ans:2, exp:`【說明】各國際組織正確英文縮寫：A. IATA（國際航空運輸協會）正確；B. ICCA（國際會議協會）正確；C. 亞太經濟合作（Asia-Pacific Economic Cooperation）的正確縮寫為「APEC」，而非APTA；D. UNESCO（聯合國教育、科學及文化組織）正確。APTA是亞太貿易協定（Asia-Pacific Trade Agreement）的縮寫，與亞太經濟合作不同。答案為C（APTA錯誤）。`},
  {q:`依據旅行業管理規則規定，下列何者不是乙種旅行社之業務內容？`, opts:[`招攬或接待本國旅客或取得合法居留證件之外國人、香港、澳門居民及大陸地區人民國內旅遊、食宿、 交通及提供有關服務`, `提供旅客於購買旅遊商品或服務時，附隨代收透過其所屬網路平臺或行動應用程式（APP），與保險業 合作推廣旅遊相關保險商品之保險費`, `代理綜合旅行業招攬國內團體旅遊業務`, `代理外國旅行業辦理聯絡、推廣、報價等業務`], ans:3, exp:`【法條依據】旅行業管理規則（旅行業業務範圍相關條文）
【說明】「代理外國旅行業辦理聯絡、推廣、報價等業務」屬甲種旅行業的業務，「乙種旅行業不得辦理」此項業務。乙種旅行業主要辦理國內旅遊業務及代理綜合旅行業招攬國內團體旅遊等。故D選項不屬於乙種旅行社業務內容。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據旅行業管理規則規定，旅行業以商標招攬旅客，應由該旅行業依法申請商標註冊，報請交通部觀光署 備查，報請備查之商標，以幾個為限？`, opts:[`一個`, `二個`, `三個`, `四個`], ans:0, exp:`【法條依據】旅行業管理規則（服務標章/商標相關條文）
【說明】旅行業以商標（服務標章）招攬旅客，應依法申請商標（服務標章）註冊後，報請交通部觀光署備查，備查之商標「以一個為限」，以確保標識統一性。答案為A（一個）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據發展觀光條例規定，為提升我國國際觀光服務品質，以外語輔助解說國內特有生態及人文景觀資源， 由各目的事業主管機關在自然人文生態景觀區所設置具外語能力之人員為何者？`, opts:[`導遊人員`, `領隊人員`, `專業導覽人員`, `外語觀光導覽人員`], ans:3, exp:`【法條依據】發展觀光條例第2條第15款
【說明】依第2條名詞定義，各目的事業主管機關在自然人文生態景觀區所設置「具外語能力之人員」，稱為「外語觀光導覽人員」，以外語輔助解說國內特有生態及人文景觀資源。與「專業導覽人員」（第14款）不同，後者不限外語。答案為D。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=2`},
  {q:`依據旅行業管理規則規定，乙種旅行業實收之資本總額，不得少於新臺幣多少元？`, opts:[`三千萬元`, `六百萬元`, `一百二十萬元`, `一百萬元`], ans:2, exp:`【法條依據】旅行業管理規則（旅行業種類及最低資本額相關條文）
【說明】旅行業各類最低實收資本額：綜合旅行業三千萬元、甲種旅行業六百萬元、乙種旅行業「一百二十萬元」。資本額越高，業務範圍越廣。答案為C（一百二十萬元）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`依據導遊人員管理規則規定，外語導遊人員評量測驗依報名資格可分為那兩種？`, opts:[`通用制與專用制`, `初級制與高級制`, `普通制與特別制`, `國內制與國際制`], ans:0, exp:`【法條依據】導遊人員管理規則（外語導遊評量測驗相關條文）
【說明】外語導遊人員評量測驗依報名資格分為「通用制」與「專用制」：通用制開放具高中以上畢業學歷者報名；專用制限現任旅行業服務年資滿二年以上之人員，經任職旅行業推薦報名，考試科目較簡化，取得執業證後只能服務於推薦旅行業。答案為A（通用制與專用制）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110012`},
  {q:`外國旅客在臺旅遊期間，前往銀行欲將歐元旅行支票換成新臺幣，係以下列何種歐元匯率兌換？`, opts:[`即期賣匯`, `即期買匯`, `現金賣匯`, `現金買匯`], ans:1, exp:`【說明】外幣旅行支票換成新臺幣，係由銀行「買入」外幣（旅客賣出外幣），應使用「即期買匯」匯率（Demand Buying Rate）。現金買匯匯率通常低於即期買匯，因現行支票無需倉儲運輸成本。現金賣匯及即期賣匯係指銀行賣出外幣時使用，方向相反。答案為B（即期買匯）。`},
  {q:`依據出境報關須知規定，出境旅客攜帶人民幣超過限額時應主動向海關申報，下列何者錯誤？`, opts:[`僅能於限額內攜出`, `金額以二萬元為限`, `申報不實者，超過申報部分沒入`, `申報不實者，申報金額全數沒入`], ans:3, exp:`【說明】依出境報關規定，出境旅客攜帶人民幣超過限額（二萬元）應主動向海關申報。申報不實者，「超過申報金額部分沒入」（即申報XX元，實際XX+超出部分，超出部分沒入），並非「申報金額全數沒入」。D選項「全數沒入」說法錯誤，故選D。`},
  {q:`依據發展觀光條例規定，旅遊產品需由旅行社專屬販售，但以下的何種旅行產品可以在臺灣便利商店買到？`, opts:[`外國人來臺旅遊行程`, `台灣高鐵或臺灣鐵路公司之車票`, `國人出國之團體旅遊`, `國人國內套裝旅遊`], ans:1, exp:`【說明】依旅行業管理規則，旅行業的專屬業務為旅遊行程、食宿、交通票券安排及旅遊契約簽訂等。台灣高鐵（THSR）及臺灣鐵路公司（TRA）車票屬一般交通票券，非旅行業專屬業務，消費者可透過便利商店、售票機等多種通路購買，故B選項正確。`},
  {q:`有關外國旅行業在本國設立分公司之規定，下列何者錯誤？`, opts:[`應向交通部觀光署申請核准`, `需依法辦理認許及分公司登記`, `業務範圍、實收資本額準用本國旅行業分公司之規定`, `保證金準用本國旅行業本公司之規定`], ans:2, exp:`【法條依據】旅行業管理規則（外國旅行業在台設立分公司相關條文）
【說明】外國旅行業在臺設立分公司，業務範圍及實收資本額「準用本國旅行業本公司之規定」，非分公司規定（分公司的規定較為限縮）。保證金亦準用本國旅行業本公司之規定。C選項說「準用分公司規定」錯誤，應為「準用本公司規定」。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110007`},
  {q:`王小明的家就在東部海岸國家風景區範圍內，最近他父親想將老家的舊平房打掉，原地改建成色彩鮮豔華 麗的三層樓高級洋房，小明跟他父親說：「爸爸，這要向國家風景區管理處先申請看可不可以啦！」他父 親說：「不必吧，建築執照是向縣政府申請，又不是管理處。」有關上述議題，下列敘述何者正確？`, opts:[`不論翻修後建築物之造形、構造、色彩等，小明的父親只要直接按照建築法向縣政府申請就可以`, `在縣政府核准及全部完工之後，為維持國家風景特定區之美觀，再就該建築物之造形、構造、色彩等向 國家風景區管理處申請建築執照`, `為維持國家風景特定區之美觀，區內建築物之造形、構造、色彩等，國家風景區管理處得實施規劃限制`, `為維護人民居住自由權，區內建築物之造形、構造、色彩等，國家風景區管理處不得實施規劃限制`], ans:2, exp:`【法條依據】發展觀光條例（風景特定區建築管制相關條文）
【說明】為維持國家風景特定區之美觀，區內建築物之造形、構造、色彩等，管理機關（如國家風景區管理處）「得實施規劃限制」。此為發展觀光條例對一般建築法的特別規定，優先適用，建築仍須符合管理處規劃限制，非僅向縣政府申請建照即可。答案為C。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`依據發展觀光條例規定，下列何者不需懸掛主管機關發給之觀光專用標識？`, opts:[`旅行業`, `民宿經營者`, `旅館業`, `觀光遊樂業`], ans:0, exp:`【法條依據】發展觀光條例（觀光專用標識相關條文）
【說明】依規定，應懸掛主管機關發給觀光專用標識者為：觀光旅館業、旅館業、觀光遊樂業及民宿。「旅行業」並不需要懸掛觀光專用標識，旅行業有其旅行業執照等核准證件作為管理機制。答案為A（旅行業）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`觀光旅館業、旅館業、旅行業、觀光遊樂業或民宿經營者，經主管機關實施定期或不定期檢查結果有不合 規定者，除依相關法令辦理外，發展觀光條例規定之處罰有那些？ ①令限期改善，屆期仍未改善者，處新臺幣三萬元以上三十萬元以下罰鍰 ②情節重大者，並得定期停止其營業之一部或全部 ③仍繼續營業者，處新臺幣五萬元以上三十萬元以下罰鍰 ④經受停止營業處分仍繼續營業者，廢止其營業執照或登記證`, opts:[`①②③`, `①②④`, `①③④`, `②③④`], ans:1, exp:`【法條依據】發展觀光條例（定期不定期檢查不合規定罰則相關條文）
【說明】觀光業者檢查結果不合規定者，依法處罰：①令限期改善，屆期未改善處新臺幣三萬元以上三十萬元以下罰鍰；②情節重大者，得定期停止營業之一部或全部；④受停止營業處分仍繼續營業者，廢止其營業執照或登記證。③「仍繼續營業者處五萬元以上三十萬元以下」非法條規定，故選①②④，答案為B。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=K0110001`},
  {q:`下列何者為目前臺灣觀光CIS品牌標語？`, opts:[`HeartofAsia`, `WavesofWonder`, `TouchYourHeart`, `TimeforTaiwan`], ans:1, exp:`【說明】臺灣觀光品牌形象標語（CIS）為「Waves of Wonder」（驚奇無限），自2023年起啟用，以波浪意象傳達台灣觀光多元豐富的魅力。前一代標語為「Time for Taiwan」（2016年起使用）；「Heart of Asia」及「Touch Your Heart」均非現行標語。答案為B（Waves of Wonder）。
【官方連結】https://www.tourism.gov.tw/`},
  {q:`依據發展觀光條例規定，於風景特定區或觀光地區內有下列那些行為者，由其目的事業主管機關處新臺幣 一萬元以上五萬元以下罰鍰？ ①擅自經營固定或流動攤販 ②任意拋棄、焚燒垃圾或廢棄物 ③將車輛開入禁止車輛進入或停放於禁止停車之地區 ④擅自設置指示標誌、廣告物 ⑤強行向旅客拍照並收取費用`, opts:[`①④⑤`, `②③⑤`, `③④⑤`, `①③④`], ans:0, exp:`【法條依據】發展觀光條例第60條
【說明】依第60條，於風景特定區或觀光地區內有下列行為，由目的事業主管機關處「新臺幣一萬元以上五萬元以下罰鍰」：①擅自經營固定或流動攤販；④擅自設置指示標誌、廣告物；⑤強行向旅客拍照並收取費用。②任意拋棄垃圾及③違規停車適用不同罰則條文，故選①④⑤，答案為A。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=60`},
  {q:`依據發展觀光條例規定，觀光遊樂業、觀光旅館業及旅館業配合觀光政策提升服務品質，經中央主管機關 核定者，其直接使用之不動產可享受地價稅及房屋稅減免。關於該租稅優惠，下列何者正確？`, opts:[`減免期限不得超過一年`, `減免期限為五年，屆期前得延長一次，延長期間以五年為限`, `減免期限不得超過三年`, `減免期限為十年，屆期前得延長一次，延長期間以十年為限`], ans:1, exp:`【法條依據】發展觀光條例第49條
【說明】依第49條，觀光遊樂業、觀光旅館業及旅館業配合觀光政策提升服務品質，經中央主管機關核定者，直接使用之不動產得減免地價稅及房屋稅，「實施期限為五年，屆期前得延長一次，延長期間亦以五年為限」。答案為B。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=49`},
  {q:`依據發展觀光條例規定，未依本條例領取登記證而經營民宿者，處新臺幣多少元罰鍰，並勒令歇業？`, opts:[`三萬元以上十五萬元以下`, `五萬元以上三十萬元以下`, `十五萬元以上五十萬元以下`, `十萬元以上一百萬元以下`], ans:3, exp:`【法條依據】發展觀光條例第55條
【說明】依第55條，未依本條例領取登記證而經營民宿者，「處新臺幣十萬元以上一百萬元以下罰鍰，並勒令歇業」。違法經營民宿的處罰相當嚴重，遠高於一般違規罰鍰。答案為D（十萬元以上一百萬元以下）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=55`},
  {q:`請問下列何者屬於香港澳門關係條例所界定的香港居民？`, opts:[`持有中華民國護照的香港永久居民`, `持有美國護照的香港永久居民`, `持有英國國民（海外）護照的香港永久居民`, `持有日本護照的香港永久居民`], ans:2, exp:`【法條依據】香港澳門關係條例第4條
【說明】依第4條，「香港居民」指具有香港永久居留資格，且未持有英國國民（海外）護照BN(O)以外之國籍護照者。持有英國國民（海外）BN(O)護照者，仍屬香港居民範疇（C選項正確）。持有中華民國護照、美國護照或日本護照者，依其國籍認定，不再適用香港居民身分。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=Q0030001&flno=4`},
  {q:`張先生在經濟部擔任簡任第十一職等公務員，預定利用連假到大陸地區遊覽，他應向下列那一個部門申請 許可，始能前往？`, opts:[`國家安全局`, `大陸委員會`, `內政部`, `法務部`], ans:2, exp:`【法條依據】臺灣地區與大陸地區人民關係條例第9條
【說明】依第9條，臺灣地區公務員赴大陸地區應向「內政部」（移民署）申請許可，始得進入大陸地區。簡任第十一職等（高階公務員）亦適用此規定，故應向內政部申請，不可直接自行前往，答案為C（內政部）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=Q0010001&flno=9`},
  {q:`為強化保障國人赴大陸地區及香港、澳門旅遊及人身安全，我國政府專責發布大陸地區及香港、澳門旅遊 警示的主管機關為何？`, opts:[`交通部觀光署`, `外交部`, `內政部`, `大陸委員會`], ans:3, exp:`【說明】大陸地區及香港、澳門的旅遊警示，由「行政院大陸委員會（陸委會）」負責發布，係因兩岸及港澳事務屬陸委會業務職掌。外交部負責發布其他外國（非大陸地區、非港澳）的旅遊警示。答案為D（大陸委員會）。
【官方連結】https://www.mac.gov.tw/`},
  {q:`有關大陸地區人民組團來臺從事觀光活動，下列敘述何者正確？ ①應由旅行業組團辦理，並以團進團出方式為之，每團人數限四人以上五十人以下 ②旅行業辦理接待大陸地區人民來臺從事個人旅遊，不得接待由香港、澳門或大陸地區旅行業、其他機構 或個人組成之個人旅遊旅客團體 ③所稱個人旅遊旅客團體，指全團均由來臺從事個人旅遊之旅客所組成，或由來臺從事個人旅遊之旅客與 來臺從事觀光活動以外目的之大陸地區人民所組成 ④個人旅遊旅客團體，由大陸地區人民、香港或澳門居民隨團執行領隊人員業務者，推定係由香港、澳門 或大陸地區旅行業、其他機構或個人組成`, opts:[`①②③`, `①②④`, `①③④`, `②③④`], ans:3, exp:`【說明】依大陸地區人民來臺從事觀光活動許可辦法，大陸地區人民組團來臺，應由旅行業組團辦理，以團進團出方式，每團人數限「五人以上四十人以下」（非四人以上五十人以下）。①說「四人以上五十人以下」錯誤；②③④均正確。故選②③④，答案為D。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010052`},
  {q:`依據臺灣地區與大陸地區人民關係條例規定，使大陸地區人民非法進入臺灣地區者，處一年以上七年以下 有期徒刑，得併科多少罰金？`, opts:[`新臺幣五十萬元以下`, `新臺幣一百萬元以下`, `新臺幣二百萬元以下`, `新臺幣三百萬元以下`], ans:1, exp:`【法條依據】臺灣地區與大陸地區人民關係條例第79條第1項
【說明】依第79條第1項，使大陸地區人民非法進入臺灣地區者，「處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以下罰金」。若屬意圖營利，刑度則提高為三年以上十年以下有期徒刑，得併科五百萬元以下罰金。答案為B（一百萬元以下）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=Q0010001&flno=79`},
  {q:`陳先生原設籍中國大陸，目前旅居加拿大，盼前來臺灣旅遊，試問若其符合下列何種條件，即非臺灣地區 與大陸地區人民關係條例所規範之大陸地區人民？`, opts:[`旅居國外四年以上或取得當地國籍`, `旅居國外四年以上並取得當地國籍`, `旅居國外六年以上或取得當地永久居留權`, `旅居國外六年以上並取得當地永久居留權`], ans:1, exp:`【法條依據】臺灣地區與大陸地區人民關係條例（大陸地區人民定義相關條文）
【說明】大陸地區人民旅居國外達「四年以上」，「並」（且）「取得當地國籍」者，不再視為大陸地區人民，不受本條例規範。兩個條件須同時（並）滿足，不可單用「或」（任一條件即可）；且年限為四年而非六年。答案為B。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010001`},
  {q:`臺灣地區與大陸地區人民關係條例以規範涉及兩岸人民往來交流有關之權利義務事項為原則，下列何者 是該條例所規範處理項目？ ①兩岸主權與定位問題 ②兩岸政治與經貿議題 ③規範兩岸人民往來交流所衍生之法律事項 ④大陸地區人民在臺設籍後取得公職工作之規定`, opts:[`①②`, `②③`, `③④`, `①④`], ans:2, exp:`【法條依據】臺灣地區與大陸地區人民關係條例第1條
【說明】依第1條，本條例規範：③規範兩岸人民往來交流所衍生之法律事項；④大陸地區人民在臺設籍後取得公職工作之規定。①兩岸主權與定位問題、②兩岸政治與經貿議題，不屬本條例規範範疇（屬政策層面）。答案為C（③④）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=Q0010001&flno=1`},
  {q:`大陸地區人民申請來臺觀光符合一定情形者，內政部移民署得發給逐次加簽或一年多次入出境許可證。下 列敘述何者正確？ ①最近十二個月內曾符合規定來臺從事個人旅遊二次以上，且無違規情形 ②大陸地區帶團領隊 ③持有與臺灣地區旅行業者所簽訂合作契約之導遊 ④持有經大陸地區核發往來臺灣之個人旅遊多次簽`, opts:[`①②③`, `①②④`, `②③④`, `①③④`], ans:1, exp:`【說明】依大陸地區人民來臺從事觀光活動許可辦法，得申請發給一年多次入出境許可的情形：①最近十二個月內曾符合規定來臺從事個人旅遊二次以上，且無違規情形；②大陸地區帶團領隊；④持有經大陸地區核發往來臺灣之個人旅遊多次簽。③持有與台灣旅行業者所簽訂合作契約之導遊，並非法定條件。答案為B（①②④）。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010052`},
  {q:`旅行業及導遊人員辦理接待來臺觀光之大陸地區人民業務，應遵守相關規定，下列敘述何者錯誤？`, opts:[`每一團體應派遣至少1名導遊人員`, `行程變更時得視情況通報主管機關`, `於團體入境後2小時內填具入境接待通報表`, `於團體出境後2小時內，應通報出境人數及未出境人員名單`], ans:1, exp:`【說明】旅行業及導遊人員辦理接待大陸地區人民來臺觀光，行程發生變更時「應即時通報主管機關」（強制義務），而非「得視情況通報」（裁量空間）。B選項將「應」改為「得」，把法定義務變成裁量事項，故B錯誤。

  {q:`臺灣旅行業者辦理大陸地區人民來臺從事觀光活動業務，在臺旅遊行程應避開下列那個地方？`, opts:[`國家實驗研究院臺灣半導體研究中心`, `東北角鼻頭國小`, `龍山寺`, `國家人權博物館`], ans:0, exp:`【說明】依接待大陸地區人民來臺從事觀光活動相關規定，旅遊行程應避開涉及國家安全、核心技術之機構。「國家實驗研究院臺灣半導體研究中心」屬國家級高科技研究機構，涉及國家核心技術，列為禁止參訪地點。東北角鼻頭國小、龍山寺、國家人權博物館均為一般觀光景點，無安全疑慮。答案為A。
【官方連結】https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=Q0010052`}
];
const KEYS=['A','B','C','D'];
const TOTAL_TIME=3600;
let timeLeft=TOTAL_TIME,timerInterval,userAnswers=new Array(QUESTIONS.length).fill(-1),submitted=false,startTime=Date.now();
function buildQuiz(){
  const form=document.getElementById('quizForm'),dg=document.getElementById('dotGrid');
  form.innerHTML='';dg.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const dot=document.createElement('div');
    dot.className='dot';dot.id=`dot${i}`;dot.textContent=i+1;
    dot.onclick=()=>document.getElementById(`q${i}`).scrollIntoView({behavior:'smooth',block:'center'});
    dg.appendChild(dot);
    const card=document.createElement('div');
    card.className='q-card';card.id=`q${i}`;
    card.innerHTML=`<div class="q-num">第 ${i+1} 題</div><div class="q-text">${q.q}</div><div class="options" id="opts${i}">${q.opts.map((opt,j)=>`<label class="option-label" id="lbl${i}_${j}" onclick="selectOption(${i},${j})"><input type="radio" name="q${i}" value="${j}"><span class="option-key">${KEYS[j]}</span><span>${opt}</span></label>`).join('')}</div>`;
    form.appendChild(card);
  });
}
function selectOption(qi,oi){
  if(submitted)return;
  userAnswers[qi]=oi;
  for(let j=0;j<4;j++)document.getElementById(`lbl${qi}_${j}`).classList.toggle('selected',j===oi);
  document.getElementById(`q${qi}`).classList.add('answered');
  document.getElementById(`dot${qi}`).classList.add('done');
  document.getElementById('answeredCount').textContent=userAnswers.filter(a=>a!==-1).length;
}
function startTimer(){
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerValue').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    document.getElementById('timerBar').style.width=(timeLeft/TOTAL_TIME*100)+'%';
    const box=document.getElementById('timerBox');
    if(timeLeft<=300)box.className='timer-box danger';
    else if(timeLeft<=600)box.className='timer-box warning';
    if(timeLeft<=0){clearInterval(timerInterval);if(!submitted){alert('⏰ 時間到！自動交卷。');submitQuiz(true);}}
  },1000);
}
function submitQuiz(forced=false){
  const unanswered=userAnswers.filter(a=>a===-1).length;
  if(!forced&&unanswered>0){
    document.getElementById('unansMsg').innerHTML=`<div style="background:#fff3cd;border:1.5px solid #ffc107;border-radius:8px;padding:12px;text-align:center;margin:8px 0">⚠️ 尚有 <strong>${unanswered}</strong> 題未作答，確定要交卷嗎？<br><button style="margin-top:8px;padding:6px 16px;background:#e53e3e;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:700" onclick="submitQuiz(true)">確定交卷</button><button style="margin-top:8px;margin-left:8px;padding:6px 16px;background:white;border:1.5px solid #cbd5e0;border-radius:6px;cursor:pointer" onclick="document.getElementById('unansMsg').innerHTML=''">繼續作答</button></div>`;
    document.querySelector('.btn-submit').scrollIntoView({ behavior: 'smooth' });
    return;
  }
  submitted=true;clearInterval(timerInterval);
  const elapsed=Math.round((Date.now()-startTime)/1000),em=Math.floor(elapsed/60),es=elapsed%60;
  let correct=0;
  QUESTIONS.forEach((q,i)=>{
    const card=document.getElementById(`q${i}`);
    if(userAnswers[i]===q.ans){
      correct++;card.className='q-card result-correct';
      const b=document.createElement('div');b.className='result-badge ok';b.innerHTML='✅ 答對';card.querySelector('.options').after(b);
      if(q.exp){const ep=document.createElement('div');ep.className='explanation-panel';ep.textContent=q.exp;const bt=document.createElement('button');bt.className='btn-explain';bt.type='button';bt.textContent='查看解析';bt.onclick=function(){ep.classList.toggle('visible');bt.textContent=ep.classList.contains('visible')?'收起解析':'查看解析';};b.after(bt);bt.after(ep);}
    }else{
      card.className='q-card result-wrong';
      const b=document.createElement('div');b.className='result-badge err';b.innerHTML='❌ 答錯';card.querySelector('.options').after(b);
      const n=document.createElement('div');n.className='correct-note';n.innerHTML=`✔ 正確答案：<strong>${KEYS[q.ans]}：${q.opts[q.ans]}</strong>`;b.after(n);
      if(q.exp){const ep=document.createElement('div');ep.className='explanation-panel';ep.textContent=q.exp;const bt=document.createElement('button');bt.className='btn-explain';bt.type='button';bt.textContent='查看解析';bt.onclick=function(){ep.classList.toggle('visible');bt.textContent=ep.classList.contains('visible')?'收起解析':'查看解析';};n.after(bt);bt.after(ep);}
    }
    for(let j=0;j<4;j++){
      const lbl=document.getElementById(`lbl${i}_${j}`);
      lbl.style.cursor='default';
      if(j===q.ans)lbl.classList.add('correct-ans');
      else if(j===userAnswers[i]&&userAnswers[i]!==q.ans)lbl.classList.add('wrong-ans');
    }
  });
  const score=Math.round(correct*100/QUESTIONS.length);
  const wrong=QUESTIONS.length-correct-userAnswers.filter(a=>a===-1).length;
  const skip=userAnswers.filter(a=>a===-1).length;
  let grade,gc;
  if(score>=80){grade='🏆 優秀';gc='#276749';}else if(score>=60){grade='✅ 及格';gc='#2b6cb0';}else{grade='❌ 未及格';gc='#c53030';}
  document.getElementById('scoreVal').textContent=score+' 分';
  document.getElementById('scoreDetail').textContent=`共 ${QUESTIONS.length} 題・每題 ${(100/QUESTIONS.length).toFixed(1)} 分`;
  const ge=document.getElementById('scoreGrade');ge.textContent=grade;ge.style.background=gc+'22';ge.style.color=gc;
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statSkip').textContent=skip;
  document.getElementById('statTime').textContent=String(em).padStart(2,'0')+':'+String(es).padStart(2,'0');
  document.getElementById('score-panel').style.display='block';
  document.getElementById('unansMsg').innerHTML='';
  document.querySelector('.btn-submit').style.display='none';
  document.getElementById('resetBtn').style.display='inline-block';
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth'});
}
function filterQ(mode){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q,i)=>{
    const card=document.getElementById(`q${i}`);
    if(mode==='all')card.style.display='';
    else if(mode==='wrong')card.style.display=(userAnswers[i]!==q.ans)?'':'none';
    else card.style.display=(userAnswers[i]===q.ans)?'':'none';
  });
}
function resetQuiz(){
  submitted=false;userAnswers=new Array(QUESTIONS.length).fill(-1);
  timeLeft=TOTAL_TIME;startTime=Date.now();clearInterval(timerInterval);
  document.getElementById('timerBox').className='timer-box';
  document.getElementById('timerValue').textContent='60:00';
  document.getElementById('timerBar').style.width='100%';
  document.getElementById('score-panel').style.display='none';
  document.querySelector('.btn-submit').style.display='inline-block';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('unansMsg').innerHTML='';
  document.getElementById('answeredCount').textContent='0';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  buildQuiz();startTimer();window.scrollTo({top:0,behavior:'smooth'});
}
buildQuiz();startTimer();
</script>
</body>
