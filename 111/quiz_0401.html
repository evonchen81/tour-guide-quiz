  {q:`Which is the best title of the whole passage?`, opts:[`The Security Guidelines for the Local Tourism Industry`, `The Latest Trends in the Tourism Industry`, `Promoting Tourism Industry through Virtual Reality`, `Increasing Contactless Payment during the Pandemic`], ans:1},
  {q:`What does the word, “paramount,” in the first paragraph mean?`, opts:[`crucial`, `mentioned`, `total`, `evaluated`], ans:0},
  {q:`In paragraph 5, which of the following words is closest in meaning to “quarantine”?`, opts:[`promise`, `qualification`, `separation`, `property`], ans:2},
  {q:`What does the author mean “Virtual reality can give you an edge over rivals who have not yet adopted it”?`, opts:[`Virtual reality pushes tourism industry to the corner.`, `Virtual reality makes tourism industry recognize the reality.`, `Virtual reality is a good means to increase competitiveness.`, `Virtual reality benefits enemies.`], ans:2},
  {q:`If a similar section is going to be added to this passage, which is a possible section to fit in?`, opts:[`Growth of Contactless Payments`, `Knowing Various Pandemic Prevention Policies`, `Taking Action to Keep Customers Safe`, `Closing Business to Avoid Financial Loss`], ans:0}
];
const KEYS = ['A','B','C','D'];
const TOTAL_TIME = 4800;
let timeLeft = TOTAL_TIME;
let timerInterval;
let userAnswers = new Array(QUESTIONS.length).fill(-1);
let submitted = false;
let startTime = Date.now();
function buildQuiz() {
  const form = document.getElementById('quizForm');
  const dotGrid = document.getElementById('dotGrid');
  form.innerHTML = ''; dotGrid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot'; dot.id = `dot${i}`; dot.textContent = i+1;
    dot.onclick = () => document.getElementById(`q${i}`).scrollIntoView({behavior:'smooth', block:'center'});
    dotGrid.appendChild(dot);
    const card = document.createElement('div');
    card.className = 'q-card'; card.id = `q${i}`;
    const qHtml = q.q.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `<div class="q-num">第 ${i+1} 題</div><div class="q-text">${qHtml}</div><div class="options" id="opts${i}">${q.opts.map((opt, j) => `<label class="option-label" id="lbl${i}_${j}" onclick="selectOption(${i},${j})"><input type="radio" name="q${i}" value="${j}"><span class="option-key">${KEYS[j]}</span><span>${opt}</span></label>`).join('')}</div>`;
    form.appendChild(card);
  });
}
function selectOption(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;
  for (let j = 0; j < 4; j++) document.getElementById(`lbl${qi}_${j}`).classList.toggle('selected', j === oi);
  document.getElementById(`q${qi}`).classList.add('answered');
  document.getElementById(`dot${qi}`).classList.add('done');
  document.getElementById('answeredCount').textContent = userAnswers.filter(a => a !== -1).length;
}
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerValue').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    document.getElementById('timerBar').style.width = (timeLeft / TOTAL_TIME * 100) + '%';
    const box = document.getElementById('timerBox');
    if (timeLeft <= 300) box.className = 'timer-box danger';
    else if (timeLeft <= 600) box.className = 'timer-box warning';
    if (timeLeft <= 0) { clearInterval(timerInterval); if (!submitted) { alert('⏰ 時間到！自動交卷。'); submitQuiz(true); } }
  }, 1000);
}
function submitQuiz(forced=false) {
  const unanswered = userAnswers.filter(a => a === -1).length;
  if (!forced && unanswered > 0) {
    document.getElementById('unansMsg').innerHTML = `<div style="background:#fff3cd;border:1.5px solid #ffc107;border-radius:8px;padding:12px;text-align:center;margin:8px 0">⚠️ 尚有 <strong>${unanswered}</strong> 題未作答，確定要交卷嗎？<br><button style="margin-top:8px;padding:6px 16px;background:#e53e3e;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:700" onclick="submitQuiz(true)">確定交卷</button><button style="margin-top:8px;margin-left:8px;padding:6px 16px;background:white;border:1.5px solid #cbd5e0;border-radius:6px;cursor:pointer" onclick="document.getElementById('unansMsg').innerHTML=''">繼續作答</button></div>`;
    return;
  }
  submitted = true; clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const em = Math.floor(elapsed / 60), es = elapsed % 60;
  let correct = 0;
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`q${i}`);
    if (userAnswers[i] === q.ans) {
      correct++; card.className = 'q-card result-correct';
      const badge = document.createElement('div'); badge.className = 'result-badge ok'; badge.innerHTML = '✅ 答對';
      card.querySelector('.options').after(badge);
    } else {
      card.className = 'q-card result-wrong';
      const badge = document.createElement('div'); badge.className = 'result-badge err'; badge.innerHTML = '❌ 答錯';
      card.querySelector('.options').after(badge);
      const note = document.createElement('div'); note.className = 'correct-note';
      note.innerHTML = `✔ 正確答案：<strong>${KEYS[q.ans]}：${q.opts[q.ans]}</strong>`; badge.after(note);
    }
    for (let j = 0; j < 4; j++) {
      const lbl = document.getElementById(`lbl${i}_${j}`); lbl.style.cursor = 'default';
      if (j === q.ans) lbl.classList.add('correct-ans');
      else if (j === userAnswers[i] && userAnswers[i] !== q.ans) lbl.classList.add('wrong-ans');
    }
  });
  const score = correct * (100 / QUESTIONS.length);
  const wrong = QUESTIONS.length - correct - userAnswers.filter(a=>a===-1).length;
  const skip = userAnswers.filter(a=>a===-1).length;
  let grade, gradeColor;
  if (score >= 80) { grade = '🏆 優秀'; gradeColor = '#276749'; }
  else if (score >= 60) { grade = '✅ 及格'; gradeColor = '#2b6cb0'; }
  else { grade = '❌ 未及格'; gradeColor = '#c53030'; }
  document.getElementById('scoreVal').textContent = score.toFixed(0) + ' 分';
  document.getElementById('scoreDetail').textContent = `共 ${QUESTIONS.length} 題・每題 1.25 分`;
  const gradeEl = document.getElementById('scoreGrade');
  gradeEl.textContent = grade; gradeEl.style.background = gradeColor + '22'; gradeEl.style.color = gradeColor;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statSkip').textContent = skip;
  document.getElementById('statTime').textContent = String(em).padStart(2,'0') + ':' + String(es).padStart(2,'0');
  document.getElementById('score-panel').style.display = 'block';
  document.getElementById('unansMsg').innerHTML = '';
  document.querySelector('.btn-submit').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'inline-block';
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth'});
}
function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`q${i}`);
    if (mode === 'all') card.style.display = '';
    else if (mode === 'wrong') card.style.display = (userAnswers[i] !== q.ans) ? '' : 'none';
    else if (mode === 'correct') card.style.display = (userAnswers[i] === q.ans) ? '' : 'none';
  });
}
function resetQuiz() {
  submitted = false; userAnswers = new Array(QUESTIONS.length).fill(-1);
  timeLeft = TOTAL_TIME; startTime = Date.now(); clearInterval(timerInterval);
  document.getElementById('timerBox').className = 'timer-box';
  document.getElementById('timerValue').textContent = '80:00';
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('score-panel').style.display = 'none';
  document.querySelector('.btn-submit').style.display = 'inline-block';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('unansMsg').innerHTML = '';
  document.getElementById('answeredCount').textContent = '0';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  buildQuiz(); startTimer(); window.scrollTo({top:0, behavior:'smooth'});
}
buildQuiz(); startTimer();
</script>
