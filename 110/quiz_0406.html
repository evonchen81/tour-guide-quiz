<style>

#resetBtn{display:none;background:#805ad5;color:#fff;border:none;border-radius:8px;padding:10px 30px;font-size:.95rem;font-weight:700;cursor:pointer}

.stat-item{text-align:center}

.stat-label{font-size:.75rem;color:#718096}

  .exam-title{font-size:1rem}
  .timer-value{font-size:1.2rem}

}
</style>

<script>
const QUESTIONS = [
  {q:`The greatest tour guides are ______ and organized, helping their guests get to where they need to be on time.`, opts:[`tardy`, `punctual`, `arrogant`, `deceptive`], ans:1},

  {q:`Telluride, a Victorian-era mining town in Colorado, is a winter ______ offering plenty to do and isn’t as crowded as some of Colorado’s other destinations.`, opts:[`promise`, `phase`, `pointer`, `paradise`], ans:3},
  {q:`Taiwan has become the first country in Asia to totally ______ the eating of dog and cat meat, and violating the rule is punishable by up to $8,000 in fines.`, opts:[`permit`, `prove`, `ban`, `inspire`], ans:2},
  {q:`During the COVID-19 pandemic, travelers should remember to share their previous travel history with their health care providers and make every effort to ______ them by phone before visiting a medical facility.`, opts:[`refer`, `inform`, `avert`, `pose`], ans:1},

  {q:`A report indicates that Taiwanese people ______ almost 7.9 kilograms of apples per person every year, comparable to the quantity of bananas a Taiwanese has a year.`, opts:[`cost`, `compromise`, `confuse`, `consume`], ans:3},
  {q:`Summer time is ______ the best time to visit Penghu Islands. There are eateries open the whole day, and mini cruise ships would take you to fascinating places.`, opts:[`doubtfully`, `definitely`, `suspiciously`, `slightly`], ans:1},

  {q:`Coronavirus has been described as an ______ bullet, silently piercing human’s vital organs.`, opts:[`insensible`, `intricate`, `invisible`, `invaluable`], ans:2},
  {q:`We don’t really know what’s going to happen, but we need to plan for the worst-case ______ .`, opts:[`savor`, `saint`, `scenario`, `slang`], ans:2},

  {q:`In response to the current virus pandemic, the Tourism Bureau is providing financial aid to city and county governments to encourage hotels to participate in the “Epidemic Prevention ______ Hotels” program.`, opts:[`Customs`, `Emigration`, `Kosher`, `Quarantine`], ans:3},
  {q:`The “Yehliu Geopark” is one of the most famous ______ of Taiwan.`, opts:[`feline parks`, `festivals`, `landmarks`, `parking lots`], ans:2},
  {q:`These Herbal Mineral Springs provide herbal ______ springs and beautifying mineral baths.`, opts:[`corporeal`, `spiritual`, `surgical`, `therapeutic`], ans:3},
  {q:`The restaurant is well known for its ______ Taiwanese cuisines to receive three Michelin stars for two consecutive years.`, opts:[`authentic`, `copy`, `hoax`, `spurious`], ans:0},

  {q:`In case of ______ , open the transparent plastic cover and press the red button to stop the escalator.`, opts:[`calmness`, `closure`, `emergency`, `tranquility`], ans:2},
  {q:`Every station has a ticket gate for the ______ , wheelchair users, or passengers with strollers or bulky packages.`, opts:[`able-bodied`, `disabled`, `robust`, `sturdy`], ans:1},
  {q:`According to a newspaper report, blood ______ are running low across Taiwan, with blood banks reporting an average of less than five days of stock.`, opts:[`needs`, `supplies`, `shortages`, `debts`], ans:1},
  {q:`Guide signs are ______ to direct disabled passengers to the trains.`, opts:[`removed`, `separated`, `installed`, `taken off`], ans:2},
  {q:`The temple is unique in that the burning of ______ is banned in the interest of the environment.`, opts:[`diesel oil`, `essential oil`, `incense`, `polymers`], ans:2},
  {q:`One of the most popular pieces of jade ______ in the museum is the Jadeite Cabbage.`, opts:[`calligraphy`, `carvings`, `etchings`, `paintings`], ans:1},
  {q:`The interior surface of the Mao Gong Ding is covered in a/an ______ of 500 characters.`, opts:[`inscription`, `lyric`, `melody`, `subtitle`], ans:0},
  {q:`Use of the fitness center is restricted to ______ guests and members only.`, opts:[`in-situ`, `in-vitro`, `in-vivo`, `in-house`], ans:3},
  {q:`A ______ room is a guest room for which no charge is made.`, opts:[`complimentary`, `laundry`, `maid`, `meeting`], ans:0},
  {q:`By combining traditional culture with ______ technology, Taiwan Lantern Festival presents itself as a shining fest compatible with its international counterparts.`, opts:[`atrocious`, `substandard`, `top-notch`, `unsatisfactory`], ans:2},
  {q:`The National Palace Museum houses the world’s largest ______ of priceless Chinese art treasures.`, opts:[`collection`, `crowd`, `flock`, `herd`], ans:0},
  {q:`The Visitor Visa Application Form can be ______ from the website of the Bureau of Consular Affairs, Ministry of Foreign Affairs.`, opts:[`back loaded`, `downloaded`, `overloaded`, `reloaded`], ans:1},
  {q:`The cultures of Taiwan are a ______ of various sources.`, opts:[`flock`, `hybrid`, `pocket`, `board`], ans:1},
  {q:`To ______ the tax refund, foreign travelers can apply at the port of their departure from Taiwan.`, opts:[`annul`, `claim`, `negate`, `nullify`], ans:1},
  {q:`Pineapple cakes have become one of the top-selling ______ in Taiwan.`, opts:[`cargos`, `facilities`, `fruits`, `souvenirs`], ans:3},
  {q:`Taiwanese peanut ______ are traditional Taiwanese candy with peanuts.`, opts:[`breads`, `cakes`, `pies`, `nougats`], ans:3},
  {q:`Mochi or muah chee is a sweet and chewy dessert made of ______ rice.`, opts:[`black`, `brown`, `glutinous`, `wild`], ans:2},
  {q:`Taiwanese Pork ______ are made of pork mixed with almond in the form of a crisp as thin as a piece of paper.`, opts:[`Chops`, `Knuckles`, `Nougats`, `Sheets`], ans:3},

  {q:`Which of the following explains “Taiwan is home to many breathtaking mountains, hills, and valleys”?`, opts:[`Many people in Taiwan build homes in the breathtaking mountains, hills, and valleys.`, `Taiwan calls breathtaking mountains, hills, and valleys home.`, `Taiwan has many breathtaking mountains, hills, and valleys.`, `Taiwanese see breathtaking mountains, hills, and valleys as homes.`], ans:2},
  {q:`Which of the following may replace “you are bound to” in the second paragraph of the above passage?`, opts:[`you are headed to`, `you are certain to`, `you are oriented to`, `you are wounded up to`], ans:1},

  {q:`What may not be the reason of seated dining a normal practice in some cities?`, opts:[`Social distancing.`, `Curfews.`, `Domestic outings.`, `Lockdowns.`], ans:2},
  {q:`Which of the following explains why “trying times” is used to describe the fight against coronavirus?`, opts:[`It is a time that stifles human ingenuity.`, `It is a time that people are advised to maintain an active social life.`, `It is a time to experiment online learning at school settings.`, `It is a time of struggle, hardship, and challenge.`], ans:3}

const KEYS = ['A','B','C','D'];
const TOTAL_TIME = 4800;
let timeLeft = TOTAL_TIME;
let timerInterval;
let userAnswers = new Array(QUESTIONS.length).fill(-1);
let submitted = false;
let startTime = Date.now();
function buildQuiz() {
  const form = document.getElementById('quizForm');
  const dotGrid = document.getElementById('dotGrid');
  form.innerHTML = ''; dotGrid.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot'; dot.id = `dot${i}`; dot.textContent = i+1;
    dot.onclick = () => document.getElementById(`q${i}`).scrollIntoView({behavior:'smooth', block:'center'});
    dotGrid.appendChild(dot);
    const card = document.createElement('div');
    card.className = 'q-card'; card.id = `q${i}`;
    const qHtml = q.q.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `<div class="q-num">第 ${i+1} 題</div><div class="q-text">${qHtml}</div><div class="options" id="opts${i}">${q.opts.map((opt, j) => `<label class="option-label" id="lbl${i}_${j}" onclick="selectOption(${i},${j})"><input type="radio" name="q${i}" value="${j}"><span class="option-key">${KEYS[j]}</span><span>${opt}</span></label>`).join('')}</div>`;
    form.appendChild(card);
  });
}
function selectOption(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;
  for (let j = 0; j < 4; j++) document.getElementById(`lbl${qi}_${j}`).classList.toggle('selected', j === oi);
  document.getElementById(`q${qi}`).classList.add('answered');
  document.getElementById(`dot${qi}`).classList.add('done');
  document.getElementById('answeredCount').textContent = userAnswers.filter(a => a !== -1).length;
}
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerValue').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    document.getElementById('timerBar').style.width = (timeLeft / TOTAL_TIME * 100) + '%';
    const box = document.getElementById('timerBox');
    if (timeLeft <= 300) box.className = 'timer-box danger';
    else if (timeLeft <= 600) box.className = 'timer-box warning';
    if (timeLeft <= 0) { clearInterval(timerInterval); if (!submitted) { alert('⏰ 時間到！自動交卷。'); submitQuiz(true); } }
  }, 1000);
}
function submitQuiz(forced=false) {
  const unanswered = userAnswers.filter(a => a === -1).length;
  if (!forced && unanswered > 0) {
    document.getElementById('unansMsg').innerHTML = `<div style="background:#fff3cd;border:1.5px solid #ffc107;border-radius:8px;padding:12px;text-align:center;margin:8px 0">⚠️ 尚有 <strong>${unanswered}</strong> 題未作答，確定要交卷嗎？<br><button style="margin-top:8px;padding:6px 16px;background:#e53e3e;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:700" onclick="submitQuiz(true)">確定交卷</button><button style="margin-top:8px;margin-left:8px;padding:6px 16px;background:white;border:1.5px solid #cbd5e0;border-radius:6px;cursor:pointer" onclick="document.getElementById('unansMsg').innerHTML=''">繼續作答</button></div>`;
    return;
  }
  submitted = true; clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const em = Math.floor(elapsed / 60), es = elapsed % 60;
  let correct = 0;
  function isCorrectEng(q, sel) {
    if (q.ans === -1) return true;
    if (Array.isArray(q.ans)) return q.ans.includes(sel);
    return q.ans === sel;
  }
  function correctLabelEng(q) {
    if (q.ans === -1) return '本題一律給分';
    if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
    return KEYS[q.ans] + '：' + q.opts[q.ans];
  }
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`q${i}`);
    const ok = userAnswers[i] !== -1 && isCorrectEng(q, userAnswers[i]);
    const special = q.ans === -1 || Array.isArray(q.ans);
    if (ok) {
      correct++; card.className = 'q-card result-correct';
      const badge = document.createElement('div'); badge.className = 'result-badge ok';
      badge.innerHTML = special ? `✅ 答對（${correctLabelEng(q)}）` : '✅ 答對';
      card.querySelector('.options').after(badge);
    } else {
      card.className = 'q-card result-wrong';
      const badge = document.createElement('div'); badge.className = 'result-badge err'; badge.innerHTML = '❌ 答錯';
      card.querySelector('.options').after(badge);
      const note = document.createElement('div'); note.className = 'correct-note';
      note.innerHTML = `✔ 正確答案：<strong>${correctLabelEng(q)}</strong>`; badge.after(note);
    }
    for (let j = 0; j < 4; j++) {
      const lbl = document.getElementById(`lbl${i}_${j}`); lbl.style.cursor = 'default';
      const isAns = q.ans === -1 ? true : (Array.isArray(q.ans) ? q.ans.includes(j) : q.ans === j);
      if (isAns) lbl.classList.add('correct-ans');
      else if (j === userAnswers[i] && !isAns) lbl.classList.add('wrong-ans');
    }
  });
  const score = correct * (100 / QUESTIONS.length);
  const wrong = QUESTIONS.length - correct - userAnswers.filter(a=>a===-1).length;
  const skip = userAnswers.filter(a=>a===-1).length;
  let grade, gradeColor;
  if (score >= 80) { grade = '🏆 優秀'; gradeColor = '#276749'; }
  else if (score >= 60) { grade = '✅ 及格'; gradeColor = '#2b6cb0'; }
  else { grade = '❌ 未及格'; gradeColor = '#c53030'; }
  document.getElementById('scoreVal').textContent = score.toFixed(0) + ' 分';
  document.getElementById('scoreDetail').textContent = `共 ${QUESTIONS.length} 題・每題 1.25 分`;
  const gradeEl = document.getElementById('scoreGrade');
  gradeEl.textContent = grade; gradeEl.style.background = gradeColor + '22'; gradeEl.style.color = gradeColor;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statSkip').textContent = skip;
  document.getElementById('statTime').textContent = String(em).padStart(2,'0') + ':' + String(es).padStart(2,'0');
  document.getElementById('score-panel').style.display = 'block';
  document.getElementById('unansMsg').innerHTML = '';
  document.querySelector('.btn-submit').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'inline-block';
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth'});
}
function isCorrectEngFilter(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}
function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, i) => {
    const card = document.getElementById(`q${i}`);
    const ok = userAnswers[i] !== -1 && isCorrectEngFilter(q, userAnswers[i]);
    if (mode === 'all') card.style.display = '';
    else if (mode === 'wrong') card.style.display = !ok ? '' : 'none';
    else if (mode === 'correct') card.style.display = ok ? '' : 'none';
  });
}
function resetQuiz() {
  submitted = false; userAnswers = new Array(QUESTIONS.length).fill(-1);
  timeLeft = TOTAL_TIME; startTime = Date.now(); clearInterval(timerInterval);
  document.getElementById('timerBox').className = 'timer-box';
  document.getElementById('timerValue').textContent = '80:00';
  document.getElementById('timerBar').style.width = '100%';
  document.getElementById('score-panel').style.display = 'none';
  document.querySelector('.btn-submit').style.display = 'inline-block';
  document.getElementById('resetBtn').style.display = 'none';
  document.getElementById('unansMsg').innerHTML = '';
  document.getElementById('answeredCount').textContent = '0';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  buildQuiz(); startTimer(); window.scrollTo({top:0, behavior:'smooth'});
}
buildQuiz(); startTimer();
</script>
