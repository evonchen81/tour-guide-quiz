<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',Microsoft JhengHei,sans-serif;background:#f0f4f8;min-height:100vh}
.fixed-top{position:sticky;top:0;z-index:100}
@media(max-width:600px){.progress-area{padding:6px 12px}.dot-grid{max-height:56px;overflow-y:auto}}
.sticky-header{position:relative;background:linear-gradient(135deg,#1a365d,#2b6cb0);color:#fff;padding:12px 20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.exam-title{font-size:1.2rem;font-weight:700}
.exam-sub{font-size:.8rem;opacity:.85;margin-top:2px}
.timer-box{text-align:center;background:rgba(255,255,255,.15);border-radius:10px;padding:6px 14px;min-width:100px}
.timer-box.warning{background:rgba(255,200,0,.3)}
.timer-box.danger{background:rgba(255,80,80,.4)}
.timer-label{font-size:.65rem;opacity:.8}
.timer-value{font-size:1.5rem;font-weight:700;letter-spacing:2px}
.timer-bar-wrap{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:4px}
.timer-bar{height:100%;background:#68d391;border-radius:2px;transition:width .5s}
.progress-area{background:#fff;padding:10px 20px;border-bottom:1px solid #e2e8f0}
.progress-info{font-size:.85rem;color:#4a5568;margin-bottom:6px}
.dot-grid{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;background:#e2e8f0;border:1.5px solid #cbd5e0;font-size:.65rem;display:flex;align-items:center;justify-content:center;color:#718096;cursor:pointer;transition:all .2s}
.dot.done{background:#3182ce;border-color:#2b6cb0;color:#fff}
.main{max-width:800px;margin:0 auto;padding:16px}
.q-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;border:2px solid #e2e8f0;transition:border-color .2s}
.q-card.answered{border-color:#90cdf4}
.q-card.result-correct{border-color:#68d391;background:#f0fff4}
.q-card.result-wrong{border-color:#fc8181;background:#fff5f5}
.q-num{font-size:.8rem;color:#718096;margin-bottom:6px;font-weight:600}
.q-text{font-size:1rem;color:#2d3748;margin-bottom:14px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:8px}
.option-label{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;border:1.5px solid #e2e8f0;cursor:pointer;transition:all .2s;line-height:1.5}
.option-label:hover{background:#ebf8ff;border-color:#90cdf4}
.option-label.selected{background:#ebf8ff;border-color:#3182ce}
.option-label.correct-ans{background:#f0fff4;border-color:#38a169!important}
.option-label.wrong-ans{background:#fff5f5;border-color:#e53e3e!important}
.option-key{font-weight:700;color:#3182ce;min-width:20px}
.option-label input{display:none}
.result-badge{padding:6px 12px;border-radius:6px;font-weight:700;margin-top:8px;font-size:.9rem}
.result-badge.ok{background:#f0fff4;color:#276749}
.result-badge.err{background:#fff5f5;color:#c53030}
.correct-note{margin-top:6px;padding:8px 12px;background:#ebf8ff;border-radius:6px;color:#2b6cb0;font-size:.9rem}
.bottom-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:12px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:50}
.btn-submit{background:#3182ce;color:#fff;border:none;border-radius:8px;padding:12px 40px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-submit:hover{background:#2b6cb0}
#resetBtn{display:none;background:#805ad5;color:#fff;border:none;border-radius:8px;padding:10px 30px;font-size:.95rem;font-weight:700;cursor:pointer}
.score-panel{display:none;background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;border:2px solid #90cdf4;text-align:center}
.score-val{font-size:3rem;font-weight:900;color:#2b6cb0}
.score-grade{display:inline-block;padding:4px 16px;border-radius:20px;font-size:1rem;font-weight:700;margin:8px 0}
.score-detail{color:#718096;font-size:.85rem}
.stats{display:flex;justify-content:center;gap:20px;margin-top:12px;flex-wrap:wrap}
.stat-item{text-align:center}
.stat-num{font-size:1.4rem;font-weight:700}
.stat-label{font-size:.75rem;color:#718096}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #cbd5e0;background:#fff;cursor:pointer;font-size:.85rem}
.filter-btn.active{background:#3182ce;border-color:#3182ce;color:#fff}
@media(max-width:600px){
  .exam-title{font-size:1rem}
  .timer-value{font-size:1.2rem}
  .dot{width:18px;height:18px;font-size:.55rem}
}

/* Explanation panel */
.explanation-panel {
  display: none;
  margin-top: 12px;
  background: #EBF8FF;
  border-left: 4px solid #3182CE;
  border-radius: 0 8px 8px 0;
  padding: 14px 16px;
  font-size: 0.9rem;
  line-height: 1.6;
  color: #2D3748;
  white-space: pre-wrap;
}
.explanation-panel.visible { display: block; }
.explanation-panel strong { color: #1a365d; }
.btn-explain {
  display: inline-block;
  margin-top: 10px;
  padding: 6px 14px;
  background: #3182CE;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: background 0.2s;
}
.btn-explain:hover { background: #2b6cb0; }
</style>
</head>
<body>
<div class="fixed-top">
<div class="sticky-header">
  <div class="header-top">
    <div>
      <div class="exam-title">115年 導遊執業法規 模擬測驗</div>
      <div class="exam-sub">華語導遊人員 ／ 共50題・每題2分・總分100分</div>
    </div>
    <div class="timer-box" id="timerBox">
      <div class="timer-label">剩餘時間</div>
      <div class="timer-value" id="timerValue">60:00</div>
      <div class="timer-bar-wrap"><div class="timer-bar" id="timerBar" style="width:100%"></div></div>
    </div>
  </div>
</div>
<div class="progress-area">
  <div class="progress-info">已作答：<strong id="answeredCount">0</strong> / 50 題</div>
  <div class="dot-grid" id="dotGrid"></div>
</div>
</div>
<div class="main">
  <div id="score-panel" class="score-panel">
    <div class="score-val" id="scoreVal"></div>
    <div class="score-grade" id="scoreGrade"></div>
    <div class="score-detail" id="scoreDetail"></div>
    <div class="stats">
      <div class="stat-item"><div class="stat-num" id="statCorrect" style="color:#38a169"></div><div class="stat-label">答對</div></div>
      <div class="stat-item"><div class="stat-num" id="statWrong" style="color:#e53e3e"></div><div class="stat-label">答錯</div></div>
      <div class="stat-item"><div class="stat-num" id="statSkip" style="color:#718096"></div><div class="stat-label">未作答</div></div>
      <div class="stat-item"><div class="stat-num" id="statTime" style="color:#805ad5"></div><div class="stat-label">用時</div></div>
    </div>
    <div class="filter-bar" style="justify-content:center;margin-top:16px">
      <button class="filter-btn active" onclick="filterQ('all')">全部題目</button>

      <button class="filter-btn" onclick="filterQ('correct')">只看對題</button>
    </div>
  </div>
  <form id="quizForm"></form>
  <div id="unansMsg"></div>
</div>
<div class="bottom-bar">
  <button class="btn-submit" onclick="submitQuiz()">交卷對答案</button>
  <button id="resetBtn" onclick="resetQuiz()">🔄 重新作答</button>
</div>
<script>
const QUESTIONS = [
  {q:`下列何者非發展觀光條例之制定目標？`, opts:[`平衡城鄉差距`, `敦睦國際友誼`, `宏揚傳統文化`, `增進國民身心健康ˉ`], ans:0, exp:`【法條依據】發展觀光條例第1條
【說明】第1條規定制定本條例的目的：發展觀光產業，宏揚傳統文化，推廣自然生態保育意識，永續經營台灣特有之自然生態與人文景觀資源，敦睦國際友誼，增進國民身心健康，加速國內經濟繁榮。選項B（敦睦國際友誼）、C（宏揚傳統文化）、D（增進國民身心健康）都在條文中；「平衡城鄉差距」未列於條文，故選A。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=1`},
  {q:`有關導遊人員之評量測驗，下列敘述何者錯誤？`, opts:[`華語導遊人員類科，以各科目平均成績滿六十分為及格`, `外語導遊人員類科筆試，以各科目平均成績滿六十分且外國語科目成績滿五十分為及格。部分科目免測 者，以外國語科目成績滿六十分為及格`, `外語導遊人員類科口試，以各口試委員之評分成績皆滿六十分為及格`, `有一科成績為零分者，不予及格`], ans:2, exp:`【法條依據】導遊人員管理規則第19條
【說明】第19條規定：華語導遊人員類科，以各科目平均成績滿六十分為及格（A正確）；外語導遊人員類科筆試，以各科目平均成績滿六十分且外國語科目成績滿五十分為及格，部分科目免測者，以外國語科目成績滿六十分為及格（B正確）；外語導遊人員類科口試，以「各口試委員評分之平均成績」滿六十分為及格，並非每位委員的評分都要滿六十分（C錯誤）；有一科成績為零分者，不予及格（D正確）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110003&flno=19`},
  {q:`交通部觀光署在亞洲那些城市設置駐外辦事處？`, opts:[`東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、河內等地`, `東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、澳門等地`, `東京、大阪、釜山、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、胡志明市等地`, `東京、大阪、首爾、新加坡、吉隆坡、曼谷、香港、北京、上海（福州）、福岡等地`], ans:2, exp:`【資料依據】交通部觀光署行政資訊網「組織與職掌」（駐外辦事處）；該頁最後更新日期 2024/01/08
【說明】該頁載明觀光署為辦理國際觀光推廣業務，在亞洲的東京、大阪、首爾、釜山、胡志明市、曼谷、吉隆坡、新加坡、香港、北京、上海（福州）等地設置駐外辦事處。選項C所列城市全部設有辦事處；A含河內、B含澳門、D含福岡，這三個城市不在清單內。（首爾亦設有辦事處，但選項C所列城市皆屬實，A、B、D 則各含一個未設辦事處的城市。）釜山辦事處於2023年11月13日由服務站升格為辦事處。
【官方連結】https://admin.taiwan.net.tw/Organize/Articles?a=27
（釜山：https://admin.taiwan.net.tw/Organize/Articles?a=18812）`},
  {q:`依據旅行業管理規則規定，有關不得聘為旅行業經理人之敘述，下列何者錯誤？`, opts:[`曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行`, `曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後未 逾五年`, `曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之刑確定，尚未執行`, `曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或 赦免後未逾三年`], ans:3, exp:`【法條依據】旅行業管理規則第14條第1款、第2款
【說明】第14條規定，有下列情事者不得為旅行業的發起人、董事、監察人、經理人等：（1）曾犯組織犯罪防制條例之罪，經有罪判決確定，尚未執行、尚未執行完畢，或執行完畢、緩刑期滿或赦免後未逾五年（A、B正確）；（2）曾犯詐欺、背信、侵占罪經宣告有期徒刑一年以上之刑確定，尚未執行、尚未執行完畢，或執行完畢、緩刑期滿或赦免後未逾「二年」（C正確）。D寫「未逾三年」，與條文的「二年」不符，故D錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=14`},
  {q:`依據發展觀光條例規定，主管機關為勘定風景特定區範圍，得派員進入公私有土地實施勘查或測量。但應 先以何種方式通知土地所有權人或其使用人？`, opts:[`當面通知`, `公告通知`, `電話通知`, `書面通知`], ans:3, exp:`【法條依據】發展觀光條例第16條第1項
【說明】第16條第1項規定，主管機關為勘定風景特定區範圍，得派員進入公私有土地實施勘查或測量，但應先以「書面」通知土地所有權人或其使用人，故選D。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=16`},
  {q:`旅行業所派遣之隨團服務人員執行業務時應遵守之規定，下列何者錯誤？`, opts:[`不得未經旅客請求而變更旅程`, `應揭露行程資訊內容`, `不得有不利國家之言行`, `應全程統一保管旅客證件以免遺失`], ans:3, exp:`【法條依據】旅行業管理規則第50條第1款、第5款、第6款、第11款
【說明】第50條規定，旅行業及其所派遣的隨團服務人員執行業務時應遵守：不得有不利國家之言行（第1款，C正確）；除有不可抗力因素外，不得未經旅客請求而變更旅程（第5款，A正確）；應妥適安排旅遊行程，並揭露行程資訊內容（第11款，B正確）；除因代辦必要事項須臨時持有旅客證照外，非經旅客請求，不得以任何理由保管旅客證照（第6款）。D「應全程統一保管旅客證件」與第6款不符，故D錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=50`},
  {q:`依據發展觀光條例規定，旅行業未依規定辦理履約保證保險或責任保險，主管機關處置作為，下列何者錯 誤？`, opts:[`處新臺幣三萬元以上五十萬元以下罰鍰`, `處新臺幣十萬元以上五十萬元以下罰鍰`, `得立即停止其辦理旅客之出國及國內旅遊業務`, `限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照`], ans:1, exp:`【法條依據】發展觀光條例第57條第1項
【說明】第57條第1項規定，旅行業未依第31條規定辦理履約保證保險或責任保險，處新臺幣三萬元以上五十萬元以下罰鍰（A正確），中央主管機關得立即停止其辦理旅客之出國及國內旅遊業務（C正確），並限於三個月內辦妥投保，逾期未辦妥者，得廢止其旅行業執照（D正確）。B寫「十萬元以上五十萬元以下」，與條文的「三萬元以上」不符，故B錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=57`},
  {q:`依據旅行業管理規則規定，旅行業辦理旅遊業務，下列敘述何者錯誤？`, opts:[`甲種旅行業、乙種旅行業代理綜合旅行業招攬團體旅遊業務，應經綜合旅行業之委託，並以綜合旅行業 名義與旅客簽訂旅遊契約，並由銷售旅行業副署`, `旅行業經營自行組團業務，未經旅客書面同意，不得將該旅行業務轉讓其他旅行業辦理`, `旅行業受理旅行業務之轉讓時，應與旅客重新簽訂旅遊契約`, `甲種旅行業、乙種旅行業經營自行組團業務，得將其招攬文件置於其他旅行業，委託該其他旅行業代為 銷售、招攬`], ans:3, exp:`【法條依據】旅行業管理規則第39條、第40條
【說明】第39條第1、2項規定，甲種或乙種旅行業代理綜合旅行業招攬業務，應經綜合旅行業之委託，並以綜合旅行業名義與旅客簽訂旅遊契約，且該契約應由銷售旅行業副署（A正確）。第40條第1項規定，旅行業經營自行組團業務，非經旅客書面同意，不得將該旅行業務轉讓其他旅行業辦理（B正確）；第2項規定，受理轉讓時，應與旅客重新簽訂旅遊契約（C正確）；第3項規定，甲種、乙種旅行業經營自行組團業務，「不得」將其招攬文件置於其他旅行業，委託代為銷售、招攬。D說「得」，與第3項相反，故D錯誤。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=40
（第39條：https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=39）`},
  {q:`依據旅行業管理規則規定，旅行業經理人訓練測驗成績以一百分為滿分，及格分數為多少分？`, opts:[`六十分`, `六十五分`, `七十分`, `七十五分`], ans:2, exp:`【法條依據】旅行業管理規則第20條第1項
【說明】第20條第1項規定，旅行業經理人訓練測驗成績以一百分為滿分，七十分為及格，故選C。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=20`},
  {q:`依據導遊人員管理規則規定，外語導遊人員評量測驗應測科目缺考者，如何處理？`, opts:[`可視缺考科目自動補考`, `視為零分`, `缺考科目不計入平均成績`, `只影響外國語科目成績`], ans:1, exp:`【法條依據】導遊人員管理規則第19條

  {q:`依據管理外匯條例規定，對於故意不申報或申報不實外匯者，罰鍰範圍為何？`, opts:[`新臺幣三萬元以上六十萬元以下`, `新臺幣三萬元以上一百萬元以下`, `按交易金額二倍以下`, `沒收外匯`], ans:0, exp:`【法條依據】管理外匯條例第20條第1項
【說明】第20條第1項規定，違反第6條之1規定，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；其受查詢而未於限期內提出說明或為虛偽說明者亦同。故選A。

  {q:`依據旅行業管理規則規定，旅行業以所屬或透過其他網路平臺、行動應用程式（APP）、其他電子方式經 營旅行業務者，應於其頁面及介面揭露下列那些必要事項？①公司名稱、種類、地址 ②公司資本額及保 證金 ③公司品保協會會員編號 ④公司註冊編號及代表人姓名 ⑤公司電話、傳真、電子信箱號碼及聯 絡人`, opts:[`①②③`, `①②④`, `②③⑤`, `①④⑤`], ans:3, exp:`【法條依據】旅行業管理規則第44條
【說明】第44條規定，旅行業以所屬或透過其他網路平臺、行動應用程式（APP）、其他電子方式經營旅行業務者，應於其頁面及介面揭露：（一）公司名稱、種類、地址、註冊編號及代表人姓名（對應①④）；（二）電話、傳真、電子信箱號碼及聯絡人（對應⑤）。②公司資本額及保證金、③公司品保協會會員編號不在條文所列事項中。故選D（①④⑤）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110002&flno=44`},
  {q:`外籍旅客在購物退稅之特約商店，同一日向同一特約商店購物累計含稅消費金額在新臺幣多少元以上，得 於購物當日持入境證照向商店申請開立退稅表單，並於幾天內將隨行貨物攜帶出境？`, opts:[`三千元以上；六十天內`, `三千元以上；九十天內`, `二千元以上；六十天內`, `二千元以上；九十天內`], ans:3, exp:`【法條依據】外籍旅客購買特定貨物申請退還營業稅實施辦法第3條第4款、第6款
【說明】第3條第4款規定，「達一定金額以上」是指同一天內向同一特定營業人購買特定貨物，累計含稅消費金額達新臺幣二千元以上。第6款規定，「一定期間」是指自購買特定貨物之日起，至攜帶特定貨物出境之日止，未逾九十日（辦理特約市區退稅者，另應於申請退稅之日起二十日內攜帶特定貨物出境）。故選D（二千元以上；九十天內）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110023&flno=3`},
  {q:`國際旅客報名參加我國旅行社舉辦之國內團體旅遊時，旅行社應指派或僱用導遊人員執行接待或引導觀 光旅客旅遊業務，若未依規定派遣合法導遊人員而執行業務者，依據發展觀光條例規定，處新臺幣多少元 罰鍰，並禁止其執業？`, opts:[`一萬元以上二萬元以下`, `一萬元以上三萬元以下`, `一萬元以上四萬元以下`, `一萬元以上五萬元以下`], ans:3, exp:`【法條依據】發展觀光條例第32條第2項、第59條
【說明】第32條第2項規定，導遊人員及領隊人員應經中央主管機關發給執業證，並受旅行業僱用或受政府機關、團體之臨時招請，始得執行業務。第59條規定，未依第32條規定取得執業證而執行導遊人員或領隊人員業務者，處新臺幣一萬元以上五萬元以下罰鍰，並禁止其執業。故選D。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=59
（第32條：https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110001&flno=32）`},
  {q:`王先生高中畢業後，欲執行接待日本、歐美等地非華語之觀光旅客業務，應參加何種評量測驗，並領取何 種執業證？`, opts:[`考取華語導遊人員執業證即可，搭配外語翻譯人員執行業務`, `應參加外語導遊人員類科評量測驗，並領取外語導遊人員執業證`, `參加華語導遊人員評量測驗，因為來臺旅遊者均應具備華語溝通能力`, `必須同時通過華語導遊人員及外語導遊人員兩類科的評量測驗`], ans:1, exp:`【法條依據】導遊人員管理規則第4條、第11條第1項第1款
【說明】第4條規定，領取英語、日語或其他外語導遊人員執業證者，得執行接待或引導國外、大陸地區、香港、澳門觀光旅客旅遊業務；領取華語導遊人員執業證者，得接待使用華語的觀光旅客，不得接待或引導非使用華語之國外觀光旅客（僅在搭配稀少外語翻譯人員時，得接待非使用華語之國外「稀少語別」觀光旅客，且須經觀光署公告）。日本、歐美旅客屬非華語旅客，故應參加外語導遊人員類科評量測驗並領取外語導遊人員執業證。高中畢業符合第11條第1項第1款的報名資格（高級中學以上學校畢業）。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=K0110003&flno=4

  {q:`依據護照條例規定，下列那種情形得申請換發護照？`, opts:[`護照所餘效期不足二年`, `所持護照非屬現行最新式樣者`, `持照人之相貌變更與護照照片不符`, `護照內植晶片無法讀取`], ans:1, exp:`【法條依據】護照條例第19條

  {q:`發展觀光條例的名詞定義中，下列何者為依規定程序劃定之風景或名勝地區？`, opts:[`觀光地區`, `國家公園`, `自然人文生態景觀區`, `風景特定區`], ans:3, exp:`【法條依據】發展觀光條例第2條第4款

  {q:`有關觀光遊憩地區及其主管機關，下列何者錯誤？`, opts:[`大學實驗林：教育部`, `自然地景：農業部`, `國家公園：交通部`, `水庫：經濟部`], ans:2, exp:`【法條依據】國家公園法第3條；文化資產保存法第4條第1項

  {q:`依據交通部觀光署處務規程，有關「觀光遊樂業之發展規劃」係屬於該署那一單位業務？`, opts:[`國際組`, `企劃組`, `旅行業組`, `旅遊推廣組`], ans:3, exp:`【法條依據】交通部觀光署處務規程第9條第2款

  {q:`依據發展觀光條例規定，觀光主管機關對各地特有產品及手工藝品之作法為何？ ①應會同有關機關調查統計 ②輔導改良其生產及製作技術，提高品質，標明價格 ③洽請旅行業者協助促銷販售 ④協助在各觀光地區商號集中銷售`, opts:[`①②③`, `①②④`, `①③④`, `②③④`], ans:1, exp:`【法條依據】發展觀光條例第34條第1項

  {q:`依據導遊人員管理規則規定，有關參加導遊人員職前訓練之退訓，下列何者正確？ ①缺課節數逾十五分之一者 ②受訓期間對講座、輔導員或其他辦理訓練人員施以強暴脅迫者 ③由他人冒名頂替參加訓練者 ④經退訓，其已繳納之訓練費用，不得申請退還`, opts:[`①②④`, `①②③`, `①③④`, `②③④`], ans:3, exp:`【法條依據】導遊人員管理規則第29條第1項
【說明】受訓人員在職前訓練期間有下列情形之一者應予退訓，且已繳納之訓練費用不得申請退還：缺課節數逾十分之一（第1款）、對講座、輔導員或其他辦理訓練人員施以強暴脅迫（第2款，對應②）、由他人冒名頂替參加訓練（第3款，對應③）等。④退訓後訓練費用不得申請退還，亦在本項規定內。①所稱缺課「十五分之一」與條文「十分之一」不符。故選D（②③④）。

  {q:`依據外匯收支或交易申報辦法規定，非居住民可逕向銀行業辦理每筆新臺幣結購或結售之限額為何？`, opts:[`十萬美元`, `十五萬美元`, `二十萬美元`, `二十五萬美元`], ans:0, exp:`【法條依據】外匯收支或交易申報辦法第4條第1項第5款

  {q:`依據旅行業管理規則規定，下列何者不是乙種旅行社之業務內容？`, opts:[`招攬或接待本國旅客或取得合法居留證件之外國人、香港、澳門居民及大陸地區人民國內旅遊、食宿、 交通及提供有關服務`, `提供旅客於購買旅遊商品或服務時，附隨代收透過其所屬網路平臺或行動應用程式（APP），與保險業 合作推廣旅遊相關保險商品之保險費`, `代理綜合旅行業招攬國內團體旅遊業務`, `代理外國旅行業辦理聯絡、推廣、報價等業務`], ans:3, exp:`【法條依據】旅行業管理規則第3條第2項第8款、第4項

  {q:`外國旅客在臺旅遊期間，前往銀行欲將歐元旅行支票換成新臺幣，係以下列何種歐元匯率兌換？`, opts:[`即期賣匯`, `即期買匯`, `現金賣匯`, `現金買匯`], ans:1, exp:`【資料依據】銀行外幣買賣匯率的一般用語（台新銀行「即期匯率與現金匯率」說明）
【說明】外國旅客把歐元旅行支票換成新臺幣，是由銀行買入外幣（旅客賣出外幣），所以要看銀行的「買匯」匯率；賣匯是銀行賣出外幣給客戶時使用，方向相反（A、C不選）。現金匯率適用實體外幣鈔票的交易，因實體鈔票有保管與運輸成本，匯率通常比即期匯率差；旅行支票不是實體鈔票，採即期匯率，故選B（即期買匯），不選D（現金買匯）。旅行支票適用即期買匯一點，本解析未找到主管機關的明文規定。

  {q:`依據發展觀光條例規定，旅遊產品需由旅行社專屬販售，但以下的何種旅行產品可以在臺灣便利商店買到？`, opts:[`外國人來臺旅遊行程`, `台灣高鐵或臺灣鐵路公司之車票`, `國人出國之團體旅遊`, `國人國內套裝旅遊`], ans:1, exp:`【法條依據】發展觀光條例第27條第3項；旅行業管理規則第3條第5項

  {q:`王小明的家就在東部海岸國家風景區範圍內，最近他父親想將老家的舊平房打掉，原地改建成色彩鮮豔華 麗的三層樓高級洋房，小明跟他父親說：「爸爸，這要向國家風景區管理處先申請看可不可以啦！」他父 親說：「不必吧，建築執照是向縣政府申請，又不是管理處。」有關上述議題，下列敘述何者正確？`, opts:[`不論翻修後建築物之造形、構造、色彩等，小明的父親只要直接按照建築法向縣政府申請就可以`, `在縣政府核准及全部完工之後，為維持國家風景特定區之美觀，再就該建築物之造形、構造、色彩等向 國家風景區管理處申請建築執照`, `為維持國家風景特定區之美觀，區內建築物之造形、構造、色彩等，國家風景區管理處得實施規劃限制`, `為維護人民居住自由權，區內建築物之造形、構造、色彩等，國家風景區管理處不得實施規劃限制`], ans:2, exp:`【法條依據】發展觀光條例第12條；觀光地區及風景特定區建築物及廣告物攤位設置規劃限制辦法第1條
【說明】條例第12條規定，為維持觀光地區及風景特定區之美觀，區內建築物之造形、構造、色彩等及廣告物、攤位之設置，得實施規劃限制，其辦法由中央主管機關會同有關機關訂定；該辦法第1條即明定依第12條訂定。因此風景區內建築物之造形、構造、色彩等可由主管機關實施規劃限制，D 說「不得實施」與條文相反，故選C。選項A、B本解析未逐一引用法規。

  {q:`有關大陸地區人民組團來臺從事觀光活動，下列敘述何者正確？ ①應由旅行業組團辦理，並以團進團出方式為之，每團人數限四人以上五十人以下 ②旅行業辦理接待大陸地區人民來臺從事個人旅遊，不得接待由香港、澳門或大陸地區旅行業、其他機構 或個人組成之個人旅遊旅客團體 ③所稱個人旅遊旅客團體，指全團均由來臺從事個人旅遊之旅客所組成，或由來臺從事個人旅遊之旅客與 來臺從事觀光活動以外目的之大陸地區人民所組成 ④個人旅遊旅客團體，由大陸地區人民、香港或澳門居民隨團執行領隊人員業務者，推定係由香港、澳門 或大陸地區旅行業、其他機構或個人組成`, opts:[`①②③`, `①②④`, `①③④`, `②③④`], ans:3, exp:`【法條依據】大陸地區人民來臺從事觀光活動許可辦法第5條、第5-1條

  {q:`陳先生原設籍中國大陸，目前旅居加拿大，盼前來臺灣旅遊，試問若其符合下列何種條件，即非臺灣地區 與大陸地區人民關係條例所規範之大陸地區人民？`, opts:[`旅居國外四年以上或取得當地國籍`, `旅居國外四年以上並取得當地國籍`, `旅居國外六年以上或取得當地永久居留權`, `旅居國外六年以上並取得當地永久居留權`], ans:1, exp:`【法條依據】臺灣地區與大陸地區人民關係條例施行細則第7條第1項
【說明】施行細則第7條第1項規定，條例第3條所定大陸地區人民旅居國外者，不含旅居國外四年以上並取得當地國籍者（第1款），以及旅居國外四年以上、取得當地永久居留權並領有我國有效護照者（第2款）。陳先生旅居加拿大，須「四年以上」且「取得當地國籍」，才不屬條例所稱大陸地區人民。故選B。
【官方連結】https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=Q0010002&flno=7`},
  {q:`臺灣地區與大陸地區人民關係條例以規範涉及兩岸人民往來交流有關之權利義務事項為原則，下列何者 是該條例所規範處理項目？ ①兩岸主權與定位問題 ②兩岸政治與經貿議題 ③規範兩岸人民往來交流所衍生之法律事項 ④大陸地區人民在臺設籍後取得公職工作之規定`, opts:[`①②`, `②③`, `③④`, `①④`], ans:2, exp:`【法條依據】臺灣地區與大陸地區人民關係條例第1條、第21條第1項
【說明】第1條規定，本條例是為規範臺灣地區與大陸地區人民之往來，並處理衍生之法律事件而制定（③）。第21條第1項規定大陸地區人民經許可進入臺灣地區設有戶籍滿十年後，始得擔任公教或公營事業機關（構）人員等，屬本條例規範的人民權利義務事項（④）。故選C（③④）。選項①②本解析未逐一引用法規。

  {q:`大陸地區人民申請來臺觀光符合一定情形者，內政部移民署得發給逐次加簽或一年多次入出境許可證。下 列敘述何者正確？ ①最近十二個月內曾符合規定來臺從事個人旅遊二次以上，且無違規情形 ②大陸地區帶團領隊 ③持有與臺灣地區旅行業者所簽訂合作契約之導遊 ④持有經大陸地區核發往來臺灣之個人旅遊多次簽`, opts:[`①②③`, `①②④`, `②③④`, `①③④`], ans:1, exp:`【法條依據】大陸地區人民來臺從事觀光活動許可辦法第8條第3項
【說明】第8條第3項規定，申請來臺觀光符合下列情形之一者，移民署得發給逐次加簽或一年多次入出境許可證：依第3條第3款或第4款規定申請且經許可（第1款）；最近十二個月內曾依第3條之1規定來臺從事個人旅遊二次以上，且無違規情形（第2款，對應①）；大陸地區帶團領隊（第3款，對應②）；持有經大陸地區核發往來臺灣之個人旅遊多次簽（第4款，對應④）。③「持有與臺灣地區旅行業者所簽訂合作契約之導遊」不在條文所列。故選B（①②④）。

【說明】第22條第1項規定：每一團體應派遣至少一名導遊人員（第3款，A）；應於團體入境後二個小時內，填具入境接待通報表傳送或持送主管機關（第2款，C）；應於團體出境二個小時內，通報出境人數及未出境人員名單（第9款，D）；行程之住宿地點或購物商店變更時，「應立即通報」（第5款）。B 說「得視情況通報」，與條文規定應立即通報不符。故選B（錯誤）。

];
const KEYS=['A','B','C','D'];
const TOTAL_TIME=3600;
let timeLeft=TOTAL_TIME,timerInterval,userAnswers=new Array(QUESTIONS.length).fill(-1),submitted=false,startTime=Date.now();
function buildQuiz(){
  const form=document.getElementById('quizForm'),dg=document.getElementById('dotGrid');
  form.innerHTML='';dg.innerHTML='';
  QUESTIONS.forEach((q,i)=>{
    const dot=document.createElement('div');
    dot.className='dot';dot.id=`dot${i}`;dot.textContent=i+1;
    dot.onclick=()=>document.getElementById(`q${i}`).scrollIntoView({behavior:'smooth',block:'center'});
    dg.appendChild(dot);
    const card=document.createElement('div');
    card.className='q-card';card.id=`q${i}`;
    card.innerHTML=`<div class="q-num">第 ${i+1} 題</div><div class="q-text">${q.q}</div><div class="options" id="opts${i}">${q.opts.map((opt,j)=>`<label class="option-label" id="lbl${i}_${j}" onclick="selectOption(${i},${j})"><input type="radio" name="q${i}" value="${j}"><span class="option-key">${KEYS[j]}</span><span>${opt}</span></label>`).join('')}</div>`;
    form.appendChild(card);
  });
}
function selectOption(qi,oi){
  if(submitted)return;
  userAnswers[qi]=oi;
  for(let j=0;j<4;j++)document.getElementById(`lbl${qi}_${j}`).classList.toggle('selected',j===oi);
  document.getElementById(`q${qi}`).classList.add('answered');
  document.getElementById(`dot${qi}`).classList.add('done');
  document.getElementById('answeredCount').textContent=userAnswers.filter(a=>a!==-1).length;
}
function startTimer(){
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerValue').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
    document.getElementById('timerBar').style.width=(timeLeft/TOTAL_TIME*100)+'%';
    const box=document.getElementById('timerBox');
    if(timeLeft<=300)box.className='timer-box danger';
    else if(timeLeft<=600)box.className='timer-box warning';
    if(timeLeft<=0){clearInterval(timerInterval);if(!submitted){alert('⏰ 時間到！自動交卷。');submitQuiz(true);}}
  },1000);
}
function submitQuiz(forced=false){
  const unanswered=userAnswers.filter(a=>a===-1).length;
  if(!forced){
    document.getElementById('unansMsg').innerHTML=`<div style="background:#fff3cd;border:1.5px solid #ffc107;border-radius:8px;padding:12px;text-align:center;margin:8px 0">${unanswered>0?`⚠️ 尚有 <strong>${unanswered}</strong> 題未作答，確定要交卷嗎？`:'✅ 已全部作答，確定要交卷嗎？'}<br><button style="margin-top:8px;padding:6px 16px;background:#e53e3e;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:700" onclick="submitQuiz(true)">確定交卷</button><button style="margin-top:8px;margin-left:8px;padding:6px 16px;background:white;border:1.5px solid #cbd5e0;border-radius:6px;cursor:pointer" onclick="document.getElementById('unansMsg').innerHTML=''">繼續作答</button></div>`;
    const box=document.getElementById('unansMsg');box.style.scrollMarginBottom='90px';box.scrollIntoView({behavior:'smooth',block:'end'});
    return;
  }
  submitted=true;document.getElementById('unansMsg').innerHTML='';clearInterval(timerInterval);
  const elapsed=Math.round((Date.now()-startTime)/1000),em=Math.floor(elapsed/60),es=elapsed%60;
  let correct=0;
  QUESTIONS.forEach((q,i)=>{
    const card=document.getElementById(`q${i}`);
    if(userAnswers[i]===q.ans){
      correct++;card.className='q-card result-correct';
      const b=document.createElement('div');b.className='result-badge ok';b.innerHTML='✅ 答對';card.querySelector('.options').after(b);
      if(q.exp){const ep=document.createElement('div');ep.className='explanation-panel';ep.textContent=q.exp;const bt=document.createElement('button');bt.className='btn-explain';bt.type='button';bt.textContent='查看解析';bt.onclick=function(){ep.classList.toggle('visible');bt.textContent=ep.classList.contains('visible')?'收起解析':'查看解析';};b.after(bt);bt.after(ep);}
    }else{
      card.className='q-card result-wrong';
      const b=document.createElement('div');b.className='result-badge err';b.innerHTML='❌ 答錯';card.querySelector('.options').after(b);
      const n=document.createElement('div');n.className='correct-note';n.innerHTML=`✔ 正確答案：<strong>${KEYS[q.ans]}：${q.opts[q.ans]}</strong>`;b.after(n);
      if(q.exp){const ep=document.createElement('div');ep.className='explanation-panel';ep.textContent=q.exp;const bt=document.createElement('button');bt.className='btn-explain';bt.type='button';bt.textContent='查看解析';bt.onclick=function(){ep.classList.toggle('visible');bt.textContent=ep.classList.contains('visible')?'收起解析':'查看解析';};n.after(bt);bt.after(ep);}
    }
    for(let j=0;j<4;j++){
      const lbl=document.getElementById(`lbl${i}_${j}`);
      lbl.style.cursor='default';
      if(j===q.ans)lbl.classList.add('correct-ans');
      else if(j===userAnswers[i]&&userAnswers[i]!==q.ans)lbl.classList.add('wrong-ans');
    }
  });
  const score=Math.round(correct*100/QUESTIONS.length);
  const wrong=QUESTIONS.length-correct-userAnswers.filter(a=>a===-1).length;
  const skip=userAnswers.filter(a=>a===-1).length;
  let grade,gc;
  if(score>=80){grade='🏆 優秀';gc='#276749';}else if(score>=60){grade='✅ 及格';gc='#2b6cb0';}else{grade='❌ 未及格';gc='#c53030';}
  document.getElementById('scoreVal').textContent=score+' 分';
  document.getElementById('scoreDetail').textContent=`共 ${QUESTIONS.length} 題・每題 ${(100/QUESTIONS.length).toFixed(1)} 分`;
  const ge=document.getElementById('scoreGrade');ge.textContent=grade;ge.style.background=gc+'22';ge.style.color=gc;
  document.getElementById('statCorrect').textContent=correct;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statSkip').textContent=skip;
  document.getElementById('statTime').textContent=String(em).padStart(2,'0')+':'+String(es).padStart(2,'0');
  document.getElementById('score-panel').style.display='block';
  document.getElementById('unansMsg').innerHTML='';
  document.querySelector('.btn-submit').style.display='none';
  document.getElementById('resetBtn').style.display='inline-block';
  document.getElementById('score-panel').scrollIntoView({behavior:'smooth'});
}
function filterQ(mode){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q,i)=>{
    const card=document.getElementById(`q${i}`);
    if(mode==='all')card.style.display='';
    else if(mode==='wrong')card.style.display=(userAnswers[i]!==q.ans)?'':'none';
    else card.style.display=(userAnswers[i]===q.ans)?'':'none';
  });
}
function resetQuiz(){
  submitted=false;userAnswers=new Array(QUESTIONS.length).fill(-1);
  timeLeft=TOTAL_TIME;startTime=Date.now();clearInterval(timerInterval);
  document.getElementById('timerBox').className='timer-box';
  document.getElementById('timerValue').textContent='60:00';
  document.getElementById('timerBar').style.width='100%';
  document.getElementById('score-panel').style.display='none';
  document.querySelector('.btn-submit').style.display='inline-block';
  document.getElementById('resetBtn').style.display='none';
  document.getElementById('unansMsg').innerHTML='';
  document.getElementById('answeredCount').textContent='0';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  buildQuiz();startTimer();window.scrollTo({top:0,behavior:'smooth'});
}
buildQuiz();startTimer();
</script>
