<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>

<body>

<script>
const QUESTIONS = [{"num": 1, "text": "依發展觀光條例之規定，民間機構開發經營下列何種設施得經中央主管機關核定，其範圍內所需用 地如需辦理土地使用變更，得申請都市計畫或區域計畫之逕行變更？", "opts": ["民宿 [B] 旅館 [C] 觀光旅館 [D] 旅行社", "", "", ""], "ans": 2}, {"num": 2, "text": "依據發展觀光條例規定，中央觀光主管機關應多久就觀光市場進行調查及資訊蒐集？", "opts": ["每年 [B] 每二年 [C] 每三年 [D] 每四年", "", "", ""], "ans": 0}, {"num": 3, "text": "有關綜合旅行業在國外設立分支機構之相關規定，下列何者正確？", "opts": ["應向交通部觀光局提出申請設立 [B] 應向交通部觀光局提出申請註冊", "應報請交通部觀光局備查 [D] 應繳納保證金", "", ""], "ans": 2}, {"num": 4, "text": "依旅行業管理規則規定，甲種旅行業實收之資本總額不得少於新臺幣多少元？", "opts": ["1,000 萬 [B] 600 萬 [C] 500 萬 [D] 300 萬", "", "", ""], "ans": 1}, {"num": 5, "text": "依旅行業管理規則規定，綜合旅行業在國內每增設一家分公司，須增資新臺幣至少多少元？", "opts": ["150 萬 [B] 250 萬 [C] 350 萬 [D] 450 萬", "", "", ""], "ans": 0}, {"num": 6, "text": "依旅行業管理規則規定，經營旅行業者，應繳納註冊費、保證金。其註冊費按資本總額的多少比例 繳納？", "opts": ["千分之一 [B] 千分之二 [C] 千分之三 [D] 千分之四", "", "", ""], "ans": 0}, {"num": 7, "text": "某甲欲前往日本東京旅遊，想查詢本季旅遊市場約略的航空票價及食宿費用，依旅行業管理規則規 定，下列那個單位會按季發表旅遊消費資訊可供參考？", "opts": ["交通部觀光局 [B] 臺灣觀光協會", "中華民國旅行業商業同業公會全國聯合會 [D] 中華民國旅行業品質保障協會", "", ""], "ans": 3}, {"num": 8, "text": "依旅行業管理規則規定，外國旅行業在中華民國設立分公司，其實收資本額適用何規定？", "opts": ["準用中華民國旅行業本公司之規定 [B] 準用中華民國旅行業分公司之規定", "依該國旅行業本公司之規定 [D] 依該國旅行業分公司之規定", "", ""], "ans": 0}, {"num": 9, "text": "依旅行業管理規則規定，下列何者非屬團體旅遊文件之契約書應載明之事項？", "opts": ["旅遊地區及行程 [B] 旅行業執照字號 [C] 旅行業註冊編號 [D] 旅遊團名 代號： 2601 頁次： 8 － 2", "", "", ""], "ans": 3}, {"num": 10, "text": "依旅行業管理規則規定，旅行業辦理國內外觀光團體旅遊業務，發生緊急事故時之處置，下列敘述 何者錯誤？", "opts": ["緊急事故，係指造成旅客傷亡或滯留之天災或其他各種事變", "應為迅速、妥適之處理，維護旅客權益，並應對受害旅客家屬提供必要之協助", "在事故發生後 36 小時內應向交通部觀光局報備", "向交通部觀光局報備時應填具緊急事故報告書，並檢附該旅遊團團員名冊、行程表、責任保險單 及其他相關資料"], "ans": 2}, {"num": 11, "text": "依旅行業管理規則規定，關於綜合及甲種旅行業為旅客代辦出入國手續，下列敘述何者錯誤？", "opts": ["應向交通部觀光局請領專任送件人員識別證，並應指定專人負責送件", "專任送件人員識別證不得借供其他旅行業使用", "旅行業為旅客代辦出入國手續，得簽訂委託契約書委託他旅行業代為送件", "專任送件人員異動時，應於 1 個月內將識別證繳回交通部觀光局或其委託之旅行業相關團體"], "ans": 3}, {"num": 12, "text": "中華民國旅行業品質保障協會為依法設立之觀光公益法人，辦理會員旅遊品質保證業務，依據旅行 業管理規則之規定，應受下列何單位監督？", "opts": ["行政院消費者保護處 [B] 公平交易委員會", "交通部觀光局 [D] 中華民國消費者文教基金會", "", ""], "ans": 2}, {"num": 13, "text": "依星級旅館評鑑作業要點規定，五星級旅館之基本條件，至少設有多少間以上高級餐廳？", "opts": ["0 [B] 1 [C] 2 [D] 3", "", "", ""], "ans": 2}, {"num": 14, "text": "截至目前我國設有幾處國家公園（不含國家自然公園）？", "opts": ["10 [B] 9 [C] 8 [D] 7", "", "", ""], "ans": 1}, {"num": 15, "text": "為配合行政院「新南向政策」，自民國 105 年 8 月 1 日起，新增那兩國人民來臺入境，實施 30 天免 簽證？", "opts": ["馬來西亞、新加坡 [B] 泰國、緬甸 [C] 柬埔寨、汶萊 [D] 泰國、汶萊", "", "", ""], "ans": 3}, {"num": 16, "text": "交通部觀光局為協助地方政府形塑國際觀光魅力據點，至民國 104 年已完成 9 處魅力據點，以下何 者不包括？", "opts": ["臺東縣「慢活臺東 鐵道新聚落」 [B] 金門縣「戰地風華」", "新北市「驚艷水金九」 [D] 彰化縣「鹿港工藝薈萃」", "", ""], "ans": 1}, {"num": 17, "text": "交通部觀光局民國 104 年起推動的「觀光大國行動方案（ 104-107 年）」，其核心理念為何？", "opts": ["質量優化，價值提升 [B] 區域均衡，環保永續", "跨域整合，行政中立 [D] 公私合作，產學交流", "", ""], "ans": 0}, {"num": 18, "text": "依發展觀光條例第 27 條規定，下列何者得由非旅行業者代售？", "opts": ["國內海、路、空運輸業之客票 [B] 旅行業之國內旅遊商品", "國內外機票 [D] 甲種旅行業之國內外旅遊商品", "", ""], "ans": 0}, {"num": 19, "text": "依發展觀光條例第 5 條之規定，觀光產業之國際宣傳及推廣，由中央主管機關綜理，並力求：", "opts": ["國際化、本土化、觀光化 [B] 國際化、本土化、人文化", "國際化、區域化、人文化 [D] 國際化、本土化、區域均衡化 代號： 2601 頁次： 8 － 3", "", ""], "ans": 3}, {"num": 20, "text": "依發展觀光條例第 18 條規定，具有大自然之優美景觀、生態、文化與人文觀光價值之地區，應規劃 建設為何種遊憩區？", "opts": ["自然人文生態景觀區 [B] 風景特定區", "觀光遊樂區 [D] 觀光地區", "", ""], "ans": 3}, {"num": 21, "text": "依發展觀光條例規定，下列何者並無發給觀光專用標識？", "opts": ["觀光旅館業 [B] 觀光遊樂業 [C] 旅行業 [D] 旅館業及民宿", "", "", ""], "ans": 2}, {"num": 22, "text": "依發展觀光條例規定，觀光產業之綜合開發計畫，由下列那一個機關擬訂，報請那一個機關核定後 實施：", "opts": ["由交通部觀光局擬訂，報請交通部核定後實施", "由交通部觀光局擬訂，報請行政院核定後實施", "由交通部擬訂，報請行政院核定後實施", "由各直轄市、縣、市政府擬訂，報請交通部轉請行政院核定後實施"], "ans": 2}, {"num": 23, "text": "某外語領隊人員於領取執業證後因故未執行該領隊業務，依領隊人員管理規則規定，需重行參加訓 練結業，換領執業證後，始得執行領隊業務。下列敘述何者錯誤？", "opts": ["在執業證 3 年之有效期間內如無執行領隊業務，需重行參加職前訓練", "重行參加訓練之節次為職前訓練節次之二分之一", "重行訓練期間如缺課節數逾十分之一者，應予退訓，已繳納之訓練費用不得退還", "重行訓練報名繳費後，如因重病或其他正當事由無法受訓，已繳納之訓練費用亦不得全額退還"], "ans": 3}, {"num": 24, "text": "依領隊人員管理規則有關領隊人員執業之規定，下列何者錯誤？", "opts": ["領隊人員需受旅行業之僱用或指派執行領隊帶團出國業務", "外語領隊人員係執行引導國人出國旅行團體旅遊業務", "華語領隊人員係執行引導國人赴香港、澳門、大陸地區旅行團體旅遊業務", "外語領隊人員不得執行引導國人赴香港、澳門、大陸地區旅行團體旅遊業務"], "ans": 3}, {"num": 25, "text": "下列有關旅遊營業人之敘述，何者正確？", "opts": ["所謂旅遊營業人，係指提供旅客旅遊服務為營業而收取旅遊小費之人", "所謂旅遊服務，係指旅遊營業人只要負責安排導遊服務即可", "旅遊開始後，旅遊營業人終止旅遊契約時，旅客得請求旅遊營業人墊付費用將其送回第三地", "旅遊開始前，旅客得變更由第三人參加旅遊。旅遊營業人非有正當理由，不得拒絕"], "ans": 3}, {"num": 26, "text": "旅遊未完成前，下列有關旅客終止契約之規定，何者正確？", "opts": ["旅客不得隨時終止契約", "旅客得隨時終止契約，但應賠償旅行社因契約終止而生之損害", "旅客不得隨時終止契約，旅行社亦無義務將旅客送回原出發地", "旅客得隨時終止契約，但不得請求旅行社墊付費用，將其送回原出發地"], "ans": 1}, {"num": 27, "text": "旅遊需要旅客之行為始能完成，而旅客不為其行為者，依民法規定，旅遊營業人要如何處理？", "opts": ["直接終止契約 [B] 請旅行公會協助處理", "向法院提起訴訟解決 [D] 定相當期限，催告旅客為之 代號： 2601 頁次： 8 － 4", "", ""], "ans": 3}, {"num": 28, "text": "依國外旅遊定型化契約範本規定，下列何者不包含於旅遊費用內？", "opts": ["簽證費 [B] 機場服務費 [C] 行李接送費 [D] 司機小費", "", "", ""], "ans": 3}, {"num": 29, "text": "因可歸責於旅行社之事由，致旅客之旅遊活動無法成行，旅行社於出發當日始通知旅客，依國外旅 遊定型化契約範本規定，旅行社應賠償旅客旅遊費用百分之多少的違約金？", "opts": ["三十 [B] 四十 [C] 五十 [D] 一百", "", "", ""], "ans": 3}, {"num": 30, "text": "依國外旅遊定型化契約範本規定，契約簽訂後，有關旅行社之變更，下列何者正確？", "opts": ["旅行社得任意將契約轉由其他旅行社承辦", "旅客不為反對之意思表示，旅行社即得將契約轉由其他旅行社承辦", "非經旅客書面同意，不得將契約轉由其他旅行社承辦", "旅客出發後始發覺，契約已轉由其他旅行社承辦時，即不得請求賠償"], "ans": 2}, {"num": 31, "text": "張先生參加日本 5 日團並繳清團費新臺幣 30,000 元，旅遊活動開始後，因旅行社重大過失，將張先 生留滯國外 2 日，依國外旅遊定型化契約範本規定，旅行社除應負擔張先生被留滯期間所支出與旅 遊契約所定同等級之食宿、返國交通費用或其他必要費用外，並應賠償張先生新臺幣多少元之違約 金？", "opts": ["30,000 [B] 36,000 [C] 66,000 [D] 90,000", "", "", ""], "ans": 1}, {"num": 32, "text": "旅遊途中因不可抗力或不可歸責於旅行業之事由，致無法依預定之旅程、食宿或遊覽項目等履行時 ，為維護契約旅遊團體之安全及利益，旅行業得變更旅程、遊覽項目或更換食宿、旅程，若因變更 致減少支出費用，依國外旅遊定型化契約範本規定，旅行業應將減少費用退還多少給旅客？", "opts": ["退還全部 [B] 退還百分之七十 [C] 退還百分之五十 [D] 退還百分之三十", "", "", ""], "ans": 0}, {"num": 33, "text": "出發前，旅遊團所前往旅遊地區之一，有事實足認危害旅客生命、身體、健康、財產安全之虞者， 依國外旅遊定型化契約範本規定，下列敘述何者正確？", "opts": ["旅客得解除契約，且無需補償旅行社任何費用", "旅行社得解除契約，但應補償旅客部分旅遊費用", "旅客得解除契約，旅行社僅得扣除已支付之必要費用後，退還旅客已繳交之餘款", "旅行社得解除契約，旅客無需支付任何費用"], "ans": 1}, {"num": 34, "text": "旅客參加旅行社之旅行團，其行程之一為參觀古蹟，旅客於當天自行出外活動，致未能及時隨團出 遊，依國外旅遊定型化契約範本規定，旅客可向旅行社作何項請求？", "opts": ["退還費用 [B] 賠償損失 [C] 安排其他活動 [D] 不能請求", "", "", ""], "ans": 3}, {"num": 35, "text": "民國 105 年 3 月 8 日馬小姐在旅行社安排下於東京特定場所購物，返國後發現其所購物品有瑕疵， 依國外旅遊定型化契約範本規定，馬小姐得於何時以前，請求旅行社協助其處理？", "opts": ["105 年 4 月 8 日 [B] 105 年 5 月 8 日 [C] 105 年 6 月 8 日 [D] 105 年 7 月 8 日", "", "", ""], "ans": 0}, {"num": 36, "text": "甲旅行社原定 12 月 15 日出發之紐澳之旅，因原負責本案旅遊專員乙於 12 月 1 日離職，丙接辦時發 現，本案一直未達契約所定最低組團人數 15 人， 12 月 12 日通知已簽約之旅客丁解除契約，依國外 旅遊定型化契約範本規定，丁得為何種主張？", "opts": ["請求甲依約繼續出團 [B] 請求甲延後出團 [C] 向甲請求損害賠償 [D] 向甲請求降低團費 代號： 2601 頁次： 8 － 5", "", "", ""], "ans": 2}, {"num": 37, "text": "王先生參加旅行社 7 日之出國旅遊團，行程第 5 日如原定參觀每人門票新臺幣 200 元之展覽行程， 因前日行程更動致漏未參觀，王先生可要求旅行社賠償新臺幣多少元？", "opts": ["200 [B] 400 [C] 500 [D] 600", "", "", ""], "ans": 1}, {"num": 38, "text": "依國外旅遊定型化契約應記載及不得記載事項中，所規定不得記載事項，不包括下列何者？", "opts": ["約定旅行社得安排之購物行程 [B] 旅客對旅行業片面變更契約內容不得異議", "排除對旅行業履行輔助人所生責任之約定 [D] 旅行業對旅客所負義務排除原刊登之廣告內容", "", ""], "ans": 0}, {"num": 39, "text": "王先生參加旅行社 6 日出國旅行團，團費新臺幣 3 萬元，第 1 天因旅行社未訂妥機位，致轉機時延 誤行程 6 小時，依國外旅遊定型化契約範本規定，旅行社應賠償王先生新臺幣多少元？", "opts": ["2,500 [B] 5,000 [C] 7,500 [D] 10,000", "", "", ""], "ans": 1}, {"num": 40, "text": "旅客參加國外旅行團，依國外旅遊定型化契約範本規定，下列何種情形得向旅行社求償？", "opts": ["旅遊目的地發生兵變，外交部考量國人出國旅遊安全，發布紅色旅遊警示，不宜前往，故旅行團 無法成行", "旅客因自己之疏忽看錯飛機航班時間，未趕上團體行程", "航空公司團體機位超賣，旅行社在同一時間安排旅客改搭其他航空公司班機", "原定安排參觀博物館，因導遊調整行程順序，致旅客前往時已逾開放時間"], "ans": 3}, {"num": 41, "text": "具下列何種身分人員之護照末頁，應加蓋「持照人出國應經核准」及「尚未履行兵役義務」等二種 戳記？", "opts": ["國軍人員 [B] 替代役役男 [C] 未具僑民身分之役男 [D] 接近役齡男子", "", "", ""], "ans": 2}, {"num": 42, "text": "男子年滿 14 歲起至年滿 15 歲當年之 12 月 31 日前，申請護照者，主管機關核發效期多少年以下之 護照？", "opts": ["15 [B] 10 [C] 6 [D] 5", "", "", ""], "ans": 3}, {"num": 43, "text": "年齡 40 歲以上之我國國民護照遺失，補發之護照效期為多少年？", "opts": ["1 [B] 2 [C] 3 [D] 5", "", "", ""], "ans": -1}, {"num": 44, "text": "國人遺失護照而不及等候駐外館處補發護照者，我駐外館處得發給當事人何種證件持憑返國？", "opts": ["入國許可證副本 [B] 入境證副本 [C] 入國證明書 [D] 護照遺失報案證明", "", "", ""], "ans": 2}, {"num": 45, "text": "外國人有下列何種情形，內政部移民署不列為強制驅逐出國之對象？", "opts": ["未經查驗入國", "從事與申請停留、居留原因不符之活動或工作", "在我國有犯罪紀錄", "離婚後取得在臺已設有戶籍未成年親生子女監護權"], "ans": 3}, {"num": 46, "text": "外國人在我國停留期間，不得從事下列何種活動？", "opts": ["觀光 [B] 探親 [C] 訪友 [D] 遊行", "", "", ""], "ans": 3}, {"num": 47, "text": "有戶籍國民入國（回臺），應備何種證件，經查驗後入國？", "opts": ["有效護照 [B] 有效入國許可", "有效護照及登機證 [D] 有效入國許可及入國登記表 代號： 2601 頁次： 8 － 6", "", ""], "ans": 0}, {"num": 48, "text": "外國人離開我國時填繳表單之規定：", "opts": ["應填繳出國登記表 [B] 應填繳入出國登記表 [C] 應填繳入國登記表 [D] 免填繳出國登記表", "", "", ""], "ans": 3}, {"num": 49, "text": "役男申請出境至大陸地區就學者，應取得教育部所採認大陸地區何種正式學歷學校之入學許可？", "opts": ["高中 [B] 專科 [C] 大學校院 [D] 沒限制", "", "", ""], "ans": 2}, {"num": 50, "text": "研發替代役役男於服役期間，配偶居留美國且取得美國居留權，提出申請出國前往探親的相關規定為：", "opts": ["不得申請 [B] 於第一階段服役期間可以申請", "於第二階段服役期間可以申請 [D] 於第三階段服役期間可以申請", "", ""], "ans": 3}, {"num": 51, "text": "依廣告品及貨樣進口通關辦法規定，旅客入境攜帶貨樣，其完稅價格在新臺幣多少元以下，依海關 規定准予免稅？", "opts": ["10,000 [B] 12,000 [C] 20,000 [D] 24,000", "", "", ""], "ans": 1}, {"num": 52, "text": "依役男出境處理辦法，役男出境逾規定期限返國，在不予受理出境申請期間，如因其直系血親病危 ，須出境探病，其出境相關規定為：", "opts": ["仍應不予受理出境申請 [B] 得准予出境 7 日", "得准予出境 15 日 [D] 得准予出境 30 日", "", ""], "ans": 3}, {"num": 53, "text": "依入境旅客攜帶行李物品報驗稅放辦法規定，入境旅客攜帶貨樣、機器零件等之總值限額美幣多少 元，免辦輸入許可證？", "opts": ["1 萬 [B] 2 萬 [C] 3 萬 [D] 4 萬", "", "", ""], "ans": 1}, {"num": 54, "text": "陸客來臺觀光，攜帶人民幣 2 萬元，入境的申報規定為：", "opts": ["免填申報單，可走綠線檯 [B] 應填申報單，走紅線檯", "應填申報單，可走綠線檯 [D] 應自行封存於海關", "", ""], "ans": 0}, {"num": 55, "text": "下列那一種身分人員首次申請護照，不必繳附兵役證明文件？", "opts": ["替代役役男 [B] 國軍人員 [C] 後備軍人 [D] 接近役齡男子", "", "", ""], "ans": 3}, {"num": 56, "text": "入境人員攜帶動物或植物檢疫物入境，檢疫物如來自禁止輸入疫區或經禁止輸入疫區轉換運輸工具 而不符合規定者，應如何處理？", "opts": ["應予退運或銷燬", "隔離觀察 14 天，無發現疫病蟲害後放行", "經適當消毒處理後放行", "檢附輸出國核發之檢疫證明書，申報檢疫合格後放行"], "ans": 0}, {"num": 57, "text": "持我國護照到下列那一個國家不適用免簽證規定？", "opts": ["比利時 [B] 荷蘭 [C] 波蘭 [D] 俄羅斯", "", "", ""], "ans": 3}, {"num": 58, "text": "馬來西亞政府給予我國國民免簽證入境待遇，停留期限最長多久？", "opts": ["15 日 [B] 30 日 [C] 90 日 [D] 180 日", "", "", ""], "ans": 1}, {"num": 59, "text": "外國人在國外申請我國之單次入境居留簽證，每件美金多少元？", "opts": ["36 [B] 66 [C] 76 [D] 86", "", "", ""], "ans": 1}, {"num": 60, "text": "前往非洲南撒哈拉沙漠地區的成年旅客，至少要在出發幾天前接種流行性腦脊髓膜炎疫苗？", "opts": ["1 [B] 3 [C] 5 [D] 10 代號： 2601 頁次： 8 － 7", "", "", ""], "ans": 3}, {"num": 61, "text": "使用燃料式電池系統為動力之可攜式電子裝置（如攝影器材、手提電腦），每人攜帶備用燃料電池 匣上飛機，最多不可超過幾個？", "opts": ["1 [B] 2 [C] 3 [D] 4", "", "", ""], "ans": 1}, {"num": 62, "text": "下列關於新臺幣結匯申報之敘述，何者 const TOTAL_TIME = 3600;
const KEYS = ['A','B','C','D'];
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let userAnswers = {};
let submitted = false;

function isCorrect(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}

function getCorrectLabel(q) {
  if (q.ans === -1) return '本題一律給分';
  if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
  return KEYS[q.ans] + '：' + q.opts[q.ans];
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (q.ans === -1 ? ' invalid' : '');
    card.id = 'card-' + qi;
    const opts = q.opts.map((opt, i) => {
      const blank_rendered = q.text.includes('______');
      return `<button class="option-btn" id="opt-${qi}-${i}" onclick="selectAnswer(${qi}, ${i})" data-qi="${qi}" data-i="${i}">
        <span class="opt-label">${KEYS[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
</body>
