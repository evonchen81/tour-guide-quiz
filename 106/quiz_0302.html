<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei",Arial,sans-serif;background:#f0f4f8;color:#333}
.header{background:linear-gradient(135deg deg,#1a4a70,#2c5f8a);color:#fff;padding:16px 20px}
.header h1{font-size:1.2rem;font-weight:700}
.header .meta{font-size:.85rem;opacity:.9;margin-top:4px}
.timer-bar{background:#fff;border-bottom:2px solid #e0e0e0;padding:8px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.timer{font-size:1.4rem;font-weight:700;color:#1a4a70;font-variant-numeric:tabular-nums}
.timer.warning{color:#e74c3c}
.progress-text{font-size:.85rem;color:#666}
.container{max-width:860px;margin:0 auto;padding:20px 16px}
.question-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.question-card.answered-correct{border-left:4px solid #27ae60}
.question-card.answered-wrong{border-left:4px solid #e74c3c}
.question-card.invalid{border-left:4px solid #95a5a6;opacity:.7}
.q-num{font-size:.8rem;color:#888;margin-bottom:6px}
.q-text{font-size:1rem;line-height:1.6;margin-bottom:14px}
.q-blank{display:inline-block;border-bottom:2px solid #333;min-width:60px;margin:0 2px}
.options{display:flex;flex-direction:column;gap:8px}
.option-btn{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border:2px solid #e0e0e0;border-radius:8px;cursor:pointer;text-align:left;background:#fff;font-size:.95rem;line-height:1.5;transition:.15s}
.option-btn:hover:not(:disabled){border-color:#2c5f8a;background:#f0f4f8}
.option-btn.selected{border-color:#2c5f8a;background:#e8f0f8}
.option-btn.correct{border-color:#27ae60;background:#e8f8ed;color:#1a6b3d}
.option-btn.wrong{border-color:#e74c3c;background:#fdecea;color:#c0392b}
.option-btn:disabled{cursor:default}
.opt-label{font-weight:700;min-width:20px}
.result-box{margin-top:10px;padding:8px 12px;border-radius:6px;font-size:.9rem;display:none}
.result-box.correct{background:#e8f8ed;color:#1a6b3d;display:block}
.result-box.wrong{background:#fdecea;color:#c0392b;display:block}
.submit-area{text-align:center;padding:20px 0 40px}
.submit-btn{background:#2c5f8a;color:#fff;border:none;padding:14px 40px;border-radius:10px;font-size:1.1rem;font-weight:700;cursor:pointer}
.submit-btn:hover{background:#1a4a70}
.score-bar{background:#fff;border-top:2px solid #e0e0e0;padding:16px 20px;text-align:center;display:none;position:sticky;bottom:0}
.score-num{font-size:1.6rem;font-weight:700;color:#1a4a70}
.back-btn{display:inline-block;margin-top:8px;color:#2c5f8a;text-decoration:none;font-size:.9rem}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border:2px solid #e0e0e0;border-radius:20px;cursor:pointer;font-size:.85rem;background:#fff}
.filter-btn.active{border-color:#2c5f8a;background:#2c5f8a;color:#fff}
</style>

<script>
const QUESTIONS = [{"num": 1, "text": "「初，半線初闢，平原萬頃，溪流分注，而農功未啟，荒穢於鹿豕之鄉。五十八年，世榜集流民， 以開東螺之野，並引濁水歧流以溉。」後來開鑿完成的這條水圳為何？", "opts": ["大安圳", "大甲圳", "鳳山圳", "八堡圳"], "ans": 3}, {"num": 2, "text": "一位日本自助旅行的年輕人來臺旅行，想要參訪原日治時期在臺灣就有的大專院校。拿一份學校名 單向你請教，下列名單中那一間學校應是原日治時期在臺灣即已設立的學校？", "opts": ["交通大學", "清華大學", "東吳大學", "成功大學"], "ans": 3}, {"num": 3, "text": "下列何者不是戰後來臺定居的國畫大師？", "opts": ["張大千", "黃君璧", "溥儒", "李梅樹"], "ans": 3}, {"num": 4, "text": "法國那一位國王自稱「太陽王」，而且被視為歐洲專制君主的典範？", "opts": ["路易十三", "路易十四", "路易十五", "路易十六"], "ans": 1}, {"num": 5, "text": "「英法百年戰爭」中，激起愛國意識，呼籲民眾保家衛國，而被敵國燒死的是何人？", "opts": ["南丁格爾", "抹大拉瑪麗亞", "血腥瑪莉", "聖女貞德"], "ans": 3}, {"num": 6, "text": "非洲地區為了協助殖民地之獨立與促進非洲的團結合作，在西元 1963 年成立了那一個組織？", "opts": ["非洲聯盟（ African Union ）", "非洲團結組織（ Organization of African Unity ）", "非洲聯盟委員會（ African Union Commission ）", "伊斯蘭會議組織（ Organization of the Islamic Conference ）"], "ans": 1}, {"num": 7, "text": "下列那項和約與 17 世紀歐洲逐漸形成以主權國家為主體、講求國家主權平等的「列國制度」密切相 關？", "opts": ["西發里亞（ Westphalia ）和約", "巴黎（ Paris ）和約", "倫敦（ London ）和約", "米蘭（ Milan ）和約"], "ans": 0}, {"num": 8, "text": "古埃及民間盛行崇拜「奧賽利斯（ Osiris ）」，「奧賽利斯」是何種神明？", "opts": ["太陽神", "陰間之神", "水神", "戰爭之神"], "ans": 1}, {"num": 9, "text": "中古歐洲晚期，義大利各城邦陸續出現文藝復興運動，以下有關此運動之敘述，何者有誤？", "opts": ["時間大約是在 14 至 16 世紀", "受到希臘與羅馬文學的影響", "義大利大一統政局的推波助瀾", "核心思維之一是人文主義"], "ans": 2}, {"num": 10, "text": "歐洲中世紀修會的某個分會會規如此陳述：「兄弟們不能私有任何東西；無論是一所房屋、一塊地、 或其他東西，都不能擁有；但應自視是這世界上的朝聖者和外方人，以貧窮和謙讓服侍天主，富有 信心的沿路乞食。」這最可能是那一個修會的會規？", "opts": ["本篤會（ Benedictine Confederation ）", "西多會（ Cistercians ）", "方濟會（ Franciscans ）", "耶穌會（ Society of Jesus ）"], "ans": 2}, {"num": 11, "text": "11 世紀基督教東西教會分裂後，拜占庭帝國境內信仰的基督教又被稱為：", "opts": ["東基督教", "羅馬公教", "希臘正教", "西基督教"], "ans": 2}, {"num": 12, "text": "第二次世界大戰後所成立的許多新興國家，大部分在經濟上都屬低度開發。在西元 1955 年的一場會 議之後，以「第三世界（ The Third World ）」指稱這類國家，以別於美國與蘇聯等資本主義國家或共 產主義工業化國家，該會議的名稱是：", "opts": ["開羅會議（ Cairo Conference ）", "亞非會議（ Asian-African Conference ）", "雅爾達會議（ Yalta Conference ）", "波茨坦會議（ Potsdam Conference ）"], "ans": 1}, {"num": 13, "text": "馬克思（ Karl Marx ）曾經稱讚某一歷史文獻是「人類歷史上的第一個人權宣言」，此一文獻概念源 於歐洲啓蒙運動的「天賦人權」思想，宣示「主權在民」主張，此一文獻指的是：", "opts": ["共產宣言（ The Communist Manifesto ）", "人權與公民權宣言（ Declaration of the Rights of Man and Citizen ）", "獨立宣言（ Declaration of Independence ）", "網球場宣言（ Oath of the Tennis Court ）"], "ans": 2}, {"num": 14, "text": "下列何者與拿破崙政權垮臺無關？", "opts": ["經濟封鎖英國", "半島戰爭", "入侵埃及", "與俄國開戰"], "ans": 2}, {"num": 15, "text": "由於帝國的擴張，促成歐亞大陸長距離貿易之發展，加上軍隊與商隊之頻繁移動，將源自東方的鼠 疫傳入歐洲，於 14 世紀造成大量人口死亡，此一帝國為：", "opts": ["羅馬帝國", "伊斯蘭帝國", "蒙古帝國", "鄂圖曼帝國"], "ans": 2}, {"num": 16, "text": "歐洲宗教改革之後，那位英國君主在位期間因離婚問題與羅馬教廷決裂，成立「英國國教」？", "opts": ["亨利七世", "亨利八世", "瑪麗一世", "伊莉莎白一世"], "ans": 1}, {"num": 17, "text": "旅行團參觀一座古代建築，發現正面柱廊刻了一行文字，意為：「呂奇烏斯的兒子，三度執政官瑪 爾庫斯．阿格里巴建造此廟」。這一座古代建築是：", "opts": ["帕德嫩神廟（ Parthenon ）", "卡納克神廟（ Karnak ）", "萬神廟（ Pantheon ）", "德爾菲神廟（ Delphi ）"], "ans": 2}, {"num": 18, "text": "巴黎聖母院（ Notre-Dame ）是歐洲中世紀哥德式建築的經典，融和各種建築元素，下列何者非其特 色？", "opts": ["尖拱門", "飛梁", "圓頂", "彩色玻璃"], "ans": 2}, {"num": 19, "text": "美國新聞從業人員，最高的榮譽為何種獎項？", "opts": ["葛萊美獎", "金球獎", "艾美獎", "普立茲獎"], "ans": 3}, {"num": 20, "text": "有關 20 世紀初期美國政治和社會文化的敘述，下列何者錯誤？", "opts": ["第一次世界大戰結束後，美國婦女獲得了投票權", "紐奧良普遍被視為爵士樂的發源地", "第一次世界大戰結束後，美國加入國際聯盟", "小說家海明威的作品《戰地春夢》、《老人與海》等，是 20 世紀美國文學的代表作"], "ans": 2}, {"num": 21, "text": "發明留聲機的科學家是：", "opts": ["愛迪生", "富蘭克林", "摩斯", "華生"], "ans": 0}, {"num": 22, "text": "下列那一個是英國首度向北美殖民地直接徵稅的稅法，造成殖民地人民的不滿，而喊出「沒有代表， 不納稅（ No taxation without representation ）」？", "opts": ["印花稅", "茶葉稅", "土地稅", "遺產稅"], "ans": 0}, {"num": 23, "text": "下列何者是起草美國獨立宣言的重要開國人物之一？", "opts": ["富蘭克林", "漢米爾頓", "林肯", "羅斯福"], "ans": 0}, {"num": 24, "text": "建成於 9 世紀上半葉的中爪哇日惹，為目前世界上最大的佛寺，該建築是：", "opts": ["馬丘比丘（ Machu Picchu ）", "婆羅浮屠（ Borobudur Temple ）", "摩訶菩提佛寺（ Mahabodhi Temple ）", "布特勒佛塔（ Boudha Stupa ）"], "ans": 1}, {"num": 25, "text": "在經濟大恐慌期間，美國總統羅斯福採行那位經濟學家的理論，用消費來刺激繁榮，推行一連串「新 政」措施？", "opts": ["恩格斯（ Friedrich Engels ）", "凱因斯（ John Maynard Keynes ）", "亞當斯密（ Adam Smith ）", "李嘉圖（ David Ricardo ）"], "ans": 1}, {"num": 26, "text": "在拿破崙戰爭時期，領導南美各邦組織「大哥倫比亞共和國」（ Gran Colombia ），被中南美洲人民 共推為解放者的是：", "opts": ["切革瓦拉（ Che Guevara ）", "伊達爾哥（ Miguel Hidalgo ）", "卡斯楚（ Fidel Castro ）", "玻利瓦（ Simón Bolívar ）"], "ans": 3}, {"num": 27, "text": "日本於 12 世紀末至 19 世紀中形成封建勢力割據局面，史稱「幕府時代」，其中建立「江戶幕府」 的人是誰？", "opts": ["源賴朝", "織田信長", "豐臣秀吉", "德川家康"], "ans": 3}, {"num": 28, "text": "17 世紀時，東南亞那一國曾經在西班牙統治下，進行美洲與當地的帆船貿易？", "opts": ["菲律賓", "馬來西亞", "印尼", "新加坡"], "ans": 0}, {"num": 29, "text": "西元 1912 年至 1926 年間，日本所推行的政治體制與政策，其內容符合現代民主，實施政黨政治， 以眾議院多數黨黨魁組閣為慣例。此體制被稱為：", "opts": ["民本主義", "護憲運動", "藩閥政治", "大正民主"], "ans": 3}, {"num": 30, "text": "明治維新運動展開之後，日本政府於西元 1871 年派使節團前往歐美考察。根據此次考察經驗，日本 政府制定三大政策，其中不包含下列那一項？", "opts": ["殖產興業", "軍國主義", "文明開化", "富國強兵"], "ans": 1}, {"num": 31, "text": "歷經十字軍，歐洲 12 世紀逐漸從中世紀的商業停滯中復甦，貿易轉趨活絡，並開始出現一個國際性 的市集，將原有的兩大商業區義大利北部與法蘭德斯（ Flanders ）串連起來。這個國際性市集可能位 於那一個地區？", "opts": ["西班牙賽維爾（ Seville ）", "葡萄牙里斯本（ Lisbon ）", "法國香檳（ Champagne ）", "德國漢堡（ Hamburg ）"], "ans": 2}, {"num": 32, "text": "清代曾將藏傳佛教分為四大教區，請問它們分別為何？", "opts": ["達賴主前藏，班禪主後藏，哲布尊丹巴主喀爾喀蒙古，章嘉胡土克圖主內蒙古", "班禪主前藏，達賴主後藏，哲布尊丹巴主內蒙古，章嘉胡土克圖主喀爾喀蒙古", "哲布尊丹巴主前藏，章嘉胡土克圖主後藏，達賴主喀爾喀蒙古，班禪主內蒙古", "達賴主前藏，班禪主後藏，曇無德主喀爾喀蒙古，鳩摩羅什主內蒙古"], "ans": 0}, {"num": 33, "text": "請問臺北故宮所收藏的汝窯青瓷，是屬於中國歷史上那一個時期的產品？", "opts": ["秦代", "漢代", "商代", "宋代"], "ans": 3}, {"num": 34, "text": "湖南長沙馬王堆漢墓出土的古地圖，反映西漢初年朝廷與何處勢力的對峙？", "opts": ["七國之亂", "楚國", "匈奴", "南越國"], "ans": 3}, {"num": 35, "text": "隋唐時代為中國佛教極盛時期，以翻譯佛經的功勞而言，下列何人貢獻最大？", "opts": ["玄奘", "法海", "道遠", "僧佑"], "ans": 0}, {"num": 36, "text": "臺灣第一座以史前和原住民文化為主，集合了博物館、考古遺址和自然生態公園的博物館，設於那 個史前文化遺址中？", "opts": ["八仙洞遺址", "圓山遺址", "十三行遺址", "卑南遺址"], "ans": 3}, {"num": 37, "text": "臺灣為了開採地方資源而修築一些產業鐵道，下列那二者係為開採煤礦而修築的產業鐵道？①平溪 線 ②內灣線 ③集集線 ④阿里山線", "opts": ["①②", "①③", "②④", "③④"], "ans": 0}, {"num": 38, "text": "臺灣鐵路局因應旅遊風潮，配合在地休閒產業，在車站外觀添加許多在地文化元素。下列那個車站 最可能加入鳳梨與飛行傘等裝飾？", "opts": ["瑞芳站", "民雄站", "鹿野站", "冬山站"], "ans": 2}, {"num": 39, "text": "夜市是外國遊客遊臺時必訪之地，也為臺灣創造了不容小覷的銅板經濟。夜市的經濟優勢主要來自 於攤販產生群落，可吸引大量觀光人潮，此優勢最適合以下列那一個概念來說明？", "opts": ["產業連鎖", "垂直分工", "水平合作", "聚集經濟"], "ans": 3}, {"num": 40, "text": "臺灣降雨時空分布不均，其中以中南部夏雨集中率較高。下列臺灣河川的那一種特色，與此現象關 係最密切？", "opts": ["河川東西分流", "河川坡陡流急", "河川多荒溪型", "河川東長西短"], "ans": 2}, {"num": 41, "text": "西元 2009 年莫拉克颱風導致南臺灣發生嚴重的水患，災後政府鼓勵屏東縣民眾「養水種電」，將受 災的魚塭空地租給業者架設太陽能面板發電以收取租金。改魚塭為「養水種電」，還可減緩下列那 項環境問題繼續惡化？", "opts": ["河水污染", "空氣污染", "地層下陷", "土壤液化"], "ans": 2}, {"num": 42, "text": "下列為臺灣中部五條河川（依首字筆畫排列），由北到南排列的正確順序為何？①大甲溪 ②大 安溪 ③中港溪 ④北港溪 ⑤後龍溪", "opts": ["①③⑤②④", "②①③⑤④", "③⑤②①④", "⑤②①③④"], "ans": 2}, {"num": 43, "text": "近年來中國積極援助非洲某國從事交通、教育等基礎建設，以換取穩定的石油供應。非洲某國最可 能是：", "opts": ["南非", "肯亞", "坦尚尼亞", "奈及利亞"], "ans": 3}, {"num": 44, "text": "上海市工商發達，與周邊的長江三角洲構成中國規模最大的經濟區。此經濟區工商發展快速和下列 那項因素關係最密切？", "opts": ["農產豐饒", "冬暖夏涼", "水運要津", "土壤肥沃"], "ans": 2}, {"num": 45, "text": "近年來中國在邊界地區開闢不少通商口岸，其中「霍爾果斯」口岸處處可見金髮藍眼的白皮膚商人。 該口岸最有可能位於下列那一個省級行政區？", "opts": ["雲南", "西藏", "廣西", "新疆"], "ans": 3}, {"num": 46, "text": "「柴達木盆地南邊的察爾汗鹽湖是青海省重要的產鹽區，在湖面中有座修築在鹽蓋上的鹽橋。鋪路 者把鹽渣用壓路機壓碎，再澆上清水，等乾了之後，鹽就結晶成為結實光滑的道路；路上若出現坑 洞，只要在坑洞內灑些鹽粒，澆上鹵水，鹽粒很快融化，並凝結在路面上，坑凹處便完好如初。」 引文中鹽橋的形成與下列那一項氣候特徵的關係最密切？", "opts": ["年均溫低", "蒸發旺盛", "日照不足", "日溫差大"], "ans": 1}, {"num": 47, "text": "下列中國的四大經濟圈中，何者擁有兩個直轄市？", "opts": ["成渝經濟圈", "珠三角經濟圈", "長三角經濟圈", "渤三角經濟圈"], "ans": 3}, {"num": 48, "text": "根據文獻記載，位於黑龍江省之五大連池的成因為：「一日地中忽出火，石塊飛騰，聲震四野，越 數日火熄，其地遂成池沼。」根據記載，五大連池的形成和下列那一作用關係最密切？", "opts": ["斷層作用", "火山作用", "河川襲奪", "冰蝕作用"], "ans": 1}, {"num": 49, "text": "香港具有山多平原少與海岸線曲折的地形特色，造就了許多獨特的觀光資源，如維多利亞港夜景、 太平山頂勝景與大嶼山頂上建大佛等。這些觀光資源的形成，與香港屬於下列那一種海岸地形有關？", "opts": ["", "", "", ""], "ans": 3}, {"num": 50, "text": "美洲印第安人的阿茲特克文明，主要分布於下列何地？", "opts": ["墨西哥高原", "西印度群島", "猶加敦半島", "安地斯山脈"], "ans": 0}, {"num": 51, "text": "五大湖區是美國的主要工業區。就傳統工業而言，該工業區以下列那二項區位條件最具優勢？", "opts": ["技術與市場", "勞工與地價", "政策與資金", "原料與運輸"], "ans": 3}, {"num": 52, "text": "歐洲在阿爾卑斯山以北、波羅的海以南的地區多東西向的運河，這些運河的區位和下列何者有關？", "opts": ["河川的流向", "冰河的退縮方向", "斷層線延伸的方向", "褶曲向斜谷的走向"], "ans": 1}, {"num": 53, "text": "歐盟各國合作致力生產民用飛機，其中以空中巴士公司最為有名。空中巴士公司的飛機組裝總廠位 於下列那一個國家？", "opts": ["法國", "德國", "比利時", "西班牙"], "ans": 0}, {"num": 54, "text": const TOTAL_TIME = 3600;
const KEYS = ['A','B','C','D'];
let timeLeft = TOTAL_TIME;
let timerInterval = null;
let userAnswers = {};
let submitted = false;

function isCorrect(q, sel) {
  if (q.ans === -1) return true;
  if (Array.isArray(q.ans)) return q.ans.includes(sel);
  return q.ans === sel;
}

function getCorrectLabel(q) {
  if (q.ans === -1) return '本題一律給分';
  if (Array.isArray(q.ans)) return '正確答案：' + q.ans.map(i => KEYS[i]).join(' 或 ');
  return KEYS[q.ans] + '：' + q.opts[q.ans];
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card' + (q.ans === -1 ? ' invalid' : '');
    card.id = 'card-' + qi;
    const opts = q.opts.map((opt, i) => {
      const blank_rendered = q.text.includes('______');
      return `<button class="option-btn" id="opt-${qi}-${i}" onclick="selectAnswer(${qi}, ${i})" data-qi="${qi}" data-i="${i}">
        <span class="opt-label">${KEYS[i]}</span>
        <span>${opt}</span>
      </button>`;
    }).join('');
    const qtext = q.text.replace(/______/g, '<span class="q-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
    card.innerHTML = `
      <div class="q-num">第 ${q.num} 題${q.ans === -1 ? '（本題無效）' : ''}</div>
      <div class="q-text">${qtext}</div>
      <div class="options">${opts}</div>
      <div class="result-box" id="result-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qi, i) {
  if (submitted) return;
  const q = QUESTIONS[qi];
  userAnswers[qi] = i;
  // Update UI
  for (let k = 0; k < 4; k++) {
    const btn = document.getElementById(`opt-${qi}-${k}`);
    if (btn) btn.classList.remove('selected');
  }
  const selBtn = document.getElementById(`opt-${qi}-${i}`);
  if (selBtn) selBtn.classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('progress').textContent = `已答 ${answered} / ${QUESTIONS.length} 題`;
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  clearInterval(timerInterval);

  let correct = 0, invalid = 0;
  QUESTIONS.forEach((q, qi) => {
    const sel = userAnswers[qi];
    const card = document.getElementById('card-' + qi);
    const result = document.getElementById('result-' + qi);

    if (q.ans === -1) {
      invalid++;
      result.className = 'result-box correct';
      result.textContent = '本題無效，一律給分';
      card.classList.add('answered-correct');
      correct++;
    } else if (sel === undefined) {
      result.className = 'result-box wrong';
      result.textContent = '未作答。' + getCorrectLabel(q);
      card.classList.add('answered-wrong');
    } else if (isCorrect(q, sel)) {
      correct++;
      card.classList.add('answered-correct');
      result.className = 'result-box correct';
      result.textContent = '✓ 答對了！';
    } else {
      card.classList.add('answered-wrong');
      result.className = 'result-box wrong';
      result.textContent = '✗ 答錯了。' + getCorrectLabel(q);
    }

    // Disable all options & show correct
    for (let k = 0; k < 4; k++) {
      const btn = document.getElementById(`opt-${qi}-${k}`);
      if (!btn) continue;
      btn.disabled = true;
      if (q.ans !== -1 && (Array.isArray(q.ans) ? q.ans.includes(k) : q.ans === k)) {
        btn.classList.add('correct');
      } else if (sel === k && !isCorrect(q, k)) {
        btn.classList.add('wrong');
      }
    }
  });

  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = `得分：${correct} / ${total} 題（${pct}%）`;
  document.getElementById('scoreDetail').textContent = `（無效題：${invalid} 題）`;
  document.getElementById('scoreBar').style.display = 'block';
  document.getElementById('submitArea').style.display = 'none';
  document.getElementById('filterBar').style.display = 'flex';
}

function filterQ(mode) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  QUESTIONS.forEach((q, qi) => {
    const card = document.getElementById('card-' + qi);
    const sel = userAnswers[qi];
    let show = true;
    if (mode === 'wrong') {
      show = card.classList.contains('answered-wrong') || (!submitted && sel === undefined);
      if (!submitted) show = false;
      show = card.classList.contains('answered-wrong');
    } else if (mode === 'correct') {
      show = card.classList.contains('answered-correct');
    } else if (mode === 'unanswered') {
      show = sel === undefined;
    }
    card.style.display = show ? '' : 'none';
  });
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    const el = document.getElementById('timer');
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timeLeft <= 300) el.classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitQuiz(); }
  }, 1000);
}

renderQuestions();
startTimer();
</script>
</body>
